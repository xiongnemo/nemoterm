name: Owned handle metadata diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/handle_snapshot.py'
      - 'tests/handle_snapshot_native_test.py'
      - 'tests/handle_trace*'
      - 'tests/thread_snapshot*'
      - '.github/workflows/handle-snapshot.yml'
  pull_request:
    paths:
      - 'tests/handle_snapshot.py'
      - 'tests/handle_snapshot_native_test.py'
      - 'tests/handle_trace*'
      - 'tests/thread_snapshot*'
      - '.github/workflows/handle-snapshot.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate process-local handle types and owned lifetime
        shell: pwsh
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
        run: |
          python --version
          python tests/handle_snapshot_native_test.py --output research/handle-snapshot-native.json
          exit $LASTEXITCODE
      - name: Validate bounded handle creation, duplicate and close traces
        shell: pwsh
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
        run: |
          python -m pip install frida==17.24.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/handle_trace_native_test.py --output research/handle-trace-native.json
          exit $LASTEXITCODE
      - name: Validate owned thread identities and exact retirement
        shell: pwsh
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
        run: |
          python tests/thread_snapshot_native_test.py --output research/thread-snapshot-native.json
          exit $LASTEXITCODE
      - name: Retain exact observer result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handle-snapshot-${{ matrix.runner }}-${{ github.sha }}
          path: |
            research/handle-snapshot-native.json
            tests/handle_snapshot.py
            tests/handle_snapshot_native_test.py
            research/handle-trace-native.json
            research/trace.json
            tests/handle_trace.js
            tests/handle_trace.py
            tests/handle_trace_native_test.py
            research/thread-snapshot-native.json
            tests/thread_snapshot.py
            tests/thread_snapshot_native_test.py
          if-no-files-found: error
          retention-days: 30
