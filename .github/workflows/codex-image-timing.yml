name: Real client image paste
on:
  workflow_call:
    inputs:
      bitmap_witness: {type: boolean, default: false}
      mixed_opencode: {type: boolean, default: false}
      mixed_bitmap: {type: boolean, default: false}
      image_files: {type: boolean, default: false}
      product_run: {required: true, type: string}
      product_commit: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  records:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      IMAGE_CLIENT: ${{ inputs.mixed_opencode && 'opencode' || 'codex' }}
    strategy:
      fail-fast: false
      matrix:
        input: [system, api]
        phase: ${{ fromJSON(inputs.mixed_opencode && '["composer","composer-no-title"]' || inputs.mixed_bitmap && '["idle"]' || '["immediate","idle"]') }}
        include: ${{ fromJSON((inputs.image_files || inputs.bitmap_witness || inputs.mixed_bitmap) && '[]' || '[{"input":"system","phase":"caption"}]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Check the readiness witness against recorded cells and VT bytes
        run: python tests/agent_ready_redraw_test.py
      - name: Fetch the exact single executable
        id: isolate
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/picture-keys-product
          $dir = New-Item -ItemType Directory -Path build/isolated-image
          $exe = Copy-Item -LiteralPath build/picture-keys-product/nemoterm.exe -Destination $dir.FullName -PassThru
          if (@(Get-ChildItem -Force -LiteralPath $dir.FullName).Count -ne 1) { throw 'The runtime directory must contain only nemoterm.exe' }
          $source = Get-Content -Raw build/picture-keys-product/SOURCE-HOST.json | ConvertFrom-Json
          if ((Get-FileHash -LiteralPath $exe.FullName).Hash -ne $source.Executable.SHA256 -or $exe.Length -ne $source.Executable.Bytes) { throw 'Isolated image differs from source manifest' }
          "NEMOTERM_TEST_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install and identify Sarasa Light
        run: scripts/prepare-remote-interaction.ps1
      - name: Install the exact real client
        run: |
          python -m pip install Pillow==13.0.0
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          npm ci --prefix "tools/$env:IMAGE_CLIENT-fixture" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
      - name: Check availability-only and actual Windows bitmap reads
        if: inputs.bitmap_witness
        run: python tests/clipboard_bitmap_witness.py
      - name: Submit generated clipboard pixels with both shortcuts
        env:
          INPUT_MODE: ${{ matrix.input }}
          CLIPBOARD_KIND: ${{ inputs.image_files && 'file' || 'bitmap' }}
          MIXED: ${{ inputs.mixed_bitmap && 'yes' || 'no' }}
          WITNESS: ${{ inputs.bitmap_witness && 'yes' || 'no' }}
          STARTUP_PHASE: ${{ matrix.phase }}
        run: |
          $clients=@(Get-ChildItem "tools/$env:IMAGE_CLIENT-fixture/node_modules" -Recurse -Filter "$env:IMAGE_CLIENT.exe")
          if ($clients.Count -ne 1) {throw "Expected one pinned native $env:IMAGE_CLIENT executable"}
          $opts=@('tests/agent_clipboard_smoke.py','--client',$env:IMAGE_CLIENT,'--client-exe',$clients[0].FullName)
          if ($env:MIXED -eq 'yes') {$opts+='--mixed-bitmap'}
          if ($env:STARTUP_PHASE -eq 'composer') {$opts+=@('--opencode-title','default')}
          if ($env:STARTUP_PHASE -eq 'composer-no-title') {$opts+=@('--opencode-title','disabled')}
          if ($env:WITNESS -eq 'yes') {$opts+='--witness-bitmap'}
          if ($env:INPUT_MODE -eq 'system') {$opts+='--system-input'}
          if ($env:CLIPBOARD_KIND -eq 'file') {$opts+='--image-file'}
          if ($env:STARTUP_PHASE -eq 'idle') {$opts+='--after-client-idle'} elseif ($env:STARTUP_PHASE -eq 'caption') {$opts+='--after-window-caption'} elseif ($env:STARTUP_PHASE -eq 'immediate' -and $env:CLIPBOARD_KIND -eq 'bitmap') {$opts+='--observe-first-miss'}
          python @opts
          exit $LASTEXITCODE
      - name: Retain the single-file identity after exercising the client
        if: ${{ !cancelled() && steps.isolate.outcome == 'success' }}
        shell: pwsh
        run: |
          $source = Get-Content -Raw build/picture-keys-product/SOURCE-HOST.json | ConvertFrom-Json
          $files = @(Get-ChildItem -Force -LiteralPath (Split-Path -Parent $env:NEMOTERM_TEST_EXE))
          if ($files.Count -ne 1 -or $files[0].Name -ne 'nemoterm.exe' -or $files[0].PSIsContainer) { throw 'Unexpected runtime directory contents' }
          $hash = (Get-FileHash -LiteralPath $files[0].FullName).Hash.ToLowerInvariant()
          [ordered]@{Source=$source; Fixture=$env:GITHUB_SHA; Files=@($files.Name); Bytes=$files[0].Length; SHA256=$hash} | ConvertTo-Json -Depth 8 | Set-Content build/isolated-image-receipt.json -Encoding utf8
          if ($hash -ne $source.Executable.SHA256 -or $files[0].Length -ne $source.Executable.Bytes) {throw 'Isolated image changed during interaction'}
      - name: Read exact child input for ten mixed-format clipboard cases
        if: ${{ !cancelled() && inputs.mixed_bitmap && !inputs.mixed_opencode && matrix.input == 'api' }}
        run: python tests/image_paste_protocol.py --mixed-formats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ env.IMAGE_CLIENT }}-${{ inputs.mixed_bitmap && 'mixed' || inputs.image_files && 'file' || inputs.bitmap_witness && 'reads' || 'image' }}-${{ matrix.input }}-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/isolated-image-receipt.json
            build/image-key-records/mixed-formats.json
            build/dib-witness-control.json
            research/agent-clipboard-${{ env.IMAGE_CLIENT }}.json
            research/agent-${{ env.IMAGE_CLIENT }}-ctrl*
            build/agent-image-*/*/*.json
            build/agent-image-*/*/at-paste.vt
            build/agent-image-*/*/after-caption-gesture.vt
            build/agent-image-*/*/clipboard 图片 sample.png
            build/agent-image-*/*/caption-after-key.png
            build/agent-image-*/*/client-output.log
            build/agent-image-*/*/first-miss.png
            build/agent-image-*/*/before-followup.*
            build/agent-image-*/*/failure*
            build/interaction-dependencies/environment.json
            build/picture-keys-product/SOURCE-HOST.json
          if-no-files-found: error
