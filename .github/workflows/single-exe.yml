name: Single executable from source

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: single-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-exe:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Retain native crash diagnostics on this disposable runner
        shell: pwsh
        run: ./scripts/native-crash-evidence.ps1
      - name: Build frontend and OpenConsole into the same image
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/build-single-exe.ps1 2>&1 | Tee-Object build-single-exe.log
      - name: Install native instrumentation test dependency
        run: |
          python tests/process_tree_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/memory_sample_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/owned_job_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install frida==17.24.3
      - name: Install pinned real Codex client for local-response UI tests
        run: npm ci --prefix tools/codex-fixture --ignore-scripts --no-audit --no-fund
      - name: Verify isolated executable with native protocol and pixel tests
        shell: pwsh
        run: |
          $clients = @(Get-ChildItem tools/codex-fixture/node_modules -Recurse -Filter codex.exe)
          if ($clients.Count -ne 1) { throw 'Expected one pinned native Codex executable' }
          ./scripts/test-single-exe.ps1 -Executable build/single-exe-dist/nemoterm.exe -CodexExecutable $clients[0].FullName
      - name: Upload single executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nemoterm-single-exe-x64-${{ github.sha }}
          path: build/single-exe-dist/nemoterm.exe
          if-no-files-found: error
          retention-days: 30
      - name: Retain failed-build executable for diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unverified-single-exe-x64-${{ github.sha }}
          path: build/single-exe-dist/nemoterm.exe
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect application failure events
        if: always()
        shell: pwsh
        run: ./scripts/native-crash-evidence.ps1 -Collect
      - name: Upload build and native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: single-exe-evidence-${{ github.sha }}
          path: |
            build-single-exe.log
            build/single-exe.binlog
            build/single-exe-check/research/
            build/single-exe-check/logs/
            build/single-exe-check/build/*failure.json
            build/native-crashes/
          if-no-files-found: warn
