name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cluster-msvc-diagnostics:
    name: MSVC native renderer diagnostics
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Retain native crash diagnostics on this disposable runner
        shell: pwsh
        run: ./scripts/native-crash-evidence.ps1
      - name: Build frontend and offscreen renderer checks
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake -S vendor/putty-0.85 -B build-cluster -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=MinSizeRel '-DCMAKE_C_FLAGS=/std:c11 /utf-8' '-DCMAKE_C_FLAGS_MINSIZEREL=/O1 /Ob1 /Gy /Gw' -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DPUTTY_GSSAPI=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-cluster --target pterm test_cluster_renderer --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-cluster/test_cluster_renderer.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item build-cluster/nemoterm.exe dist/
          ./scripts/fetch-conpty.ps1 -Architecture x64 -Destination dist
      - name: Compare native frames and retain exact shaping inputs
        shell: pwsh
        env:
          NEMOTERM_TEST_RENDERER_ORDER: '0,0,1,0,2'
        run: |
          python -m pip install frida==17.24.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/renderer_window_smoke.py
          exit $LASTEXITCODE
      - name: Repeat tab sibling lifetime and hyperlink input checks
        shell: pwsh
        run: |
          1..8 | ForEach-Object {
            python tests/tabs_window_smoke.py --renderer opengl --side right --cols 88 --rows 35 --font Consolas
            $result = $LASTEXITCODE
            Copy-Item research/tabs-opengl-right-observed.json "research/tabs-close-repeat-$_.json" -ErrorAction SilentlyContinue
            if ($result) { exit $result }
          }
          python tests/hyperlink_window_smoke.py
          exit $LASTEXITCODE
      - name: Collect application failure events
        if: always()
        shell: pwsh
        run: ./scripts/native-crash-evidence.ps1 -Collect
      - name: Retain native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cluster-msvc-diagnostics-${{ github.sha }}
          path: |
            research/renderer-observed.json
            research/renderer-*-text.png
            research/renderer-*-clusters.txt
            research/tabs-close-repeat-*.json
            research/hyperlink-window-observed.json
            build/native-crashes/
          retention-days: 14
  windows:
    name: Windows x64 tests and portable build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Retain native crash diagnostics on this disposable runner
        shell: pwsh
        run: ./scripts/native-crash-evidence.ps1
      - name: Verify pinned Unicode data and generated grapheme tables
        shell: pwsh
        run: |
          python scripts/generate-grapheme-tables.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-x11-colours.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_tabulation_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_double_size_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_graphics_query_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_dec_status_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_checksum_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_sgr_stack_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_palette_stack_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_selection_colour_cases.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_attribute_colour_cases.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_presentation_state_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_horizontal_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_reverse_wrap_oracle.py --check
          exit $LASTEXITCODE
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: >-
          cmake -S vendor/putty-0.85 -B build -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          '-DCMAKE_C_FLAGS_MINSIZEREL=-Os -ffunction-sections -fdata-sections'
          '-DCMAKE_EXE_LINKER_FLAGS=-Wl,--gc-sections -static-libgcc'
          -DPUTTY_GSSAPI=OFF
      - name: Build terminal and regression tests
        run: cmake --build build --target pterm test_conf test_terminal test_sixel test_sixel_terminal test_resize test_reflow test_mouse test_colour test_osc_colour test_modes test_sync test_snapshot test_sgr test_queries test_titles test_tcap test_highlight test_hyperlink test_keyboard test_osc52 test_mok test_win32_input test_state_control test_selective_erase test_rectangle test_margins test_cwd test_shell_marks test_shell test_font_cmap test_font_fallback test_tabs_layout --parallel 4
      - name: Run tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          for test in test_conf test_terminal test_sixel test_sixel_terminal test_resize test_reflow test_mouse test_colour test_osc_colour test_modes test_sync test_snapshot test_sgr test_queries test_titles test_tcap test_highlight test_hyperlink test_keyboard test_osc52 test_mok test_win32_input test_state_control test_selective_erase test_rectangle test_margins test_cwd test_shell_marks test_shell test_font_cmap test_font_fallback test_tabs_layout; do
            echo "Running $test"
            "./build/$test.exe" 2>&1 | tee "test-results/$test.log"
          done
      - name: Test Unicode extended grapheme boundaries
        run: |
          set -euo pipefail
          cmake --build build --target test_grapheme test_grapheme_terminal test_cluster_renderer
          ./build/test_grapheme.exe tools/unicode/18.0.0/GraphemeBreakTest.txt 2>&1 | tee test-results/test_grapheme.log
          ./build/test_grapheme_terminal.exe 2>&1 | tee test-results/test_grapheme_terminal.log
          ./build/test_cluster_renderer.exe 2>&1 | tee test-results/test_cluster_renderer.log
      - name: Package portable executable
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/nemoterm.exe dist/
          cp vendor/putty-0.85/LICENCE dist/LICENCE-PuTTY.txt
          cp LICENSE dist/LICENSE-Nemoterm.txt
          cp vendor/nerd-fonts/LICENSE dist/LICENSE-Nerd-Symbols.txt
          cp vendor/nerd-fonts/NOTICE.txt dist/LICENSE-Nerd-Components.txt
          cp tools/unicode/18.0.0/LICENSE.txt dist/LICENSE-Unicode.txt
          cp README.md dist/
          printf 'Commit: %s\nBuilt: %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/BUILD-INFO.txt
          gcc --version >> dist/BUILD-INFO.txt
          objdump -p dist/nemoterm.exe | sed -n 's/.*DLL Name: /DLL: /p' >> dist/BUILD-INFO.txt
          if grep -Ei 'DLL: (libstdc\+\+|libgcc|libwinpthread)' dist/BUILD-INFO.txt; then
            echo 'Portable frontend unexpectedly needs a compiler runtime DLL' >&2
            exit 1
          fi
          (cd dist && sha256sum nemoterm.exe > SHA256SUMS.txt)
      - name: Bundle pinned Microsoft ConPTY runtime
        shell: pwsh
        run: ./scripts/fetch-conpty.ps1 -Architecture x64 -Destination dist
      - name: Install owned-window input instrumentation
        shell: pwsh
        run: |
          python tests/process_tree_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/memory_sample_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/owned_job_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install frida==17.24.3
      - name: Test window callback lifetime during native shutdown
        shell: pwsh
        run: |
          python tests/shutdown_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/shutdown-window-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test startup caret creation before first focus
        shell: pwsh
        run: |
          python tests/caret_startup_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/caret-startup-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native compositor parity and capture shaping diagnostics
        shell: pwsh
        run: |
          python tests/renderer_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/renderer-* test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native grapheme widths, shapes, rectangles and font changes
        shell: pwsh
        run: |
          python tests/grapheme_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/grapheme-* test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
          python tests/grapheme_window_smoke.py --font-resize
          $testExit = $LASTEXITCODE
          Copy-Item research/grapheme-font-* test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native window and ConPTY input and resize
        shell: pwsh
        run: |
          python tests/mouse_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/mouse-window-observed.json test-results/
      - name: Test native RTL glyph presence, shaping and font resize
        shell: pwsh
        run: |
          python tests/rtl_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/rtl-* test-results/ -ErrorAction SilentlyContinue
          Copy-Item research/rtl-window-observed.json test-results/rtl-default-observed.json -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
          python tests/rtl_window_smoke.py --font Courier
          $testExit = $LASTEXITCODE
          Copy-Item research/rtl-* test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test independent session ownership and lifetime
        shell: pwsh
        run: |
          foreach ($renderer in @('gdi', 'opengl', 'directx')) {
            python tests/session_window_smoke.py --renderer $renderer
            $testExit = $LASTEXITCODE
            Copy-Item "research/session-window-$renderer-observed.json" test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
          python tests/session_restart_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/session-restart-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native tab host, previews and shared GPU lifetime
        shell: pwsh
        run: |
          foreach ($case in @(@('gdi','top'), @('gdi','bottom'), @('directx','left'), @('opengl','right'))) {
            python tests/tabs_window_smoke.py --renderer $case[0] --side $case[1]
            $testExit = $LASTEXITCODE
            Copy-Item "research/tabs-$($case[0])-$($case[1])-*" test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
          powershell.exe -NoProfile -File tests/settings_window_smoke.ps1 -TabHost
          $testExit = $LASTEXITCODE
          Copy-Item research/tabs-settings-window-observed.json, research/tabs-settings.png, research/grapheme-settings.png, research/selection-colour-settings.png, research/attribute-colour-settings.png test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
      - name: Test tab workloads and record frontend, host and client memory
        shell: pwsh
        run: |
          foreach ($case in @(@('gdi','top'), @('directx','left'))) {
            python tests/tabs_window_smoke.py --renderer $case[0] --side $case[1] --workload-memory
            $testExit = $LASTEXITCODE
            Copy-Item research/workload-tabs-* test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
      - name: Test tab overflow, geometry, resizing, input methods and selection
        shell: pwsh
        run: |
          # This job uses upstream OpenConsole. Its ReadFile surrogate bug is
          # fixed in our source-built single EXE, whose workflow tests byte I/O.
          # Check this frontend's complete Unicode input through ReadConsoleW.
          python tests/tabs_regression_suite.py --input-api wide
          $testExit = $LASTEXITCODE
          Copy-Item research/tabs-* test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test synchronized pixels and working set
        shell: pwsh
        run: |
          python tests/sync_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/sync-window-observed.json test-results/
          Copy-Item research/sync-*.png test-results/
      - name: Test native SGR styles and colours
        shell: pwsh
        run: |
          python tests/sgr_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/sgr-window-observed.json test-results/
          Copy-Item research/sgr-styles.png test-results/
      - name: Test native font resize and GDI resources
        shell: pwsh
        run: |
          python tests/font_resize_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/font-resize-observed.json test-results/
          Copy-Item research/font-resize-*.png test-results/
          exit $testExit
      - name: Test native cursor pixels and status queries
        shell: pwsh
        run: |
          python tests/query_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/query-window-observed.json test-results/
          Copy-Item research/cursor-*.png test-results/
      - name: Test embedded icon fallback, resize and RTL allocation lifetime
        shell: pwsh
        run: |
          python tests/font_fallback_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/font-fallback-observed.json, research/font-fallback*.png test-results/
          python tests/font_fallback_window_smoke.py --font Courier
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/font-fallback-observed.json test-results/font-fallback-courier-observed.json
          Copy-Item research/font-fallback.png test-results/font-fallback-courier.png
      - name: Test native working directories and session duplication
        shell: pwsh
        run: |
          python tests/cwd_window_smoke.py 2>&1 | Tee-Object test-results/cwd-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/cwd-window-observed.json, research/cwd-window.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native shell marks, command selection and bounded memory
        shell: pwsh
        run: |
          python tests/shell_marks_window_smoke.py 2>&1 | Tee-Object test-results/shell-marks-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/shell-marks-observed.json, research/shell-marks-selected.png, research/shell-marks-truncated.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native mouse highlight handshake and pixels
        shell: pwsh
        run: |
          python tests/highlight_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/highlight-window-observed.json test-results/
          Copy-Item research/highlight-selection.png test-results/
      - name: Test native Sixel resize and partial scrolling
        shell: pwsh
        run: |
          python tests/sixel_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/sixel-window-observed.json test-results/ -ErrorAction SilentlyContinue
          Copy-Item research/sixel-*.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native Sixel font changes and pixel erasure
        shell: pwsh
        run: |
          python tests/sixel_font_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/sixel-font-*.json test-results/ -ErrorAction SilentlyContinue
          Copy-Item research/sixel-font-*.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native hyperlink hover, activation and mouse interaction
        shell: pwsh
        run: |
          Remove-Item research/hyperlink-window-observed.json, research/hyperlink-*.png -ErrorAction SilentlyContinue
          python tests/hyperlink_window_smoke.py 2>&1 | Tee-Object test-results/hyperlink-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/hyperlink-window-observed.json test-results/ -ErrorAction SilentlyContinue
          Copy-Item research/hyperlink-*.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native reflow, history and Shift selection
        shell: pwsh
        run: |
          Remove-Item research/reflow-window-observed.json, research/reflow-narrow.png, research/reflow-wide.png -ErrorAction SilentlyContinue
          python tests/reflow_window_smoke.py 2>&1 | Tee-Object test-results/reflow-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/reflow-window-observed.json, research/reflow-narrow.png, research/reflow-wide.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native keyboard protocol, copy/paste and resize
        shell: pwsh
        run: |
          Remove-Item research/keyboard-window-observed.json, research/keyboard-window.png -ErrorAction SilentlyContinue
          python tests/keyboard_window_smoke.py 2>&1 | Tee-Object test-results/keyboard-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/keyboard-window-observed.json, research/keyboard-window.png test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
          python tests/keyboard_window_smoke.py --font "Courier New" 2>&1 | Tee-Object test-results/keyboard-courier-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/keyboard-window-observed.json test-results/keyboard-courier-observed.json -ErrorAction SilentlyContinue
          Copy-Item research/keyboard-window.png test-results/keyboard-courier.png -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native OSC 52 policies, clipboard and bounded memory
        shell: pwsh
        run: |
          Remove-Item research/osc52-window-observed.json, research/osc52-window.png -ErrorAction SilentlyContinue
          python tests/osc52_window_smoke.py 2>&1 | Tee-Object test-results/osc52-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/osc52-window-observed.json, research/osc52-window.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native xterm modified keys and configured defaults
        shell: pwsh
        run: |
          Remove-Item research/mok-window-observed.json, research/mok-window.png -ErrorAction SilentlyContinue
          python tests/mok_window_smoke.py 2>&1 | Tee-Object test-results/mok-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/mok-window-observed.json, research/mok-window.png test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
          python tests/mok_window_smoke.py --font "Courier New" --initial-level 3 --initial-format 1 2>&1 | Tee-Object test-results/mok-configured-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/mok-window-observed.json test-results/mok-configured-observed.json -ErrorAction SilentlyContinue
          Copy-Item research/mok-window.png test-results/mok-configured.png -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native Win32 input records and VT coexistence
        shell: pwsh
        run: |
          Remove-Item research/win32-input-observed.json, research/win32-input-window.png -ErrorAction SilentlyContinue
          python tests/win32_input_window_smoke.py 2>&1 | Tee-Object test-results/win32-input-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/win32-input-observed.json, research/win32-input-window.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native soft reset, saved mouse modes and resize
        shell: pwsh
        run: |
          Remove-Item research/state-control-observed.json, research/state-control-window.png -ErrorAction SilentlyContinue
          python tests/state_control_window_smoke.py 2>&1 | Tee-Object test-results/state-control-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/state-control-observed.json, research/state-control-window.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Compare native tabulation with independent XTerm replies
        shell: pwsh
        run: |
          python tests/tabulation_window_smoke.py 2>&1 | Tee-Object test-results/tabulation-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/tabulation-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Compare native double-size rows with independent XTerm replies
        shell: pwsh
        run: |
          python tests/double_size_window_smoke.py 2>&1 | Tee-Object test-results/double-size-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/double-size-observed.json, research/double-size-window.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test graphics capability replies, resized geometry and palette pixels
        shell: pwsh
        run: |
          python tests/graphics_query_window_smoke.py 2>&1 | Tee-Object test-results/graphics-query-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/graphics-query-observed.json, research/graphics-query-*.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native selective erasure and protected Sixel pixels
        shell: pwsh
        run: |
          python tests/selective_erase_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/selective-erase-observed.json, research/selective-erase-*.png test-results/
      - name: Compare palette stacks, title positions and retained renderer pixels
        shell: pwsh
        run: |
          foreach ($renderer in @('gdi', 'opengl', 'directx')) {
            python tests/palette_stack_window_smoke.py --renderer $renderer 2>&1 | Tee-Object "test-results/palette-stack-$renderer.log"
            $testExit = $LASTEXITCODE
            Copy-Item "research/palette-stack-$renderer-*" test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
      - name: Test selection colours and retained renderer pixels
        shell: pwsh
        run: |
          foreach ($renderer in @('gdi', 'opengl', 'directx')) {
            python tests/selection_colour_window_smoke.py --renderer $renderer 2>&1 | Tee-Object "test-results/selection-colour-$renderer.log"
            $testExit = $LASTEXITCODE
            Copy-Item "research/selection-colour-$renderer-*" test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
          python tests/selection_colour_window_smoke.py --renderer gdi --configured 2>&1 | Tee-Object "test-results/selection-colour-gdi-configured.log"
          $testExit = $LASTEXITCODE
          Copy-Item "research/selection-colour-gdi-configured-*" test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
      - name: Test attribute colours against explicit RGB scenes
        shell: pwsh
        run: |
          foreach ($renderer in @('gdi', 'opengl', 'directx')) {
            python tests/attribute_colour_window_smoke.py --renderer $renderer 2>&1 | Tee-Object "test-results/attribute-colour-$renderer.log"
            $testExit = $LASTEXITCODE
            Copy-Item "research/attribute-colour-$renderer-*" test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
          python tests/attribute_colour_window_smoke.py --renderer gdi --configured 2>&1 | Tee-Object "test-results/attribute-colour-gdi-configured.log"
          $testExit = $LASTEXITCODE
          Copy-Item "research/attribute-colour-gdi-configured-*" test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
      - name: Test native DEC rectangle editing, Unicode copy, Sixel and memory
        shell: pwsh
        run: |
          python tests/rectangle_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/rectangle-window-observed.json, research/rectangle-*.png test-results/
      - name: Test native horizontal margins, Sixel columns and font/grid resize
        shell: pwsh
        run: |
          python tests/margins_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/margins-window-observed.json, research/margins-*.png test-results/
      - name: Test native settings save, load and local launch
        shell: pwsh
        run: |
          Remove-Item research/settings-window-observed.json, research/mok-settings.png -ErrorAction SilentlyContinue
          powershell.exe -NoProfile -File tests/settings_window_smoke.ps1 2>&1 | Tee-Object test-results/settings-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/settings-window-observed.json, research/mok-settings.png, research/shell-marks-settings.png, research/grapheme-settings.png, research/selection-colour-settings.png, research/attribute-colour-settings.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test detected shells and delegated console lifetime
        shell: pwsh
        run: |
          python tests/shell_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/powershell_environment_window_smoke.py 2>&1 | Tee-Object test-results/powershell-environment.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/delegated_console_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/shell-window-observed.json, research/powershell-environment-observed.json, research/delegated-console-observed.json, research/shell-settings.png test-results/
      - name: Upload portable terminal
        # Only publish the package after every native rendering check succeeds.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nemoterm-windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Collect application failure events
        if: always()
        shell: pwsh
        run: ./scripts/native-crash-evidence.ps1 -Collect
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows-${{ github.sha }}
          path: |
            test-results/
            build/native-crashes/
          if-no-files-found: warn

  decoder-sanitizers:
    name: Terminal ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile and test decoder with sanitizers
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_sixel.c \
            vendor/putty-0.85/terminal/nemo_sixel.c -o test-sixel
          ASAN_OPTIONS=detect_leaks=1 ./test-sixel
      - name: Test colour parser with sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_colour.c \
            vendor/putty-0.85/terminal/nemo_colour.c -o test-colour
          ASAN_OPTIONS=detect_leaks=1 ./test-colour
      - name: Test Unicode grapheme boundaries with sanitizers
        run: |
          python3 scripts/generate-grapheme-tables.py --check
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_grapheme.c \
            vendor/putty-0.85/terminal/nemo_grapheme.c -o test-grapheme
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./test-grapheme tools/unicode/18.0.0/GraphemeBreakTest.txt 2>&1 | tee terminal-grapheme-sanitizers.log
      - name: Test bounded OpenType cmap lookup with sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/windows tests/test_font_cmap.c \
            vendor/putty-0.85/windows/nemo_font_cmap.c -o test-font-cmap
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./test-font-cmap
      - name: Test tab and preview geometry with sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/windows tests/test_tabs_layout.c \
            vendor/putty-0.85/windows/nemo_tabs_layout.c -o test-tabs-layout
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./test-tabs-layout
      - name: Test terminal image, hyperlink, keyboard and clipboard lifecycle with sanitizers
        run: |
          cmake -S vendor/putty-0.85 -B build-asan -G Ninja \
            -DPUTTY_GTK_VERSION=NONE -DPUTTY_GSSAPI=OFF \
            '-DCMAKE_C_FLAGS=-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build build-asan --target test_sixel_terminal test_hyperlink test_keyboard test_osc52 test_mok test_reflow test_win32_input test_state_control test_selective_erase test_rectangle test_margins test_cwd test_shell_marks test_queries test_titles test_osc_colour --parallel 4
          cmake --build build-asan --target test_grapheme_terminal test_sgr --parallel 4
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_grapheme_terminal 2>&1 | tee terminal-grapheme-cells-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_sixel_terminal 2>&1 | tee terminal-image-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_hyperlink 2>&1 | tee terminal-hyperlink-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_keyboard 2>&1 | tee terminal-keyboard-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_osc52 2>&1 | tee terminal-osc52-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_mok 2>&1 | tee terminal-mok-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_reflow 2>&1 | tee terminal-reflow-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_win32_input 2>&1 | tee terminal-win32-input-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_state_control 2>&1 | tee terminal-state-control-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_selective_erase 2>&1 | tee terminal-selective-erase-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_rectangle 2>&1 | tee terminal-rectangle-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_margins 2>&1 | tee terminal-margins-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_cwd 2>&1 | tee terminal-cwd-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_shell_marks 2>&1 | tee terminal-shell-marks-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_queries 2>&1 | tee terminal-queries-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_sgr 2>&1 | tee terminal-sgr-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_titles 2>&1 | tee terminal-titles-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_osc_colour 2>&1 | tee terminal-palette-sanitizers.log
      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-sanitizers-${{ github.sha }}
          path: terminal-*-sanitizers.log
          if-no-files-found: warn
