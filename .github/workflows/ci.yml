        shell: pwsh
        run: |
          foreach ($renderer in @('gdi', 'opengl', 'directx')) {
            python tests/selection_colour_window_smoke.py --renderer $renderer 2>&1 | Tee-Object "test-results/selection-colour-$renderer.log"
            $testExit = $LASTEXITCODE
            Copy-Item "research/selection-colour-$renderer-*" test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
          python tests/selection_colour_window_smoke.py --renderer gdi --configured 2>&1 | Tee-Object "test-results/selection-colour-gdi-configured.log"
          $testExit = $LASTEXITCODE
          Copy-Item "research/selection-colour-gdi-configured-*" test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
      - name: Test attribute colours against explicit RGB scenes
        shell: pwsh
        run: |
          foreach ($renderer in @('gdi', 'opengl', 'directx')) {
            python tests/attribute_colour_window_smoke.py --renderer $renderer 2>&1 | Tee-Object "test-results/attribute-colour-$renderer.log"
            $testExit = $LASTEXITCODE
            Copy-Item "research/attribute-colour-$renderer-*" test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
          python tests/attribute_colour_window_smoke.py --renderer gdi --configured 2>&1 | Tee-Object "test-results/attribute-colour-gdi-configured.log"
          $testExit = $LASTEXITCODE
          Copy-Item "research/attribute-colour-gdi-configured-*" test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
      - name: Test native DEC rectangle editing, Unicode copy, Sixel and memory
        shell: pwsh
        run: |
          python tests/rectangle_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/rectangle-window-observed.json, research/rectangle-*.png test-results/
      - name: Test native horizontal margins, Sixel columns and font/grid resize
        shell: pwsh
        run: |
          python tests/margins_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/margins-window-observed.json, research/margins-*.png test-results/
      - name: Test native settings save, load and local launch
        shell: pwsh
        run: |
          Remove-Item research/settings-window-observed.json, research/mok-settings.png -ErrorAction SilentlyContinue
          powershell.exe -NoProfile -File tests/settings_window_smoke.ps1 2>&1 | Tee-Object test-results/settings-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/settings-window-observed.json, research/mok-settings.png, research/shell-marks-settings.png, research/grapheme-settings.png, research/selection-colour-settings.png, research/attribute-colour-settings.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test detected shells and delegated console lifetime
        shell: pwsh
        run: |
          python tests/shell_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/powershell_environment_window_smoke.py 2>&1 | Tee-Object test-results/powershell-environment.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/delegated_console_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/shell-window-observed.json, research/powershell-environment-observed.json, research/delegated-console-observed.json, research/shell-settings.png test-results/
      # Keep resource acceptance mandatory, after collecting functional evidence.
      - name: Test tab workloads and record frontend, host and client memory
        shell: pwsh
        run: |
          foreach ($case in @(@('gdi','top'), @('directx','left'))) {
            python tests/tabs_window_smoke.py --renderer $case[0] --side $case[1] --workload-memory
            $testExit = $LASTEXITCODE
            Copy-Item research/workload-tabs-* test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
      - name: Test inline images with the same mandatory tab memory limits
        shell: pwsh
        run: |
          foreach ($case in @(@('gdi','top'), @('directx','left'))) {
            python tests/tabs_window_smoke.py --renderer $case[0] --side $case[1] --workload-memory --inline-images
            $testExit = $LASTEXITCODE
            Copy-Item research/inline-workload-tabs-* test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
      - name: Test animated images with the same mandatory tab memory limits
        shell: pwsh
        run: |
          foreach ($case in @(@('gdi','top'), @('directx','left'))) {
            python tests/tabs_window_smoke.py --renderer $case[0] --side $case[1] --workload-memory --animated-images
            $testExit = $LASTEXITCODE
            Copy-Item research/animated-workload-tabs-* test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
      - name: Test Kitty images with the same mandatory tab memory limits
        shell: pwsh
        run: |
          foreach ($case in @(@('gdi','top'), @('directx','left'))) {
            python tests/tabs_window_smoke.py --renderer $case[0] --side $case[1] --workload-memory --kitty-images
            $testExit = $LASTEXITCODE
            Copy-Item research/kitty-workload-tabs-* test-results/ -ErrorAction SilentlyContinue
            if ($testExit) { exit $testExit }
          }
      - name: Test compressed Kitty PNG with mandatory tab memory limits
        shell: pwsh
        run: |
          foreach ($case in @(@('gdi','top'), @('directx','left'))) {
            python tests/tabs_window_smoke.py --renderer $case[0] --side $case[1] --workload-memory --kitty-images --kitty-compression 2>&1 | Tee-Object "test-results/compressed-kitty-workload-$($case[0]).log"
            $code = $LASTEXITCODE
            Copy-Item research/compressed-kitty-* test-results/ -ErrorAction SilentlyContinue
            if ($code) { exit $code }
          }
      - name: Test dense Unicode image cells with mandatory tab memory limits
        shell: pwsh
        run: |
          foreach ($case in @(@('gdi','top'), @('directx','left'))) {
            python tests/tabs_window_smoke.py --renderer $case[0] --side $case[1] --workload-memory --kitty-images --kitty-unicode --session-seconds 900 2>&1 | Tee-Object "test-results/unicode-kitty-workload-$($case[0]).log"
            $code = $LASTEXITCODE
            Copy-Item research/unicode-kitty-workload-tabs-* test-results/ -ErrorAction SilentlyContinue
            if ($code) { exit $code }
          }
      - name: Upload portable terminal
        # Only publish the package after every native rendering check succeeds.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nemoterm-windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Collect application failure events
        if: always()
        shell: pwsh
        run: ./scripts/native-crash-evidence.ps1 -Collect
      - name: Preserve the unverified MinGW package after a native failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unverified-mingw-runtime-${{ github.sha }}
          path: dist/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows-${{ github.sha }}
          path: |
            test-results/
            build/native-crashes/
            research/shutdown-window-observed.json
            research/profiles-failure-*/
          if-no-files-found: warn

  decoder-sanitizers:
    name: Terminal ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile and test decoder with sanitizers
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_sixel.c \
            vendor/putty-0.85/terminal/nemo_sixel.c -o test-sixel
          ASAN_OPTIONS=detect_leaks=1 ./test-sixel
      - name: Test inline-image transport with sanitizers
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_iterm.c \
            vendor/putty-0.85/terminal/nemo_iterm.c -o test-iterm
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./test-iterm 2>&1 | tee terminal-iterm-transport-sanitizers.log
      - name: Test kitty graphics transport with sanitizers
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_kitty_transport.c \
            vendor/putty-0.85/terminal/nemo_kitty.c -o test-kitty
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./test-kitty 2>&1 | tee terminal-kitty-transport-sanitizers.log
      - name: Test bounded zlib with sanitizers
        run: |
          python3 scripts/generate-ansi-reference.py --check
          python3 scripts/generate-legacy-parameter-reference.py --check
          python3 scripts/generate-osc-colour-sequence-reference.py --check
          python3 scripts/generate-special-keys-reference.py --check
          python3 scripts/generate-extended-keys-reference.py --check
          python3 scripts/generate-legacy-modifiers-reference.py --check
          python3 scripts/generate-cancellation-reference.py --check
          python3 scripts/generate-kitty-compression-reference.py --check
          python3 scripts/generate-kitty-feature-reference.py --check
          python3 scripts/generate-kitty-query-error-reference.py --check
          python3 scripts/generate-kitty-relative-reference.py --check
          python3 scripts/generate-kitty-unicode-reference.py --check
          python3 scripts/generate-kitty-unicode-geometry-reference.py --check
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -I vendor/putty-0.85/terminal tests/test_zlib.c vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c -o test-zlib
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./test-zlib 2>&1 | tee terminal-zlib-sanitizers.log
      - name: Test kitty image cache with sanitizers
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_kitty_cache.c \
            vendor/putty-0.85/terminal/nemo_kitty_cache.c \
            vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c \
            vendor/putty-0.85/terminal/nemo_kitty.c \
            vendor/putty-0.85/terminal/nemo_raster.c -o test-kitty-cache
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./test-kitty-cache 2>&1 | tee terminal-kitty-cache-sanitizers.log
      - name: Test kitty layout against retained reference with sanitizers
        run: |
          python3 scripts/generate-kitty-layout-reference.py --check
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_kitty_layout.c \
            vendor/putty-0.85/terminal/nemo_kitty_layout.c \
            vendor/putty-0.85/terminal/nemo_kitty.c -o test-kitty-layout
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./test-kitty-layout 2>&1 | tee terminal-kitty-layout-sanitizers.log
      - name: Test kitty placement ownership and scrolling with sanitizers
        run: |
          python3 scripts/generate-kitty-placement-reference.py --check
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_kitty_placements.c \
            vendor/putty-0.85/terminal/nemo_kitty_placements.c \
            vendor/putty-0.85/terminal/nemo_kitty_layout.c \
            vendor/putty-0.85/terminal/nemo_kitty_cache.c \
            vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c \
            vendor/putty-0.85/terminal/nemo_kitty.c \
            vendor/putty-0.85/terminal/nemo_raster.c -o test-kitty-placements
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./test-kitty-placements 2>&1 | tee terminal-kitty-placements-sanitizers.log
      - name: Test raster composition and timing with sanitizers
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_raster.c \
            vendor/putty-0.85/terminal/nemo_raster.c -o test-raster
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./test-raster 2>&1 | tee terminal-raster-animation-sanitizers.log
      - name: Test colour parser with sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_colour.c \
            vendor/putty-0.85/terminal/nemo_colour.c -o test-colour
          ASAN_OPTIONS=detect_leaks=1 ./test-colour
      - name: Test ISO 2022 mapping data with sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_charset.c \
            vendor/putty-0.85/terminal/nemo_charset.c -o test-iso2022-charset
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./test-iso2022-charset 2>&1 | tee terminal-charset-sanitizers.log
      - name: Test Unicode grapheme boundaries with sanitizers
        run: |
          python3 scripts/generate-grapheme-tables.py --check
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_grapheme.c \
            vendor/putty-0.85/terminal/nemo_grapheme.c -o test-grapheme
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./test-grapheme tools/unicode/18.0.0/GraphemeBreakTest.txt 2>&1 | tee terminal-grapheme-sanitizers.log
      - name: Test bounded OpenType cmap lookup with sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/windows tests/test_font_cmap.c \
            vendor/putty-0.85/windows/nemo_font_cmap.c -o test-font-cmap
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./test-font-cmap
      - name: Test tab and preview geometry with sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/windows tests/test_tabs_layout.c \
            vendor/putty-0.85/windows/nemo_tabs_layout.c -o test-tabs-layout
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./test-tabs-layout
      - name: Test terminal image, hyperlink, keyboard and clipboard lifecycle with sanitizers
        run: |
          cmake -S vendor/putty-0.85 -B build-asan -G Ninja \
            -DPUTTY_GTK_VERSION=NONE -DPUTTY_GSSAPI=OFF \
            '-DCMAKE_C_FLAGS=-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build build-asan --target test_sixel_terminal test_hyperlink test_keyboard test_osc52 test_mok test_reflow test_win32_input test_state_control test_selective_erase test_rectangle test_margins test_cwd test_shell_marks test_queries test_ansi_terminal test_cancellation_terminal test_feature_policy test_bell_modes test_udk_terminal test_locator_terminal test_pointer_terminal test_titles test_osc_colour --parallel 4
          cmake --build build-asan --target test_grapheme_terminal test_sgr test_tcap --parallel 4
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_grapheme_terminal 2>&1 | tee terminal-grapheme-cells-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_sixel_terminal 2>&1 | tee terminal-image-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_hyperlink 2>&1 | tee terminal-hyperlink-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_keyboard 2>&1 | tee terminal-keyboard-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_osc52 2>&1 | tee terminal-osc52-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_mok 2>&1 | tee terminal-mok-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_reflow 2>&1 | tee terminal-reflow-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_win32_input 2>&1 | tee terminal-win32-input-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_state_control 2>&1 | tee terminal-state-control-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_selective_erase 2>&1 | tee terminal-selective-erase-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_rectangle 2>&1 | tee terminal-rectangle-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_margins 2>&1 | tee terminal-margins-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_cwd 2>&1 | tee terminal-cwd-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_shell_marks 2>&1 | tee terminal-shell-marks-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_queries 2>&1 | tee terminal-queries-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_ansi_terminal 2>&1 | tee terminal-ansi-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_cancellation_terminal 2>&1 | tee terminal-cancellation-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_feature_policy 2>&1 | tee terminal-feature-policy-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_bell_modes 2>&1 | tee terminal-bell-modes-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_udk_terminal 2>&1 | tee terminal-udk-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_locator_terminal 2>&1 | tee terminal-locator-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_pointer_terminal 2>&1 | tee terminal-pointer-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_sgr 2>&1 | tee terminal-sgr-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_tcap 2>&1 | tee terminal-tcap-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            python3 tests/test_underline_terminfo.py --exe ./build-asan/test_tcap \
              --output research/underline-capabilities-ncurses.json 2>&1 | tee terminal-tcap-ncurses-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_titles 2>&1 | tee terminal-titles-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_osc_colour 2>&1 | tee terminal-palette-sanitizers.log
      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-sanitizers-${{ github.sha }}
          path: |
            terminal-*-sanitizers.log
            research/underline-capabilities-ncurses.json
          if-no-files-found: warn
