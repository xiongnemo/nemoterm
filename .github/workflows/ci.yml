name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NEMOTERM_TEST_TRACEBACK_SECONDS: '60'
  NEMOTERM_SHUTDOWN_DEADLINE_SECONDS: '120'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-host:
    name: Source-built console host for compiler comparison
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Build the current source host with the same overlay as the single image
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/build-single-exe.ps1 -Destination build/source-console-host
          $image = Get-Item -LiteralPath build/source-console-host/nemoterm.exe
          [ordered]@{
            SourceCommit = (git rev-parse HEAD).Trim()
            MicrosoftTerminalCommit = (git -C vendor/microsoft-terminal rev-parse HEAD).Trim()
            OverlaySHA256 = (Get-FileHash scripts/prepare-single-exe.py -Algorithm SHA256).Hash.ToLowerInvariant()
            EntrySHA256 = (Get-FileHash native/single_exe/entry.cpp -Algorithm SHA256).Hash.ToLowerInvariant()
            Executable = [ordered]@{
              SHA256 = (Get-FileHash -LiteralPath $image.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Bytes = $image.Length
            }
          } | ConvertTo-Json -Depth 4 | Set-Content build/source-console-host/SOURCE-HOST.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-console-host-x64-${{ github.sha }}
          path: build/source-console-host/
          retention-days: 7
          if-no-files-found: error
  profiles:
    name: Profiles and default tabs on the single executable
    needs: source-host
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the exact source-built single image
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name "source-console-host-x64-$env:GITHUB_SHA" --dir build/profile-product
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $record = Get-Content build/profile-product/SOURCE-HOST.json -Raw | ConvertFrom-Json
          $exe = (Resolve-Path build/profile-product/nemoterm.exe).Path
          if ($record.SourceCommit -ne $env:GITHUB_SHA -or $record.Executable.SHA256 -ne (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Product identity mismatch' }
          New-Item -ItemType Directory build/profile-check/research, build/profile-check/tools | Out-Null
          Copy-Item tests build/profile-check/tests -Recurse
          Copy-Item tools/nemoterm_debug.py build/profile-check/tools/
          "NEMOTERM_TEST_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify default tabs, shortcut and explicit profile options
        run: python build/profile-check/tests/command_line_profile_window_smoke.py
      - name: Verify default tab host fits the work area
        if: ${{ !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        run: python build/profile-check/tests/startup_size_window_smoke.py
      - name: Verify profile CRUD and persistent live settings in a tab host
        if: ${{ !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        run: powershell.exe -NoProfile -File build/profile-check/tests/settings_window_smoke.ps1 -TabHost
      - name: Verify profile CRUD and persistent live settings in a standalone window
        if: ${{ !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        run: powershell.exe -NoProfile -File build/profile-check/tests/settings_window_smoke.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profiles-evidence-${{ github.sha }}
          path: |
            build/profile-product/SOURCE-HOST.json
            build/profile-check/research/
          retention-days: 14
  cluster-msvc-diagnostics:
    name: MSVC native renderer diagnostics
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Retain native crash diagnostics on this disposable runner
        shell: pwsh
        run: ./scripts/native-crash-evidence.ps1
      - name: Build frontend and offscreen renderer checks
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake -S vendor/putty-0.85 -B build-cluster -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=MinSizeRel '-DCMAKE_C_FLAGS=/std:c11 /utf-8' '-DCMAKE_C_FLAGS_MINSIZEREL=/O1 /Ob1 /Gy /Gw' -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DPUTTY_GSSAPI=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-cluster --target pterm test_cluster_renderer test_gl_lifetime test_handle_io test_iso2022_charset test_iterm test_kitty_transport test_zlib test_kitty_cache test_kitty_layout test_kitty_placements test_raster --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-cluster/test_iso2022_charset.exe 2>&1 | Tee-Object charset-msvc.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-cluster/test_iterm.exe 2>&1 | Tee-Object iterm-transport-msvc.log
          if ($LASTEXITCODE) { throw 'Inline transport tests failed' }
          ./build-cluster/test_kitty_transport.exe 2>&1 | Tee-Object kitty-transport-msvc.log
          if ($LASTEXITCODE) { throw 'Kitty transport tests failed' }
          python scripts/generate-kitty-compression-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-feature-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-query-error-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-relative-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-unicode-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-unicode-geometry-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-cluster/test_zlib.exe 2>&1 | Tee-Object zlib-msvc.log
          if ($LASTEXITCODE) { throw 'Bounded zlib tests failed' }
          ./build-cluster/test_kitty_cache.exe 2>&1 | Tee-Object kitty-cache-msvc.log
          if ($LASTEXITCODE) { throw 'Kitty cache tests failed' }
          python scripts/generate-kitty-layout-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-cluster/test_kitty_layout.exe 2>&1 | Tee-Object kitty-layout-msvc.log
          if ($LASTEXITCODE) { throw 'Kitty layout tests failed' }
          python scripts/generate-kitty-placement-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-cluster/test_kitty_placements.exe 2>&1 | Tee-Object kitty-placements-msvc.log
          if ($LASTEXITCODE) { throw 'Kitty placement tests failed' }
          ./build-cluster/test_raster.exe 2>&1 | Tee-Object raster-animation-msvc.log
          if ($LASTEXITCODE) { throw 'Raster animation tests failed' }
          ./build-cluster/test_handle_io.exe 2>&1 | Tee-Object handle-io-msvc.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-cluster/test_gl_lifetime.exe 2>&1 | Tee-Object gl-lifetime-msvc.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-cluster/test_cluster_renderer.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item build-cluster/nemoterm.exe dist/
          ./scripts/fetch-conpty.ps1 -Architecture x64 -Destination dist
      - name: Compare native frames and retain exact shaping inputs
        shell: pwsh
        env:
          NEMOTERM_TEST_RENDERER_ORDER: '0,0,1,0,2'
        run: |
          python -m pip install frida==17.24.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/renderer_window_smoke.py
          exit $LASTEXITCODE
      - name: Repeat tab sibling lifetime and hyperlink input checks
        shell: pwsh
        run: |
          1..8 | ForEach-Object {
            python tests/tabs_window_smoke.py --renderer opengl --side right --cols 88 --rows 35 --font Consolas --probe-boundaries
            $result = $LASTEXITCODE
            Copy-Item research/tabs-opengl-right-observed.json "research/tabs-close-repeat-$_.json" -ErrorAction SilentlyContinue
            if ($result) { exit $result }
          }
          python tests/hyperlink_window_smoke.py
          exit $LASTEXITCODE
      - name: Collect application failure events
        if: always()
        shell: pwsh
        run: ./scripts/native-crash-evidence.ps1 -Collect
      - name: Retain native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cluster-msvc-diagnostics-${{ github.sha }}
          path: |
            research/renderer-observed.json
            research/renderer-*-text.png
            research/renderer-*-clusters.txt
            research/tabs-close-repeat-*.json
            research/hyperlink-window-observed.json
            build/native-crashes/
            gl-lifetime-msvc.log
            handle-io-msvc.log
            charset-msvc.log
            iterm-transport-msvc.log
            kitty-*-msvc.log
            raster-animation-msvc.log
          retention-days: 14
      - name: Retain exact failed MSVC image for reproduction
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unverified-msvc-renderer-${{ github.sha }}
          path: |
            dist/nemoterm.exe
            dist/OpenConsole.exe
            dist/conpty.dll
          retention-days: 14
  windows:
    name: Windows x64 tests and portable build
    needs: source-host
    runs-on: windows-latest
    # Run 43652684756 reached the 30-minute job ceiling during its final
    # compressed-image memory group. The expanded native suites and ten memory
    # workloads keep their individual deadlines, assertions and limits.
    # The complete native suite reached the former 40-minute outer deadline
    # during its final dense-image workload. Keep individual test bounds intact.
    # The added 2,704-step legacy keyboard replay takes about eight minutes.
    # Only the outer job budget grows; existing product gates remain unchanged.
    timeout-minutes: 65
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Retain native crash diagnostics on this disposable runner
        shell: pwsh
        run: ./scripts/native-crash-evidence.ps1
      - name: Verify pinned Unicode data and generated grapheme tables
        shell: pwsh
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
        run: |
          python scripts/generate-grapheme-tables.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-x11-colours.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_tabulation_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_double_size_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_graphics_query_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_dec_status_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_c1_controls_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_checksum_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_sgr_stack_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_palette_stack_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_reset_palette_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_selection_colour_cases.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_attribute_colour_cases.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_presentation_state_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_cursor_charset_cases.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-ansi-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-legacy-parameter-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-osc-colour-sequence-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-special-keys-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-extended-keys-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-legacy-modifiers-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-cancellation-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-bell-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-udk-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-locator-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_guarded_area_cases.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_alignment_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_horizontal_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_reverse_wrap_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_relative_cursor_oracle.py --check
          exit $LASTEXITCODE
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: >-
          cmake -S vendor/putty-0.85 -B build -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          '-DCMAKE_C_FLAGS_MINSIZEREL=-Os -ffunction-sections -fdata-sections'
          '-DCMAKE_EXE_LINKER_FLAGS=-Wl,--gc-sections -static-libgcc'
          -DPUTTY_GSSAPI=OFF
      - name: Build terminal and regression tests
        run: cmake --build build --target pterm test_conf test_terminal test_sixel test_iterm test_kitty_transport test_zlib test_kitty_cache test_kitty_layout test_kitty_placements test_raster test_iso2022_charset test_sixel_terminal test_resize test_reflow test_mouse test_colour test_osc_colour test_modes test_sync test_snapshot test_sgr test_queries test_ansi_terminal test_cancellation_terminal test_feature_policy test_bell_modes test_udk_terminal test_locator_terminal test_pointer_terminal test_titles test_tcap test_highlight test_hyperlink test_keyboard test_osc52 test_mok test_win32_input test_state_control test_selective_erase test_rectangle test_margins test_cwd test_shell_marks test_shell test_font_cmap test_font_fallback test_d3d11_reservations test_tabs_layout test_handle_io --parallel 4
      - name: Run tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          for test in test_conf test_terminal test_sixel test_iterm test_kitty_transport test_zlib test_kitty_cache test_kitty_layout test_kitty_placements test_raster test_iso2022_charset test_sixel_terminal test_resize test_reflow test_mouse test_colour test_osc_colour test_modes test_sync test_snapshot test_sgr test_queries test_ansi_terminal test_cancellation_terminal test_feature_policy test_bell_modes test_udk_terminal test_locator_terminal test_pointer_terminal test_titles test_tcap test_highlight test_hyperlink test_keyboard test_osc52 test_mok test_win32_input test_state_control test_selective_erase test_rectangle test_margins test_cwd test_shell_marks test_shell test_font_cmap test_font_fallback test_d3d11_reservations test_tabs_layout test_handle_io; do
            echo "Running $test"
            "./build/$test.exe" 2>&1 | tee "test-results/$test.log"
          done
      - name: Test Unicode extended grapheme boundaries
        run: |
          set -euo pipefail
          cmake --build build --target test_grapheme test_grapheme_terminal test_cluster_renderer test_gl_lifetime
          ./build/test_gl_lifetime.exe 2>&1 | tee test-results/test_gl_lifetime.log
          ./build/test_grapheme.exe tools/unicode/18.0.0/GraphemeBreakTest.txt 2>&1 | tee test-results/test_grapheme.log
          ./build/test_grapheme_terminal.exe 2>&1 | tee test-results/test_grapheme_terminal.log
          ./build/test_cluster_renderer.exe 2>&1 | tee test-results/test_cluster_renderer.log
      - name: Package portable executable
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/nemoterm.exe dist/
          cp vendor/putty-0.85/LICENCE dist/LICENCE-PuTTY.txt
          cp LICENSE dist/LICENSE-Nemoterm.txt
          cp vendor/nerd-fonts/LICENSE dist/LICENSE-Nerd-Symbols.txt
          cp vendor/nerd-fonts/NOTICE.txt dist/LICENSE-Nerd-Components.txt
          cp tools/unicode/18.0.0/LICENSE.txt dist/LICENSE-Unicode.txt
          cp README.md dist/
          printf 'Commit: %s\nBuilt: %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/BUILD-INFO.txt
          gcc --version >> dist/BUILD-INFO.txt
          objdump -p dist/nemoterm.exe | sed -n 's/.*DLL Name: /DLL: /p' >> dist/BUILD-INFO.txt
          if grep -Ei 'DLL: (libstdc\+\+|libgcc|libwinpthread)' dist/BUILD-INFO.txt; then
            echo 'Portable frontend unexpectedly needs a compiler runtime DLL' >&2
            exit 1
          fi
          (cd dist && sha256sum nemoterm.exe > SHA256SUMS.txt)
      - name: Bundle pinned Microsoft ConPTY runtime
        shell: pwsh
        run: ./scripts/fetch-conpty.ps1 -Architecture x64 -Destination dist
      - name: Use the same source host fixes for MinGW integration tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name "source-console-host-x64-$env:GITHUB_SHA" --dir build/source-console-host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/install-source-conpty-host.ps1 -SourceDirectory build/source-console-host -Destination dist -ExpectedCommit "$env:GITHUB_SHA"
          Copy-Item dist/CONPTY-RUNTIME.json, dist/SOURCE-HOST.json test-results/
      - name: Install owned-window input instrumentation
        shell: pwsh
        run: |
          python tests/process_tree_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/memory_sample_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/memory_limits_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/resource_settle_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/owned_job_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install frida==17.24.3
      - name: Test command-line overrides before and after loaded profiles
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tests/command_line_profile_window_smoke.py 2>&1 | Tee-Object test-results/command-line-profile.log
          $testExit = $LASTEXITCODE
          Copy-Item research/command-line-profile-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test local terminal discovery, input and capture API
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tests/automation_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/automation-gdi-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Compare full and rectangle captures across renderer and tab states
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tests/image_rectangle_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/image-rectangle-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test file drops and native clipboard formats
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tests/drop_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/drop-gdi-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Verify shutdown observer sensitivity with native controls
        shell: pwsh
        run: |
          ./scripts/prepare-shutdown-observer.ps1
          ./scripts/test-shutdown-observer.ps1 -Destination test-results/shutdown-observer
      - name: Verify profile failure dump controls before native acceptance
        shell: pwsh
        run: |
          ./scripts/test-failure-dump.ps1 -Destination test-results/profile-failure-dump
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "NEMOTERM_PROFILE_FAILURE_DUMP=$((Resolve-Path test-results/profile-failure-dump/helper.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test window callback lifetime during native shutdown
        timeout-minutes: 3
        shell: pwsh
        run: |
          & $env:NEMOTERM_SHUTDOWN_PYTHON tests/shutdown_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/shutdown-window-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test startup caret creation before first focus
        shell: pwsh
        run: |
          python tests/caret_startup_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/caret-startup-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native compositor parity and capture shaping diagnostics
        shell: pwsh
        run: |
          python tests/renderer_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/renderer-* test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test ISO 2022 renderer pixels and ConPTY selection input
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tests/iso2022_window_smoke.py 2>&1 | Tee-Object test-results/iso2022-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/iso2022-observed.json, research/iso2022-*.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native grapheme widths, shapes, rectangles and font changes
        shell: pwsh
        run: |
          python tests/grapheme_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/grapheme-* test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
          python tests/grapheme_window_smoke.py --font-resize
          $testExit = $LASTEXITCODE
          Copy-Item research/grapheme-font-* test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native window and ConPTY input and resize
        shell: pwsh
        run: |
          python tests/mouse_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/mouse-window-observed.json test-results/
      - name: Test native RTL glyph presence, shaping and font resize
        shell: pwsh
        run: |
          python tests/rtl_window_smoke.py
          $testExit = $LASTEXITCODE
