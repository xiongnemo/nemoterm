name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 tests and portable build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: >-
          cmake -S vendor/putty-0.85 -B build -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          '-DCMAKE_C_FLAGS_MINSIZEREL=-Os -ffunction-sections -fdata-sections'
          '-DCMAKE_EXE_LINKER_FLAGS=-Wl,--gc-sections -static-libgcc'
          -DPUTTY_GSSAPI=OFF
      - name: Build terminal and regression tests
        run: cmake --build build --target pterm test_conf test_terminal test_sixel test_sixel_terminal test_resize test_reflow test_mouse test_colour test_osc_colour test_modes test_sync test_snapshot test_sgr test_queries test_tcap test_highlight test_hyperlink test_keyboard test_osc52 test_mok test_win32_input test_state_control test_selective_erase test_rectangle test_margins test_cwd test_shell_marks test_shell test_font_cmap test_font_fallback --parallel 4
      - name: Run tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          for test in test_conf test_terminal test_sixel test_sixel_terminal test_resize test_reflow test_mouse test_colour test_osc_colour test_modes test_sync test_snapshot test_sgr test_queries test_tcap test_highlight test_hyperlink test_keyboard test_osc52 test_mok test_win32_input test_state_control test_selective_erase test_rectangle test_margins test_cwd test_shell_marks test_shell test_font_cmap test_font_fallback; do
            echo "Running $test"
            "./build/$test.exe" 2>&1 | tee "test-results/$test.log"
          done
      - name: Package portable executable
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/nemoterm.exe dist/
          cp vendor/putty-0.85/LICENCE dist/LICENCE-PuTTY.txt
          cp LICENSE dist/LICENSE-Nemoterm.txt
          cp vendor/nerd-fonts/LICENSE dist/LICENSE-Nerd-Symbols.txt
          cp vendor/nerd-fonts/NOTICE.txt dist/LICENSE-Nerd-Components.txt
          cp README.md dist/
          printf 'Commit: %s\nBuilt: %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/BUILD-INFO.txt
          gcc --version >> dist/BUILD-INFO.txt
          objdump -p dist/nemoterm.exe | sed -n 's/.*DLL Name: /DLL: /p' >> dist/BUILD-INFO.txt
          (cd dist && sha256sum nemoterm.exe > SHA256SUMS.txt)
      - name: Bundle pinned Microsoft ConPTY runtime
        shell: pwsh
        run: ./scripts/fetch-conpty.ps1 -Architecture x64 -Destination dist
      - name: Install owned-window input instrumentation
        shell: pwsh
        run: |
          python tests/process_tree_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/memory_sample_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/owned_job_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install frida==17.24.3
      - name: Test window callback lifetime during native shutdown
        shell: pwsh
        run: |
          python tests/shutdown_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/shutdown-window-observed.json test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native window and ConPTY input and resize
        shell: pwsh
        run: |
          python tests/mouse_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/mouse-window-observed.json test-results/
      - name: Test synchronized pixels and working set
        shell: pwsh
        run: |
          python tests/sync_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/sync-window-observed.json test-results/
          Copy-Item research/sync-*.png test-results/
      - name: Test native SGR styles and colours
        shell: pwsh
        run: |
          python tests/sgr_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/sgr-window-observed.json test-results/
          Copy-Item research/sgr-styles.png test-results/
      - name: Test native font resize and GDI resources
        shell: pwsh
        run: |
          python tests/font_resize_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/font-resize-observed.json test-results/
          Copy-Item research/font-resize-*.png test-results/
          exit $testExit
      - name: Test native cursor pixels and status queries
        shell: pwsh
        run: |
          python tests/query_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/query-window-observed.json test-results/
          Copy-Item research/cursor-*.png test-results/
      - name: Test embedded icon fallback, resize and RTL allocation lifetime
        shell: pwsh
        run: |
          python tests/font_fallback_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/font-fallback-observed.json, research/font-fallback*.png test-results/
          python tests/font_fallback_window_smoke.py --font Courier
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/font-fallback-observed.json test-results/font-fallback-courier-observed.json
          Copy-Item research/font-fallback.png test-results/font-fallback-courier.png
      - name: Test native working directories and session duplication
        shell: pwsh
        run: |
          python tests/cwd_window_smoke.py 2>&1 | Tee-Object test-results/cwd-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/cwd-window-observed.json, research/cwd-window.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native shell marks, command selection and bounded memory
        shell: pwsh
        run: |
          python tests/shell_marks_window_smoke.py 2>&1 | Tee-Object test-results/shell-marks-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/shell-marks-observed.json, research/shell-marks-selected.png, research/shell-marks-truncated.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native mouse highlight handshake and pixels
        shell: pwsh
        run: |
          python tests/highlight_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/highlight-window-observed.json test-results/
          Copy-Item research/highlight-selection.png test-results/
      - name: Test native Sixel resize and partial scrolling
        shell: pwsh
        run: |
          python tests/sixel_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/sixel-window-observed.json test-results/ -ErrorAction SilentlyContinue
          Copy-Item research/sixel-*.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native Sixel font changes and pixel erasure
        shell: pwsh
        run: |
          python tests/sixel_font_window_smoke.py
          $testExit = $LASTEXITCODE
          Copy-Item research/sixel-font-*.json test-results/ -ErrorAction SilentlyContinue
          Copy-Item research/sixel-font-*.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native hyperlink hover, activation and mouse interaction
        shell: pwsh
        run: |
          Remove-Item research/hyperlink-window-observed.json, research/hyperlink-*.png -ErrorAction SilentlyContinue
          python tests/hyperlink_window_smoke.py 2>&1 | Tee-Object test-results/hyperlink-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/hyperlink-window-observed.json test-results/ -ErrorAction SilentlyContinue
          Copy-Item research/hyperlink-*.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native reflow, history and Shift selection
        shell: pwsh
        run: |
          Remove-Item research/reflow-window-observed.json, research/reflow-narrow.png, research/reflow-wide.png -ErrorAction SilentlyContinue
          python tests/reflow_window_smoke.py 2>&1 | Tee-Object test-results/reflow-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/reflow-window-observed.json, research/reflow-narrow.png, research/reflow-wide.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native keyboard protocol, copy/paste and resize
        shell: pwsh
        run: |
          Remove-Item research/keyboard-window-observed.json, research/keyboard-window.png -ErrorAction SilentlyContinue
          python tests/keyboard_window_smoke.py 2>&1 | Tee-Object test-results/keyboard-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/keyboard-window-observed.json, research/keyboard-window.png test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
          python tests/keyboard_window_smoke.py --font "Courier New" 2>&1 | Tee-Object test-results/keyboard-courier-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/keyboard-window-observed.json test-results/keyboard-courier-observed.json -ErrorAction SilentlyContinue
          Copy-Item research/keyboard-window.png test-results/keyboard-courier.png -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native OSC 52 policies, clipboard and bounded memory
        shell: pwsh
        run: |
          Remove-Item research/osc52-window-observed.json, research/osc52-window.png -ErrorAction SilentlyContinue
          python tests/osc52_window_smoke.py 2>&1 | Tee-Object test-results/osc52-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/osc52-window-observed.json, research/osc52-window.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native xterm modified keys and configured defaults
        shell: pwsh
        run: |
          Remove-Item research/mok-window-observed.json, research/mok-window.png -ErrorAction SilentlyContinue
          python tests/mok_window_smoke.py 2>&1 | Tee-Object test-results/mok-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/mok-window-observed.json, research/mok-window.png test-results/ -ErrorAction SilentlyContinue
          if ($testExit) { exit $testExit }
          python tests/mok_window_smoke.py --font "Courier New" --initial-level 3 --initial-format 1 2>&1 | Tee-Object test-results/mok-configured-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/mok-window-observed.json test-results/mok-configured-observed.json -ErrorAction SilentlyContinue
          Copy-Item research/mok-window.png test-results/mok-configured.png -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native Win32 input records and VT coexistence
        shell: pwsh
        run: |
          Remove-Item research/win32-input-observed.json, research/win32-input-window.png -ErrorAction SilentlyContinue
          python tests/win32_input_window_smoke.py 2>&1 | Tee-Object test-results/win32-input-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/win32-input-observed.json, research/win32-input-window.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native soft reset, saved mouse modes and resize
        shell: pwsh
        run: |
          Remove-Item research/state-control-observed.json, research/state-control-window.png -ErrorAction SilentlyContinue
          python tests/state_control_window_smoke.py 2>&1 | Tee-Object test-results/state-control-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/state-control-observed.json, research/state-control-window.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test native selective erasure and protected Sixel pixels
        shell: pwsh
        run: |
          python tests/selective_erase_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/selective-erase-observed.json, research/selective-erase-*.png test-results/
      - name: Test native DEC rectangle editing, Unicode copy, Sixel and memory
        shell: pwsh
        run: |
          python tests/rectangle_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/rectangle-window-observed.json, research/rectangle-*.png test-results/
      - name: Test native horizontal margins, Sixel columns and font/grid resize
        shell: pwsh
        run: |
          python tests/margins_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/margins-window-observed.json, research/margins-*.png test-results/
      - name: Test native settings save, load and local launch
        shell: pwsh
        run: |
          Remove-Item research/settings-window-observed.json, research/mok-settings.png -ErrorAction SilentlyContinue
          powershell.exe -NoProfile -File tests/settings_window_smoke.ps1 2>&1 | Tee-Object test-results/settings-native.log
          $testExit = $LASTEXITCODE
          Copy-Item research/settings-window-observed.json, research/mok-settings.png, research/shell-marks-settings.png test-results/ -ErrorAction SilentlyContinue
          exit $testExit
      - name: Test detected shells and delegated console lifetime
        shell: pwsh
        run: |
          python tests/shell_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/delegated_console_window_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item research/shell-window-observed.json, research/delegated-console-observed.json, research/shell-settings.png test-results/
      - name: Upload portable terminal
        # Only publish the package after every native rendering check succeeds.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nemoterm-windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn

  decoder-sanitizers:
    name: Terminal ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile and test decoder with sanitizers
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_sixel.c \
            vendor/putty-0.85/terminal/nemo_sixel.c -o test-sixel
          ASAN_OPTIONS=detect_leaks=1 ./test-sixel
      - name: Test colour parser with sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_colour.c \
            vendor/putty-0.85/terminal/nemo_colour.c -o test-colour
          ASAN_OPTIONS=detect_leaks=1 ./test-colour
      - name: Test bounded OpenType cmap lookup with sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/windows tests/test_font_cmap.c \
            vendor/putty-0.85/windows/nemo_font_cmap.c -o test-font-cmap
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./test-font-cmap
      - name: Test terminal image, hyperlink, keyboard and clipboard lifecycle with sanitizers
        run: |
          cmake -S vendor/putty-0.85 -B build-asan -G Ninja \
            -DPUTTY_GTK_VERSION=NONE -DPUTTY_GSSAPI=OFF \
            '-DCMAKE_C_FLAGS=-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build build-asan --target test_sixel_terminal test_hyperlink test_keyboard test_osc52 test_mok test_reflow test_win32_input test_state_control test_selective_erase test_rectangle test_margins test_cwd test_shell_marks --parallel 4
          set -o pipefail
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_sixel_terminal 2>&1 | tee terminal-image-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_hyperlink 2>&1 | tee terminal-hyperlink-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_keyboard 2>&1 | tee terminal-keyboard-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_osc52 2>&1 | tee terminal-osc52-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_mok 2>&1 | tee terminal-mok-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_reflow 2>&1 | tee terminal-reflow-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_win32_input 2>&1 | tee terminal-win32-input-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_state_control 2>&1 | tee terminal-state-control-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_selective_erase 2>&1 | tee terminal-selective-erase-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_rectangle 2>&1 | tee terminal-rectangle-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_margins 2>&1 | tee terminal-margins-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_cwd 2>&1 | tee terminal-cwd-sanitizers.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-asan/test_shell_marks 2>&1 | tee terminal-shell-marks-sanitizers.log
      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-sanitizers-${{ github.sha }}
          path: terminal-*-sanitizers.log
          if-no-files-found: warn
