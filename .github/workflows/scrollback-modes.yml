name: Output and key scrollback modes in the Windows viewport
on:
  workflow_call:
    inputs:
      product_run: {required: true, type: string}
      product_commit: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  records:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: {renderer: [gdi, directx]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch the exact single executable
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/scrollback-modes-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/scrollback-modes-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install and identify Sarasa Light
        run: scripts/prepare-remote-interaction.ps1
      - name: Compare raw XTerm replies and native scroll position on output and key input
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/scrollback_modes_window.py
      - name: Hold Shift in history while a mouse-tracking client prints, copy, then type
        if: ${{ !cancelled() && env.NEMOTERM_TEST_FONT != '' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/scrollback_modes_window.py --history-selection
      - name: Check history clears during a physical Shift press, drag and released selection
        if: ${{ !cancelled() && env.NEMOTERM_TEST_FONT != '' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/selection_clear_history.py
      - name: Preserve rectangular highlight columns as selected history rows are evicted
        if: ${{ !cancelled() && env.NEMOTERM_TEST_FONT != '' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/selection_history_eviction.py
      - name: Preserve copied columns across a TUI's partial vertical scroll region
        if: ${{ !cancelled() && env.NEMOTERM_TEST_FONT != '' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/selection_scroll_region.py
      - name: Right-click the surviving selection or return the click to the TUI
        if: ${{ !cancelled() && env.NEMOTERM_TEST_FONT != '' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/selection_scroll_region.py --right-click
      - name: Edit one row beside a real mouse rectangle and then right-click
        if: ${{ !cancelled() && env.NEMOTERM_TEST_FONT != '' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/selection_block_row_edit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scrollback-modes-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/scrollback-modes-*.json
            research/scrollback-held-history.json
            research/scrollback-block-edit*
            research/scrollback-region*
            research/scrollback-rectangle*
            research/scrollback-clear-*
            build/scrollback-modes-product/SOURCE-HOST.json
            build/interaction-dependencies/environment.json
          if-no-files-found: error
