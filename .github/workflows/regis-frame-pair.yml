name: Compare presented Windows frames with XTerm before and after its first expose
on:
  workflow_call:
    inputs:
      bank_start: {type: boolean, default: false}
      product_run: {type: string, required: true}
      product_commit: {type: string, required: true}
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.bank_start && '["bank-start-fresh-shared","bank-start-fresh-private","bank-start-after-ris","bank-start-after-decstr","bank-start-regis-first","bank-start-private-first","bank-start-defined-shared"]' || '["scroll-up-end-2","scroll-down-end-1","scroll-down-end-2","newline-scroll-end-2","regis-palette-False-end-1","erase-line-end-1","erase-line-end-2","control-text-end-1","control-line-erase-end-1","control-line-erase-end-2"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch exact executable and record font identity
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/frame-pair-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/frame-pair-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          scripts/prepare-remote-interaction.ps1
      - name: Compare original, never-exposed input prefix then repaint the owned HWND once
        env:
          ENDPOINT_CASE: ${{ matrix.target }}
        run: |
          python -m pip install Pillow==13.0.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/regis_paired_window.py $env:ENDPOINT_CASE --renderer gdi --presented-gdi
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regis-frame-pair-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/regis-window-pair-*
            build/frame-pair-product/SOURCE-HOST.json
            build/interaction-dependencies/environment.json
          if-no-files-found: error
