name: Remote Windows DPI acceptance

on:
  workflow_call:
    inputs:
      product_run:
        required: true
        type: string
      product_commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      product_run:
        description: Run ID containing a successful source-console-host build job
        required: true
        type: string
      product_commit:
        description: Exact 40-character product source commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dpi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dpi:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      NEMOTERM_TEST_TRACEBACK_SECONDS: '60'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Download and verify the exact single executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          if ($env:PRODUCT_RUN -notmatch '^\d+$' -or $env:PRODUCT_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Invalid product identity' }
          $run=gh run view $env:PRODUCT_RUN --repo $env:GITHUB_REPOSITORY --json headSha,jobs | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.headSha -ne $env:PRODUCT_COMMIT) { throw 'Source run identity mismatch' }
          $sourceJob=@($run.jobs | Where-Object { $_.name -eq 'Source-built console host for compiler comparison' -and $_.conclusion -eq 'success' })
          if ($sourceJob.Count -ne 1) { throw 'Expected a successful source-host build job' }
          git diff --quiet $env:PRODUCT_COMMIT HEAD -- vendor native scripts/build.ps1 scripts/build-single-exe.ps1 scripts/prepare-single-exe.py
          if ($LASTEXITCODE) { throw 'Production differs; select a fresh source-host artifact' }
          gh run download $env:PRODUCT_RUN --repo $env:GITHUB_REPOSITORY --name "source-console-host-x64-$env:PRODUCT_COMMIT" --dir build/dpi-product
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $record=Get-Content build/dpi-product/SOURCE-HOST.json -Raw | ConvertFrom-Json
          $exe=(Resolve-Path build/dpi-product/nemoterm.exe).Path
          if ($record.SourceCommit -ne $env:PRODUCT_COMMIT -or $record.Executable.SHA256 -ne (Get-FileHash $exe).Hash.ToLowerInvariant() -or $record.Executable.Bytes -ne (Get-Item $exe).Length) { throw 'Executable identity mismatch' }
          New-Item -ItemType Directory build/dpi-check/research,build/dpi-check/tools,build/dpi-check/build | Out-Null
          Copy-Item tests build/dpi-check/tests -Recurse
          Copy-Item tools/nemoterm_debug.py build/dpi-check/tools/
          "NEMOTERM_TEST_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NEMOTERM_DPI_PRODUCT_RUN=$env:PRODUCT_RUN" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NEMOTERM_DPI_PRODUCT_COMMIT=$env:PRODUCT_COMMIT" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile the test-only display environment probe
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cl /nologo /W4 /WX /EHsc /std:c++17 tests/dpi_display_probe.cpp /Febuild/dpi-check/build/dpi-display.exe /Fobuild/dpi-check/build/dpi-display.obj user32.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /W4 /WX /EHsc /std:c++17 tests/dpi_settings_probe.cpp /Febuild/dpi-check/build/dpi-settings.exe /Fobuild/dpi-check/build/dpi-settings.obj user32.lib ole32.lib oleaut32.lib uiautomationcore.lib uuid.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/dpi-check/build/dpi-display.exe | Tee-Object build/dpi-check/research/display-environment.json
          exit $LASTEXITCODE
      - name: Synthetic terminal and input-method DPI transitions
        shell: pwsh
        run: |
          python -m pip install frida==17.24.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($mode in @('standalone','tabs')) {
            New-Item -ItemType Directory "build/dpi-check/research/synthetic-$mode" | Out-Null
            $arguments=@('--font','Consolas','--dpi-sequence','96,120,144,168,192,96')
            if ($mode -eq 'tabs') { $arguments+='--tabs' }
            python build/dpi-check/tests/input_method_window_smoke.py @arguments
            $result=$LASTEXITCODE
            Copy-Item build/dpi-check/research/*input-method-* "build/dpi-check/research/synthetic-$mode/" -Force -ErrorAction SilentlyContinue
            if ($result) { exit $result }
          }
      - name: Actual system scaling, cold starts, live settings and terminal pixels
        if: ${{ !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        shell: pwsh
        run: |
          python build/dpi-check/tests/dpi_window_smoke.py --display-helper build/dpi-check/build/dpi-display.exe --renderer gdi 2>&1 | Tee-Object build/dpi-check/research/dpi-real-gdi.log
          exit $LASTEXITCODE
      - name: Publish measured coverage and gaps
        if: always()
        shell: pwsh
        run: python tests/dpi_report.py --evidence build/dpi-check/research
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dpi-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/dpi-product/SOURCE-HOST.json
            build/dpi-check/research/
            build/dpi-check/build/*.json
          if-no-files-found: error
          retention-days: 14
