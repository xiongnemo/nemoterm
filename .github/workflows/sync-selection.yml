name: Shift selection from the presented frame
on:
  workflow_call:
    inputs:
      product_run: {required: true, type: string}
      product_commit: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: {renderer: [gdi, directx]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: prepare
        name: Fetch the exact release executable and verify the Sarasa Light face
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/sync-selection-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/sync-selection-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          scripts/prepare-remote-interaction.ps1
      - name: Compare actual clipboard, presented cells and child input during a synchronized frame
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/sync_presented_selection.py $env:RENDERER
      - name: Verify optional right-click copy and paste delivers exactly the displayed selection
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/sync_presented_selection.py $env:RENDERER --paste
      - name: Verify fullscreen corner menu and Shift selection using real desktop input
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: |
          python -m pip install --only-binary=:all: Pillow==13.0.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $failed=$false
          foreach ($placement in @('standalone','top','bottom','left','right')) {
            python tests/fullscreen_corner_selection.py $env:RENDERER $placement
            if ($LASTEXITCODE) { $failed=$true }
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sync-selection-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/sync-select-*
            research/fullscreen-corner-*
            build/sync-selection-product/SOURCE-HOST.json
            build/interaction-dependencies/environment.json
          if-no-files-found: error

  review:
    name: Verify both rendered windows from the uploaded PNGs
    needs: observe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the original renderer archives and check their GitHub digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir review
          for renderer in gdi directx; do
            name="sync-selection-$renderer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            record=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f "name=$name")
            id=$(jq -er --arg n "$name" '[.artifacts[] | select(.name==$n and (.expired|not))] | select(length==1) | .[0].id' <<< "$record")
            digest=$(jq -er --argjson id "$id" '.artifacts[] | select(.id==$id) | .digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$record")
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "review/$renderer.zip"
            echo "${digest#sha256:}  review/$renderer.zip" | sha256sum --check
          done
      - name: Compare cell bounds, glyphs, clipboard, child input and product identity
        env:
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          python3 -m venv "$RUNNER_TEMP/selection-review"
          "$RUNNER_TEMP/selection-review/bin/pip" install --only-binary=:all: Pillow==13.0.0
          "$RUNNER_TEMP/selection-review/bin/python" scripts/review-sync-selection.py --expect-commit "$PRODUCT_COMMIT" --output review/results.json review/gdi.zip review/directx.zip
      - name: Independently verify fullscreen selections from original window pixels and input
        if: ${{ !cancelled() && hashFiles('review/gdi.zip', 'review/directx.zip') != '' }}
        env:
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: '"$RUNNER_TEMP/selection-review/bin/python" scripts/review-fullscreen-corner.py --commit "$PRODUCT_COMMIT" --output review/fullscreen.json review/gdi.zip review/directx.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && hashFiles('review/results.json', 'review/fullscreen.json') != '' }}
        with:
          name: sync-selection-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            review/results.json
            review/fullscreen.json
          if-no-files-found: error
