name: Windows UI artifact replay

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Checks or notice-only packaging against the exact artifact
        type: choice
        options: [font-bell, dpi, interaction, single, ui-regression, shell-lifetime, tcap, portable-notices, regis-window, regis-frame-pair, regis-presented-matrix, regis-bank-start, column-cells, pointer-colour, colour-input, unicode-boundary, picture-keys, image-timing, image-mixed, image-mixed-opencode, image-reads, image-files, image-reference, draft-reference, draft-product, paste-order, pterm-images, pterm-memory, agent-session-memory, profile-dump, profile-env, wsl-tui, wsl-sixel, wsl-vim, wsl-tmux-vim, wsl-colour, wsl-paste-quote, wsl-byte-path, wsl-drop, rendering-settings, close-cancel, profile-sequence, font-ops, scrollback-modes, paste-lines, paste-quote, fullscreen]
        default: font-bell
      source_commit:
        description: Full source commit of the source-console-host artifact
        type: string
        required: true
      source_run:
        description: Successful Test and build run containing that artifact
        type: string
        required: true
      groups:
        description: Optional JSON array of interaction groups; empty runs all
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  column-cells:
    if: inputs.suite == 'column-cells'
    uses: ./.github/workflows/column-cells.yml
    with:
      source_commit: ${{ inputs.source_commit }}
      source_run: ${{ inputs.source_run }}
  wsl-tui:
    if: ${{ inputs.suite == 'wsl-tui' || inputs.suite == 'wsl-sixel' || inputs.suite == 'wsl-vim' || inputs.suite == 'wsl-tmux-vim' || inputs.suite == 'wsl-colour' || inputs.suite == 'wsl-paste-quote' || inputs.suite == 'wsl-byte-path' || inputs.suite == 'wsl-drop' }}
    uses: ./.github/workflows/wsl-tui.yml
    with:
      run: ${{ inputs.source_run }}
      commit: ${{ inputs.source_commit }}
      suite: ${{ inputs.suite == 'wsl-drop' && 'drop' || inputs.suite == 'wsl-byte-path' && 'byte-path' || inputs.suite == 'wsl-paste-quote' && 'paste-quote' || inputs.suite == 'wsl-sixel' && 'sixel' || inputs.suite == 'wsl-tmux-vim' && 'tmux-vim' || inputs.suite == 'wsl-vim' && 'vim' || inputs.suite == 'wsl-colour' && 'colour' || 'pager' }}
  paste-lines:
    if: ${{ inputs.suite == 'paste-lines' || inputs.suite == 'paste-quote' }}
    uses: ./.github/workflows/paste-lines.yml
    with:
      quote_only: ${{ inputs.suite == 'paste-quote' }}
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  scrollback-modes:
    if: ${{ inputs.suite == 'scrollback-modes' }}
    uses: ./.github/workflows/scrollback-modes.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  font-ops:
    if: ${{ inputs.suite == 'font-ops' }}
    uses: ./.github/workflows/font-ops.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  profile-sequence:
    if: ${{ inputs.suite == 'profile-sequence' }}
    uses: ./.github/workflows/profile-checks.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  profile-dump:
    if: ${{ inputs.suite == 'profile-dump' }}
    runs-on: windows-2025
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Unwind the original mixed-profile timeout dump without starting the terminal
        shell: pwsh
        run: ./scripts/read-profile-dump.ps1 -Commit $env:SOURCE_COMMIT -Run $env:SOURCE_RUN
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profile-dump-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/profile-dump/report/
          if-no-files-found: error
  pterm-memory:
    if: ${{ inputs.suite == 'pterm-images' || inputs.suite == 'pterm-memory' || inputs.suite == 'agent-session-memory' }}
    uses: ./.github/workflows/pterm-memory.yml
    with:
      multi_turn: ${{ inputs.suite == 'agent-session-memory' }}
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  regis-presented-matrix:
    if: inputs.suite == 'regis-presented-matrix'
    uses: ./.github/workflows/regis-presented-matrix.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  regis-frame-pair:
    if: ${{ inputs.suite == 'regis-frame-pair' || inputs.suite == 'regis-bank-start' }}
    uses: ./.github/workflows/regis-frame-pair.yml
    with:
      bank_start: ${{ inputs.suite == 'regis-bank-start' }}
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  regis-window:
    if: ${{ inputs.suite == 'regis-window' }}
    uses: ./.github/workflows/regis-window.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  paste-order:
    if: ${{ inputs.suite == 'paste-order' }}
    uses: ./.github/workflows/paste-order.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  draft-product:
    if: ${{ inputs.suite == 'draft-product' }}
    uses: ./.github/workflows/codex-draft-product.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  image-reference:
    if: ${{ inputs.suite == 'image-reference' || inputs.suite == 'draft-reference' }}
    uses: ./.github/workflows/codex-image-reference.yml
    with:
      draft_order: ${{ inputs.suite == 'draft-reference' }}
  image-timing:
    if: ${{ inputs.suite == 'image-timing' || inputs.suite == 'image-mixed' || inputs.suite == 'image-mixed-opencode' || inputs.suite == 'image-files' || inputs.suite == 'image-reads' }}
    uses: ./.github/workflows/codex-image-timing.yml
    with:
      mixed_bitmap: ${{ inputs.suite == 'image-mixed' || inputs.suite == 'image-mixed-opencode' }}
      mixed_opencode: ${{ inputs.suite == 'image-mixed-opencode' }}
      image_files: ${{ inputs.suite == 'image-files' }}
      bitmap_witness: ${{ inputs.suite == 'image-reads' }}
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  picture-keys:
    if: ${{ inputs.suite == 'picture-keys' }}
    uses: ./.github/workflows/picture-keys.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  unicode-boundary:
    if: ${{ inputs.suite == 'unicode-boundary' }}
    uses: ./.github/workflows/claude-unicode.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  colour-input:
    if: ${{ inputs.suite == 'colour-input' }}
    uses: ./.github/workflows/console-colour-input.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  portable-notices:
    if: ${{ inputs.suite == 'portable-notices' }}
    uses: ./.github/workflows/portable-package-replay.yml
    with:
      source_run: ${{ inputs.source_run }}
      source_commit: ${{ inputs.source_commit }}
  shell-lifetime:
    if: ${{ inputs.suite == 'shell-lifetime' }}
    uses: ./.github/workflows/shell-lifetime.yml
    with:
      source_run: ${{ inputs.source_run }}
      source_commit: ${{ inputs.source_commit }}
  interaction:
    if: ${{ inputs.suite == 'interaction' }}
    uses: ./.github/workflows/remote-interaction.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
      groups: ${{ inputs.groups }}
  single:
    if: ${{ inputs.suite == 'single' }}
    uses: ./.github/workflows/single-exe.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  dpi:
    if: ${{ inputs.suite == 'dpi' || inputs.suite == 'rendering-settings' }}
    uses: ./.github/workflows/dpi.yml
    with:
      rendering_only: ${{ inputs.suite == 'rendering-settings' }}
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  focused-replay:
    if: ${{ inputs.suite == 'font-bell' || inputs.suite == 'ui-regression' || inputs.suite == 'tcap' || inputs.suite == 'pointer-colour' || inputs.suite == 'profile-env' || inputs.suite == 'close-cancel' || inputs.suite == 'fullscreen' }}
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_RUN: ${{ inputs.source_run }}
      NEMOTERM_TEST_TRACEBACK_SECONDS: '60'
      NEMOTERM_SHUTDOWN_DEADLINE_SECONDS: '120'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify source identity and isolate the previously built image
        shell: pwsh
        run: |
          # This workflow diagnoses fixture changes only. Refuse to reuse an
          # old image if any production source or build recipe has changed.
          ./scripts/fetch-ci-product.ps1 -Run $env:SOURCE_RUN -Commit $env:SOURCE_COMMIT -Destination build/source-artifact
          $record = Get-Content build/source-artifact/SOURCE-HOST.json -Raw | ConvertFrom-Json
          if ($record.SourceCommit -ne $env:SOURCE_COMMIT) { throw 'Source commit mismatch' }
          $image = Get-Item build/source-artifact/nemoterm.exe
          $digest = (Get-FileHash $image.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($record.Executable.SHA256 -ne $digest -or $record.Executable.Bytes -ne $image.Length) { throw 'Image identity mismatch' }
          New-Item -ItemType Directory -Force build/focused-product, build/focused-evidence | Out-Null
          Copy-Item $image.FullName build/focused-product/nemoterm.exe
          $env:NEMOTERM_TEST_EXE = (Resolve-Path build/focused-product/nemoterm.exe).Path
          "NEMOTERM_TEST_EXE=$env:NEMOTERM_TEST_EXE" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          [ordered]@{
            source_commit = $env:SOURCE_COMMIT
            fixture_commit = (git rev-parse HEAD).Trim()
            source_run = $env:SOURCE_RUN
            executable_sha256 = $digest
            executable_bytes = $image.Length
            execution_directory_files = @(Get-ChildItem build/focused-product -File | ForEach-Object Name)
            scope = 'Fixture replay against unchanged production; not a build or memory acceptance'
          } | ConvertTo-Json | Set-Content build/focused-evidence/identity.json -Encoding utf8
      - name: Install test dependencies
        run: python -m pip install frida==17.24.3
      - name: Verify xterm fullscreen against standalone and tab host rectangles
        if: ${{ inputs.suite == 'fullscreen' }}
        shell: pwsh
        run: |
          ./scripts/prepare-remote-interaction.ps1
          $env:NEMOTERM_TEST_FONT='SarasaTermSC Nerd Light'
          $failed=$false
          foreach ($hostMode in @('standalone','tabs')) {
            $opts=@('tests/window_resize_window_smoke.py','--renderer','0')
            if ($hostMode -eq 'tabs') { $opts+='--tabs' }
            python @opts
            if ($LASTEXITCODE) { $failed=$true }
            $name=if ($hostMode -eq 'tabs') {'tabs-window-resize-observed.json'} else {'window-resize-observed.json'}
            Copy-Item -LiteralPath "research/$name" -Destination build/focused-evidence -ErrorAction Stop
          }
          if ($failed) { exit 1 }
      - name: Click Cancel and immediately type into the child
        if: ${{ inputs.suite == 'close-cancel' }}
        run: python tests/close_cancel_input.py
      - name: Read the terminal identity from ordinary and jump-list profile children
        if: ${{ inputs.suite == 'profile-env' }}
        run: python tests/profile_term_environment.py
      - name: Compare actual Windows cursor colours with pinned XTerm observations
        if: ${{ inputs.suite == 'pointer-colour' }}
        shell: pwsh
        run: |
          python tests/pointer_window_smoke.py --colour-reference testdata/upstream/pointer-colour-resets-reference.zip 2>&1 | Tee-Object build/focused-evidence/pointer-colour.log
          exit $LASTEXITCODE
      - name: Replay terminfo keyboard bytes and independent capability permissions
        if: ${{ inputs.suite == 'tcap' }}
        shell: pwsh
        run: |
          python scripts/generate-tcap-query-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-tcap-key-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $failed = 0
          python tests/tcap_keys_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/tcap-keys.log
          if ($LASTEXITCODE) { $failed = 1 }
          python tests/feature_policy_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/feature-policy.log
          if ($LASTEXITCODE) { $failed = 1 }
          exit $failed
      - name: Compare zoom pixels and application input
        if: ${{ inputs.suite == 'font-bell' }}
        shell: pwsh
        run: |
          python tests/font_zoom_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/font-zoom.log
          exit $LASTEXITCODE
      - name: Check sibling tabs and saved font settings
        if: ${{ inputs.suite == 'font-bell' && !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        shell: pwsh
        run: |
          python tests/tabs_profiles_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/tabs-profiles.log
          exit $LASTEXITCODE
      - name: Observe real bell API dispatch
        if: ${{ inputs.suite == 'font-bell' && !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        shell: pwsh
        run: |
          python tests/bell_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/bell.log
          exit $LASTEXITCODE
      - name: Verify visual bell pixels and restoration
        if: ${{ inputs.suite == 'font-bell' && !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        shell: pwsh
        run: |
          python tests/bell_visual_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/visual-bell.log
          exit $LASTEXITCODE
      - name: Repeat dialog modality and zoom with valid input snapshots
        if: ${{ inputs.suite == 'ui-regression' }}
        shell: pwsh
        run: |
          foreach ($iteration in 1..3) {
            foreach ($mode in @('tabs','standalone')) {
              $arguments=@('-NoProfile','-File','tests/dialog_window_smoke.ps1')
              if ($mode -eq 'tabs') { $arguments+='-TabHost' }
              powershell.exe @arguments 2>&1 | Tee-Object "build/focused-evidence/dialog-$mode-$iteration.log"
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
          }
      - name: Verify GPU failure recovery through the owned modal settings window
        if: ${{ inputs.suite == 'ui-regression' && !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        shell: pwsh
        run: |
          python tests/gpu_lifecycle_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/gpu-lifecycle.log
          exit $LASTEXITCODE
      - name: Retain the child environment observations
        if: ${{ always() && inputs.suite == 'profile-env' }}
        shell: pwsh
        run: |
          if (Test-Path research/profile-term-environment.json) { Copy-Item -LiteralPath research/profile-term-environment.json -Destination build/focused-evidence/ }
      - name: Retain complete observations
        if: ${{ always() && inputs.suite != 'profile-env' && inputs.suite != 'fullscreen' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/focused-evidence | Out-Null
          if (Test-Path research/pointer-native-window) {
            Copy-Item research/pointer-native-window build/focused-evidence/ -Recurse
          }
          Copy-Item research/dialog-*.json*, research/gpu-lifecycle-* build/focused-evidence/ -ErrorAction SilentlyContinue
          Copy-Item research/font-zoom-observed.json, research/tabs-profiles-observed.json, research/bell-mode-*-observed.json build/focused-evidence/ -ErrorAction SilentlyContinue
          Copy-Item research/visual-bell-observed.json, research/visual-bell-*.png build/focused-evidence/ -ErrorAction SilentlyContinue
          Copy-Item research/tcap-keys-observed.json, research/feature-policy-*-observed.json build/focused-evidence/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-replay-${{ inputs.suite }}-${{ github.sha }}
          path: build/focused-evidence/
          retention-days: 14
          if-no-files-found: error
