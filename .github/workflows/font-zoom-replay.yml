name: Windows UI artifact replay

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Checks or notice-only packaging against the exact artifact
        type: choice
        options: [font-bell, dpi, interaction, single, ui-regression, shell-lifetime, tcap, portable-notices, regis-window]
        default: font-bell
      source_commit:
        description: Full source commit of the source-console-host artifact
        type: string
        required: true
      source_run:
        description: Successful Test and build run containing that artifact
        type: string
        required: true
      groups:
        description: Optional JSON array of interaction groups; empty runs all
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  regis-window:
    if: ${{ inputs.suite == 'regis-window' }}
    uses: ./.github/workflows/regis-window.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  portable-notices:
    if: ${{ inputs.suite == 'portable-notices' }}
    uses: ./.github/workflows/portable-package-replay.yml
    with:
      source_run: ${{ inputs.source_run }}
      source_commit: ${{ inputs.source_commit }}
  shell-lifetime:
    if: ${{ inputs.suite == 'shell-lifetime' }}
    uses: ./.github/workflows/shell-lifetime.yml
    with:
      source_run: ${{ inputs.source_run }}
      source_commit: ${{ inputs.source_commit }}
  interaction:
    if: ${{ inputs.suite == 'interaction' }}
    uses: ./.github/workflows/remote-interaction.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
      groups: ${{ inputs.groups }}
  single:
    if: ${{ inputs.suite == 'single' }}
    uses: ./.github/workflows/single-exe.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  dpi:
    if: ${{ inputs.suite == 'dpi' }}
    uses: ./.github/workflows/dpi.yml
    with:
      product_run: ${{ inputs.source_run }}
      product_commit: ${{ inputs.source_commit }}
  focused-replay:
    if: ${{ inputs.suite == 'font-bell' || inputs.suite == 'ui-regression' || inputs.suite == 'tcap' }}
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_RUN: ${{ inputs.source_run }}
      NEMOTERM_TEST_TRACEBACK_SECONDS: '60'
      NEMOTERM_SHUTDOWN_DEADLINE_SECONDS: '120'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify source identity and isolate the previously built image
        shell: pwsh
        run: |
          # This workflow diagnoses fixture changes only. Refuse to reuse an
          # old image if any production source or build recipe has changed.
          ./scripts/fetch-ci-product.ps1 -Run $env:SOURCE_RUN -Commit $env:SOURCE_COMMIT -Destination build/source-artifact
          $record = Get-Content build/source-artifact/SOURCE-HOST.json -Raw | ConvertFrom-Json
          if ($record.SourceCommit -ne $env:SOURCE_COMMIT) { throw 'Source commit mismatch' }
          $image = Get-Item build/source-artifact/nemoterm.exe
          $digest = (Get-FileHash $image.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($record.Executable.SHA256 -ne $digest -or $record.Executable.Bytes -ne $image.Length) { throw 'Image identity mismatch' }
          New-Item -ItemType Directory -Force build/focused-product, build/focused-evidence | Out-Null
          Copy-Item $image.FullName build/focused-product/nemoterm.exe
          $env:NEMOTERM_TEST_EXE = (Resolve-Path build/focused-product/nemoterm.exe).Path
          "NEMOTERM_TEST_EXE=$env:NEMOTERM_TEST_EXE" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          [ordered]@{
            source_commit = $env:SOURCE_COMMIT
            fixture_commit = (git rev-parse HEAD).Trim()
            source_run = $env:SOURCE_RUN
            executable_sha256 = $digest
            executable_bytes = $image.Length
            execution_directory_files = @(Get-ChildItem build/focused-product -File | ForEach-Object Name)
            scope = 'Fixture replay against unchanged production; not a build or memory acceptance'
          } | ConvertTo-Json | Set-Content build/focused-evidence/identity.json -Encoding utf8
      - name: Install test dependencies
        run: python -m pip install frida==17.24.3
      - name: Replay terminfo keyboard bytes and independent capability permissions
        if: ${{ inputs.suite == 'tcap' }}
        shell: pwsh
        run: |
          python scripts/generate-tcap-query-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-tcap-key-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $failed = 0
          python tests/tcap_keys_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/tcap-keys.log
          if ($LASTEXITCODE) { $failed = 1 }
          python tests/feature_policy_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/feature-policy.log
          if ($LASTEXITCODE) { $failed = 1 }
          exit $failed
      - name: Compare zoom pixels and application input
        if: ${{ inputs.suite == 'font-bell' }}
        shell: pwsh
        run: |
          python tests/font_zoom_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/font-zoom.log
          exit $LASTEXITCODE
      - name: Check sibling tabs and saved font settings
        if: ${{ inputs.suite == 'font-bell' && !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        shell: pwsh
        run: |
          python tests/tabs_profiles_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/tabs-profiles.log
          exit $LASTEXITCODE
      - name: Observe real bell API dispatch
        if: ${{ inputs.suite == 'font-bell' && !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        shell: pwsh
        run: |
          python tests/bell_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/bell.log
          exit $LASTEXITCODE
      - name: Verify visual bell pixels and restoration
        if: ${{ inputs.suite == 'font-bell' && !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        shell: pwsh
        run: |
          python tests/bell_visual_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/visual-bell.log
          exit $LASTEXITCODE
      - name: Repeat dialog modality and zoom with valid input snapshots
        if: ${{ inputs.suite == 'ui-regression' }}
        shell: pwsh
        run: |
          foreach ($iteration in 1..3) {
            foreach ($mode in @('tabs','standalone')) {
              $arguments=@('-NoProfile','-File','tests/dialog_window_smoke.ps1')
              if ($mode -eq 'tabs') { $arguments+='-TabHost' }
              powershell.exe @arguments 2>&1 | Tee-Object "build/focused-evidence/dialog-$mode-$iteration.log"
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
          }
      - name: Verify GPU failure recovery through the owned modal settings window
        if: ${{ inputs.suite == 'ui-regression' && !cancelled() && env.NEMOTERM_TEST_EXE != '' }}
        shell: pwsh
        run: |
          python tests/gpu_lifecycle_window_smoke.py 2>&1 | Tee-Object build/focused-evidence/gpu-lifecycle.log
          exit $LASTEXITCODE
      - name: Retain complete observations
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/focused-evidence | Out-Null
          Copy-Item research/dialog-*.json*, research/gpu-lifecycle-* build/focused-evidence/ -ErrorAction SilentlyContinue
          Copy-Item research/font-zoom-observed.json, research/tabs-profiles-observed.json, research/bell-mode-*-observed.json build/focused-evidence/ -ErrorAction SilentlyContinue
          Copy-Item research/visual-bell-observed.json, research/visual-bell-*.png build/focused-evidence/ -ErrorAction SilentlyContinue
          Copy-Item research/tcap-keys-observed.json, research/feature-policy-*-observed.json build/focused-evidence/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-replay-${{ inputs.suite }}-${{ github.sha }}
          path: build/focused-evidence/
          retention-days: 14
          if-no-files-found: error
