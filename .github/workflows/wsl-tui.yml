name: WSL xterm application replay
on:
  workflow_call:
    inputs:
      run: {type: string, required: true}
      commit: {type: string, required: true}
      suite: {type: string, default: pager}
permissions:
  contents: read
  actions: read
jobs:
  linux-pty:
    if: inputs.suite == 'paste-quote'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Feed the XTerm capture to the kernel's private PTY
        env: {NEMO_HOSTED_PTY_FIXTURE: '1'}
        run: python3 tests/quoted_devpts_reference.py testdata/upstream/xterm412-paste-quote.zip records/linux-devpts.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-quote-devpts-${{ github.run_id }}-${{ github.run_attempt }}
          path: records/linux-devpts.json
          if-no-files-found: error
  wsl:
    runs-on: windows-2025
    timeout-minutes: 18
    env:
      NEMOTERM_TEST_SHELL: wsl-bash
      NEMOTERM_REQUIRED_SHELLS: wsl-bash
      NEMOTERM_TEST_WSL_DISTRO: Ubuntu-24.04
      NEMOTERM_WSL_KEY_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Verify the source-built single executable
        if: inputs.suite != 'byte-path'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.run }}
          PRODUCT_COMMIT: ${{ inputs.commit }}
        run: |
          ./scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/wsl-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/wsl-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          set-as-default: 'true'
          update: 'false'
          use-cache: 'false'
      - name: Verify or install signed Ubuntu fixture packages over HTTPS
        shell: pwsh
        env:
          WSL_FIXTURE_SUITE: ${{ inputs.suite == 'byte-path' && 'paste-quote' || inputs.suite }}
        run: ./scripts/prepare-hosted-wsl-packages.ps1 -Suite $env:WSL_FIXTURE_SUITE
      - name: Prepare font and fixture
        if: inputs.suite != 'byte-path'
        id: prepare
        shell: pwsh
        run: |
          ./scripts/prepare-remote-interaction.ps1
          python -m pip install frida==17.24.3 Pillow==13.0.0
          New-Item -ItemType Directory -Force build/wsl-check/tools,build/wsl-check/research,build/wsl-check/build | Out-Null
          Copy-Item tests build/wsl-check/tests -Recurse
          Copy-Item tools/nemoterm_debug.py build/wsl-check/tools/
      - name: Check byte-preserving WSL pipes with a real Linux PTY
        if: inputs.suite == 'paste-quote' || inputs.suite == 'byte-path'
        run: python tests/wsl_pipe_pty.py
      - name: Isolate the hosted WSL kernel line discipline with a fresh private PTY
        if: ${{ !cancelled() && inputs.suite == 'paste-quote' && steps.prepare.outcome == 'success' }}
        shell: pwsh
        run: |
          wsl.exe --distribution Ubuntu-24.04 --cd $env:GITHUB_WORKSPACE --exec /usr/bin/env NEMO_HOSTED_PTY_FIXTURE=1 /usr/bin/python3 tests/quoted_devpts_reference.py testdata/upstream/xterm412-paste-quote.zip build/wsl-check/research/wsl-devpts.json
          exit $LASTEXITCODE
      - name: Compare a Linux raw reader and canonical input with the XTerm clipboard
        if: ${{ !cancelled() && inputs.suite == 'paste-quote' && steps.prepare.outcome == 'success' }}
        run: |
          Copy-Item testdata/upstream/xterm412-paste-quote.zip build/wsl-check/
          $session = "NemoReaders-${{ github.run_id }}-${{ github.run_attempt }}"
          wpr -start tests/console_readers.wprp!ConsoleReaders -filemode -instancename $session
          $started = $LASTEXITCODE -eq 0
          try {
            python build/wsl-check/tests/wsl_paste_quote.py
            $fixture = $LASTEXITCODE
          } finally {
            if ($started) {
              wpr -stop build/wsl-check/research/console-readers.etl -instancename $session
              if ($LASTEXITCODE) { throw 'Could not finalize the owned reader trace' }
              tracerpt build/wsl-check/research/console-readers.etl -of XML -o build/wsl-check/research/console-readers.xml -y
              if ($LASTEXITCODE) { throw 'Could not decode the reader trace; inspect the ETL' }
            }
          }
          if (-not $started) { throw 'WPR did not start; clipboard evidence retained independently' }
          exit $fixture
      - name: Compare a real WSL image against the libsixel decoder on GDI and DirectX
        if: inputs.suite == 'sixel'
        run: python build/wsl-check/tests/wsl_sixel_image.py
      - name: Exercise ordinary mouse, forced selection, paste and window resize in WSL Vim
        if: inputs.suite == 'vim'
        run: python build/wsl-check/tests/wsl_vim_interaction.py
      - name: Exercise nested mouse ownership and resize with tmux and Vim
        if: inputs.suite == 'tmux-vim'
        run: python build/wsl-check/tests/wsl_vim_interaction.py --tmux
      - name: Compare Ubuntu terminfo colour sequences to native pixels and screen restoration
        if: inputs.suite == 'colour'
        run: python build/wsl-check/tests/wsl_terminfo_colour.py
      - name: Read the WSL terminal type and exercise direct and recorded less
        if: inputs.suite == 'pager'
        run: python build/wsl-check/tests/shell_window_smoke.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.suite == 'byte-path' && 'wsl-byte-path' || inputs.suite == 'paste-quote' && 'wsl-paste-quote' || inputs.suite == 'sixel' && 'wsl-sixel' || inputs.suite == 'tmux-vim' && 'wsl-tmux-vim' || inputs.suite == 'vim' && 'wsl-vim' || inputs.suite == 'colour' && 'wsl-colour' || 'wsl-tui' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/wsl-provision/*.log
            build/wsl-check/research/
            build/wsl-product/SOURCE-HOST.json
            build/interaction-dependencies/environment.json
          if-no-files-found: error
