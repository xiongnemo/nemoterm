name: Native multiline clipboard paste against XTerm
on:
  workflow_call:
    inputs:
      quote_only: {type: boolean, default: false}
      diagnose_exit: {type: boolean, default: false}
      product_run: {required: true, type: string}
      product_commit: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  records:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: {renderer: [gdi, directx]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch the exact single executable
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/paste-lines-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/paste-lines-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install and identify Sarasa Light
        run: scripts/prepare-remote-interaction.ps1
      - name: Paste native clipboard text and compare the child input with XTerm
        if: ${{ !inputs.quote_only }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/paste_lines_window.py
      - name: Preserve physical paste and Return order while the clipboard owner waits
        if: ${{ !cancelled() && !inputs.quote_only }}
        env: {RENDERER: "${{ matrix.renderer }}"}
        run: python tests/delayed_paste_order_window.py
      - name: Release input and ignore the late result from a stalled clipboard owner
        if: ${{ !cancelled() && !inputs.quote_only }}
        env: {RENDERER: "${{ matrix.renderer }}"}
        run: python tests/delayed_paste_order_window.py --expiry
      - name: Install the read-only frontend pipe observer for the quote replay
        if: inputs.quote_only
        run: python -m pip install frida==17.24.3
      - name: Verify the timeout-only owned-process diagnostic on the runner
        if: inputs.diagnose_exit
        run: |
          scripts/test-failure-dump.ps1 -Destination build/quote-exit-controls
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "NEMOTERM_QUOTE_EXIT_DUMP=$((Resolve-Path build/quote-exit-controls/helper.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compare the quoted Unicode clipboard and a separate physical Return with XTerm
        id: quote
        if: inputs.quote_only
        env: {RENDERER: "${{ matrix.renderer }}", NEMOTERM_PROTOCOL_WIRE_TRACE: "1"}
        run: python tests/paste_lines_window.py --quote
      - name: Check quoted paste and window exit without a pipe observer
        if: ${{ !cancelled() && inputs.quote_only && steps.quote.outcome != 'skipped' }}
        env: {RENDERER: "${{ matrix.renderer }}"}
        run: python tests/paste_lines_window.py --quote --exit-control
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.quote_only && 'paste-quote' || 'paste-lines' }}-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/paste-lines-*.json
            research/paste-quote-*.json
            research/paste-quote-*.jsonl
            research/quote-exit-diagnostics/
            build/quote-exit-controls/test.log
            build/paste-lines-product/SOURCE-HOST.json
            build/interaction-dependencies/environment.json
          if-no-files-found: error
