name: Allocation census bookkeeping

on:
  push:
    paths:
      - 'tests/allocation_census*'
      - 'tests/test_allocation_census.c'
      - 'tests/frida_test_utils.py'
      - 'tests/owned_job.py'
      - 'tests/working_set_regions.py'
      - 'tests/tab_workload_memory.py'
      - 'tests/tabs_window_smoke.py'
      - 'tests/virtual_memory*'
      - 'tests/etw_memory*'
      - '.github/workflows/allocation-census.yml'
  workflow_dispatch:
    inputs:
      observation:
        description: Native validation, frontend heap census, or scoped virtual-memory trace
        type: choice
        default: native
        options: [native, heap, virtual, etw, etw-decode, bitmap-reuse]

permissions:
  contents: read
  actions: read

jobs:
  bookkeeping:
    if: inputs.observation != 'etw-decode' && inputs.observation != 'bitmap-reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile and check allocation lifetime bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_allocation_census.c -o allocation-census-test
          ./allocation-census-test 2>&1 | tee allocation-census-test.log
      - name: Check private-page correlation accounting
        shell: bash
        run: |
          set -euo pipefail
          python tests/allocation_census_pages_test.py 2>&1 | tee allocation-census-pages.log
      - name: Retain diagnostic collector validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allocation-census-bookkeeping-${{ github.sha }}
          path: |
            allocation-census-test.log
            allocation-census-pages.log
          if-no-files-found: warn

  native-adapter:
    if: inputs.observation != 'etw-decode' && inputs.observation != 'bitmap-reuse'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned native observer
        run: python -m pip install frida==17.24.3
      - name: Observe controlled allocation and free lifetimes
        shell: pwsh
        run: |
          python tests/allocation_census_native_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/virtual_memory_native_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain native observer validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allocation-census-native-${{ github.sha }}
          path: |
            allocation-census-native.json
            virtual-memory-native.json
          if-no-files-found: warn

  frontend-workload:
    # Explicit diagnostics only. Normal test/build workflows retain their
    # uninstrumented 20,000,000-byte gate and do not recognize diagnostic exit 2.
    if: github.event_name == 'workflow_dispatch' && inputs.observation != 'native' && inputs.observation != 'etw-decode' && inputs.observation != 'bitmap-reuse'
    needs: [bookkeeping, native-adapter]
    strategy:
      fail-fast: false
      matrix:
        renderer: [gdi, directx]
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      NEMOTERM_REQUIRE_DIRECTX: '1'
      OBSERVATION: ${{ inputs.observation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the exact candidate that exceeded the DirectX limit
        shell: pwsh
        run: |
          gh run download 43431940613 --repo "$env:GITHUB_REPOSITORY" --name unverified-single-exe-x64-587965e5dfb97ad0290f311f14fc39edb9dff7d1 --dir build/allocation-candidate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $image = (Resolve-Path build/allocation-candidate/nemoterm.exe).Path
          $digest = (Get-FileHash -LiteralPath $image -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '5f4d3f0a20171fc84c59c0e9afd8023916da80dab984849b6f0afce3c16b04f3') { throw 'Candidate hash mismatch' }
          "NEMOTERM_TEST_EXE=$image" >> $env:GITHUB_ENV
          @{source_run=43431940613; source_commit='587965e5dfb97ad0290f311f14fc39edb9dff7d1'; executable_sha256=$digest; diagnostic_commit=$env:GITHUB_SHA; memory_acceptance=$false} | ConvertTo-Json | Set-Content research/allocation-census-candidate.json
      - name: Install pinned native observer
        run: python -m pip install frida==17.24.3
      - name: Capture the bounded two-tab workload
        shell: pwsh
        run: |
          if ($env:OBSERVATION -eq 'heap') {
            $observationArgument = '--allocation-census'
            $validator = 'tests/allocation_census_validate.py'
          } elseif ($env:OBSERVATION -eq 'virtual') {
            $observationArgument = '--virtual-memory-trace'
            $validator = 'tests/virtual_memory_validate.py'
          } elseif ($env:OBSERVATION -eq 'etw') {
            $observationArgument = '--etw-memory-trace'
            $validator = 'tests/etw_memory_validate.py'
          } else { throw 'Unknown observation mode' }
          $recording = $false
          try {
            if ($env:OBSERVATION -eq 'etw') {
              wpr.exe -start VirtualAllocation -filemode 2>&1 | Tee-Object etw-recorder.log
              if ($LASTEXITCODE) { throw 'Failed to start dedicated CI WPR recording' }
              $recording = $true
              $env:NEMOTERM_ETW_RECORDING = '1'
            }
            python tests/tabs_window_smoke.py --renderer ${{ matrix.renderer }} --side left --workload-memory $observationArgument 2>&1 | Tee-Object allocation-census-workload.log
            $workloadExit = $LASTEXITCODE
          } finally {
            if ($recording) {
              wpr.exe -stop virtual-allocation.etl 2>&1 | Tee-Object -Append etw-recorder.log
              if ($LASTEXITCODE) { throw 'Failed to save dedicated CI WPR recording' }
            }
          }
          if ($workloadExit -ne 2) { throw "Expected diagnostic exit 2; got $workloadExit" }
          python $validator --renderer ${{ matrix.renderer }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Decode virtual-allocation event metadata
        if: inputs.observation == 'etw'
        shell: pwsh
        run: |
          tracerpt.exe virtual-allocation.etl -of XML -o virtual-allocation.xml -summary virtual-allocation-summary.xml -y 2>&1 | Tee-Object etw-decoder.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain allocation diagnostic metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allocation-census-frontend-${{ inputs.observation }}-${{ matrix.renderer }}-${{ github.sha }}
          path: |
            allocation-census-workload.log
            research/allocation-census-candidate.json
            research/allocation-tabs-*
            research/virtual-tabs-*
            research/etw-tabs-*
            etw-*.log
            virtual-allocation.etl
            virtual-allocation.xml
            virtual-allocation-summary.xml
          if-no-files-found: warn

  decode-etw:
    if: github.event_name == 'workflow_dispatch' && inputs.observation == 'etw-decode'
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch and verify retained DirectX trace
        shell: pwsh
        run: |
          gh run download 43444144664 --repo "$env:GITHUB_REPOSITORY" --name allocation-census-frontend-etw-directx-0a87c61dba1d2b86cc574a70818d33d9f023a3f3 --dir source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $digest = (Get-FileHash source/virtual-allocation.etl -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '51e628a45914930947a520d26050c9f72b9be793f2b7bb03b35a2f64cff6975c') { throw 'ETL identity mismatch' }
      - name: Decode original event timestamps and extract owned PID metadata
        shell: pwsh
        run: |
          tracerpt.exe source/virtual-allocation.etl -rts -of XML -o virtual-allocation-raw.xml -y 2>&1 | Tee-Object etw-raw-decoder.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/etw_extract.py --input virtual-allocation-raw.xml --metadata source/research/etw-tabs-directx-left-census.json --output owned-virtual-events.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain filtered event metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-etw-events-${{ github.sha }}
          path: |
            owned-virtual-events.json
            etw-raw-decoder.log
          if-no-files-found: warn
          retention-days: 30

  bitmap-lifetime:
    if: github.event_name == 'workflow_dispatch' && inputs.observation == 'bitmap-reuse'
    strategy:
      fail-fast: false
      matrix:
        variant: [control, reuse]
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      NEMOTERM_REQUIRE_DIRECTX: '1'
      NEMOTERM_TEST_TRACEBACK_SECONDS: '60'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Fetch unchanged control image
        if: matrix.variant == 'control'
        shell: pwsh
        run: |
          gh run download 43431940613 --repo "$env:GITHUB_REPOSITORY" --name unverified-single-exe-x64-587965e5dfb97ad0290f311f14fc39edb9dff7d1 --dir build/single-exe-dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $digest = (Get-FileHash build/single-exe-dist/nemoterm.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '5f4d3f0a20171fc84c59c0e9afd8023916da80dab984849b6f0afce3c16b04f3') { throw 'Control image mismatch' }
      - name: Build candidate frontend and embedded host
        if: matrix.variant == 'reuse'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/build-single-exe.ps1 2>&1 | Tee-Object bitmap-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Set image identity and install test instrumentation
        shell: pwsh
        run: |
          $image = (Resolve-Path build/single-exe-dist/nemoterm.exe).Path
          "NEMOTERM_TEST_EXE=$image" >> $env:GITHUB_ENV
          @{variant='${{ matrix.variant }}'; workflow_commit=$env:GITHUB_SHA; executable_sha256=(Get-FileHash $image -Algorithm SHA256).Hash.ToLowerInvariant(); complete_product_acceptance=$false} | ConvertTo-Json | Set-Content bitmap-candidate.json
          python -m pip install frida==17.24.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify unchanged renderer pixels
        shell: pwsh
        run: |
          python tests/renderer_window_smoke.py 2>&1 | Tee-Object bitmap-renderer.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run normal two-tab workloads with the original memory limits
        shell: pwsh
        run: |
          foreach ($renderer in @('gdi', 'directx')) {
            python tests/tabs_window_smoke.py --renderer $renderer --side left --workload-memory 2>&1 | Tee-Object "bitmap-$renderer-workload.log"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Verify device failure and shared resource cleanup
        if: success() || failure()
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath build/single-exe-dist/nemoterm.exe)) { throw 'Missing candidate executable' }
          python tests/gpu_lifecycle_window_smoke.py 2>&1 | Tee-Object bitmap-gpu-lifecycle.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain experimental image and all observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bitmap-lifetime-${{ matrix.variant }}-${{ github.sha }}
          path: |
            bitmap-*.log
            bitmap-candidate.json
            build/single-exe-dist/nemoterm.exe
            research/renderer-observed.json
            research/renderer-*.png
            research/gpu-lifecycle-observed.json
            research/workload-tabs-*
            build/*failure.json
          retention-days: 30
          if-no-files-found: warn
