name: Allocation census bookkeeping

on:
  push:
    paths:
      - 'tests/allocation_census*'
      - 'tests/test_allocation_census.c'
      - 'tests/frida_test_utils.py'
      - 'tests/owned_job.py'
      - 'tests/working_set_regions.py'
      - 'tests/tab_workload_memory.py'
      - 'tests/tabs_window_smoke.py'
      - 'tests/virtual_memory*'
      - '.github/workflows/allocation-census.yml'
  workflow_dispatch:
    inputs:
      observation:
        description: Native validation, frontend heap census, or scoped virtual-memory trace
        type: choice
        default: native
        options: [native, heap, virtual]

permissions:
  contents: read
  actions: read

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile and check allocation lifetime bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_allocation_census.c -o allocation-census-test
          ./allocation-census-test 2>&1 | tee allocation-census-test.log
      - name: Check private-page correlation accounting
        shell: bash
        run: |
          set -euo pipefail
          python tests/allocation_census_pages_test.py 2>&1 | tee allocation-census-pages.log
      - name: Retain diagnostic collector validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allocation-census-bookkeeping-${{ github.sha }}
          path: |
            allocation-census-test.log
            allocation-census-pages.log
          if-no-files-found: warn

  native-adapter:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned native observer
        run: python -m pip install frida==17.24.3
      - name: Observe controlled allocation and free lifetimes
        shell: pwsh
        run: |
          python tests/allocation_census_native_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/virtual_memory_native_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain native observer validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allocation-census-native-${{ github.sha }}
          path: |
            allocation-census-native.json
            virtual-memory-native.json
          if-no-files-found: warn

  frontend-workload:
    # Explicit diagnostics only. Normal test/build workflows retain their
    # uninstrumented 20,000,000-byte gate and do not recognize diagnostic exit 2.
    if: github.event_name == 'workflow_dispatch' && inputs.observation != 'native'
    needs: [bookkeeping, native-adapter]
    strategy:
      fail-fast: false
      matrix:
        renderer: [gdi, directx]
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      NEMOTERM_REQUIRE_DIRECTX: '1'
      OBSERVATION: ${{ inputs.observation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the exact candidate that exceeded the DirectX limit
        shell: pwsh
        run: |
          gh run download 43431940613 --repo "$env:GITHUB_REPOSITORY" --name unverified-single-exe-x64-587965e5dfb97ad0290f311f14fc39edb9dff7d1 --dir build/allocation-candidate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $image = (Resolve-Path build/allocation-candidate/nemoterm.exe).Path
          $digest = (Get-FileHash -LiteralPath $image -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '5f4d3f0a20171fc84c59c0e9afd8023916da80dab984849b6f0afce3c16b04f3') { throw 'Candidate hash mismatch' }
          "NEMOTERM_TEST_EXE=$image" >> $env:GITHUB_ENV
          @{source_run=43431940613; source_commit='587965e5dfb97ad0290f311f14fc39edb9dff7d1'; executable_sha256=$digest; diagnostic_commit=$env:GITHUB_SHA; memory_acceptance=$false} | ConvertTo-Json | Set-Content research/allocation-census-candidate.json
      - name: Install pinned native observer
        run: python -m pip install frida==17.24.3
      - name: Capture the bounded two-tab workload
        shell: pwsh
        run: |
          if ($env:OBSERVATION -eq 'heap') {
            $observationArgument = '--allocation-census'
            $validator = 'tests/allocation_census_validate.py'
          } elseif ($env:OBSERVATION -eq 'virtual') {
            $observationArgument = '--virtual-memory-trace'
            $validator = 'tests/virtual_memory_validate.py'
          } else { throw 'Unknown observation mode' }
          python tests/tabs_window_smoke.py --renderer ${{ matrix.renderer }} --side left --workload-memory $observationArgument 2>&1 | Tee-Object allocation-census-workload.log
          if ($LASTEXITCODE -ne 2) { throw "Expected diagnostic exit 2; got $LASTEXITCODE" }
          python $validator --renderer ${{ matrix.renderer }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain allocation diagnostic metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allocation-census-frontend-${{ inputs.observation }}-${{ matrix.renderer }}-${{ github.sha }}
          path: |
            allocation-census-workload.log
            research/allocation-census-candidate.json
            research/allocation-tabs-*
            research/virtual-tabs-*
          if-no-files-found: warn
