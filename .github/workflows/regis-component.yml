name: Native ReGIS component
on:
  workflow_call:
permissions:
  contents: read
jobs:
  font-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Capture upstream platform font input independently of terminal images
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxft-dev xfonts-base xvfb xauth
          mkdir -p build/regis-font-inputs
          python3 scripts/generate-regis-font-probe.py --output build/regis-font-inputs/probe.c
          gcc -std=c11 -O1 -Wall -Wextra -Werror build/regis-font-inputs/probe.c $(pkg-config --cflags --libs xft x11 fontconfig) -o build/regis-font-inputs/probe 2>&1 | tee build/regis-font-inputs/build.log
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' build/regis-font-inputs/probe build/regis-font-inputs/glyphs.bin build/regis-font-inputs/fonts.log
          gcc -std=c11 -O1 -Wall -Wextra -Werror tests/regis_fixed_font_probe.c -lX11 -o build/regis-font-inputs/fixed-font-probe
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' build/regis-font-inputs/fixed-font-probe build/regis-font-inputs/fixed-font.bin | tee build/regis-font-inputs/fixed-font.log
          dpkg-query -W > build/regis-font-inputs/packages.txt
          git rev-parse HEAD > build/regis-font-inputs/fixture-commit.txt
          sed -n 's/^font-file: //p' build/regis-font-inputs/fonts.log | sort -u | while IFS= read -r file; do sha256sum "$file"; done > build/regis-font-inputs/font-files-sha256.txt
          cd build/regis-font-inputs
          sha256sum probe.c probe glyphs.bin fonts.log fixed-font-probe fixed-font.bin fixed-font.log > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regis-font-inputs-${{ github.sha }}
          path: build/regis-font-inputs/
          if-no-files-found: error
          retention-days: 30
  linux:
    needs: font-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: regis-font-inputs-${{ github.sha }}
          path: build/regis-font-inputs
      - run: cd build/regis-font-inputs && sha256sum --check SHA256SUMS
      - run: python3 -m pip install pillow==11.3.0
      - name: Verify the generated parser and compile with sanitizers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/regis-component
          python3 scripts/import-regis-parser.py
          git diff --exit-code -- vendor/putty-0.85/terminal/nemo_regis_parser.inc vendor/putty-0.85/terminal/nemo_regis_colour.inc
          ${{ matrix.compiler }} -std=c11 -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Ivendor/putty-0.85/terminal tests/test_regis.c vendor/putty-0.85/terminal/nemo_regis.c -lm -o build/regis-component/test-regis 2>&1 | tee build/regis-component/build.log
      - name: Check ownership, reentrant use and budgets
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: build/regis-component/test-regis --self-test 2>&1 | tee build/regis-component/ownership.log
      - name: Compare original XTerm replies and pixels
        if: ${{ !cancelled() }}
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tests/test_regis_reference.py --exe build/regis-component/test-regis --font-inputs build/regis-font-inputs/glyphs.bin --output build/regis-component/reference
      - name: Build the real terminal input and shared image owners
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cmake -S vendor/putty-0.85 -B build/regis-terminal -G Ninja -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DPUTTY_GTK_VERSION=NONE -DPUTTY_GSSAPI=OFF '-DCMAKE_C_FLAGS=-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined' 2>&1 | tee build/regis-component/terminal-configure.log
          cmake --build build/regis-terminal --target test_regis_terminal test_sixel_terminal test_cancellation_terminal --parallel 4 2>&1 | tee build/regis-component/terminal-build.log
          mkdir -p build/regis-component/terminal-binaries
          cp build/regis-terminal/test_regis_terminal build/regis-component/terminal-binaries/
          sha256sum build/regis-terminal/test_regis_terminal build/regis-terminal/test_sixel_terminal build/regis-terminal/test_cancellation_terminal > build/regis-component/terminal-binaries/SHA256SUMS
          git rev-parse HEAD > build/regis-component/terminal-binaries/fixture-commit.txt
      - name: Verify actual DCS framing, cancellation and shared image accounting
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -o pipefail
          build/regis-terminal/test_regis_terminal --self-test 2>&1 | tee build/regis-component/terminal-framing.log
          build/regis-terminal/test_sixel_terminal 2>&1 | tee build/regis-component/terminal-images.log
          build/regis-terminal/test_cancellation_terminal 2>&1 | tee build/regis-component/terminal-cancellation.log
      - name: Replay unchanged scene streams through terminal.c as whole writes
        if: ${{ !cancelled() }}
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tests/test_regis_reference.py --terminal --exe build/regis-terminal/test_regis_terminal --font-inputs build/regis-font-inputs/glyphs.bin --output build/regis-component/terminal-whole
      - name: Replay unchanged scene streams through terminal.c byte by byte
        if: ${{ !cancelled() }}
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tests/test_regis_reference.py --terminal --bytewise --exe build/regis-terminal/test_regis_terminal --font-inputs build/regis-font-inputs/glyphs.bin --output build/regis-component/terminal-bytewise
      - name: Compare retained image views and lifecycle with original XTerm scenes
        if: ${{ !cancelled() }}
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tests/test_regis_reference.py --terminal --views --grid-font build/regis-font-inputs/fixed-font.bin --exe build/regis-terminal/test_regis_terminal --font-inputs build/regis-font-inputs/glyphs.bin --output build/regis-component/views-whole
      - name: Compare retained image views under bytewise input
        if: ${{ !cancelled() }}
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tests/test_regis_reference.py --terminal --views --bytewise --grid-font build/regis-font-inputs/fixed-font.bin --exe build/regis-terminal/test_regis_terminal --font-inputs build/regis-font-inputs/glyphs.bin --output build/regis-component/views-bytewise
      - name: Compare both directions of shared palette updates after full repaint
        if: ${{ !cancelled() }}
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tests/test_regis_reference.py --terminal --views --shared-palette --exe build/regis-terminal/test_regis_terminal --output build/regis-component/shared-palette-whole
      - name: Compare shared palette updates with bytewise terminal input
        if: ${{ !cancelled() }}
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tests/test_regis_reference.py --terminal --views --shared-palette --bytewise --exe build/regis-terminal/test_regis_terminal --output build/regis-component/shared-palette-bytewise
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regis-component-${{ matrix.compiler }}-${{ github.sha }}
          path: build/regis-component/
          if-no-files-found: error
          retention-days: 30
  windows:
    needs: font-inputs
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: regis-font-inputs-${{ github.sha }}
          path: build/regis-font-inputs
      - run: python -m pip install pillow==11.3.0
      - name: Install the pinned Sarasa test face on the disposable runner
        run: scripts/prepare-remote-interaction.ps1
      - name: Build the same native decoder with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/regis-component | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cl /nologo /std:c17 /W4 /WX /Zi /Od /Ivendor/putty-0.85/terminal tests/test_regis.c vendor/putty-0.85/terminal/nemo_regis.c /Febuild/regis-component/test-regis.exe /Fobuild/regis-component/ 2>&1 | Tee-Object build/regis-component/build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /std:c17 /W4 /WX /Zi /Od /Ivendor/putty-0.85/terminal /Ivendor/putty-0.85/windows tests/test_regis_font_win.c vendor/putty-0.85/windows/nemo_regis_font.c vendor/putty-0.85/terminal/nemo_regis.c /Febuild/regis-component/test-regis-font.exe /Fobuild/regis-component/ /link gdi32.lib user32.lib 2>&1 | Tee-Object build/regis-component/font-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S vendor/putty-0.85 -B build/regis-terminal -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=MinSizeRel '-DCMAKE_C_FLAGS=/std:c11 /utf-8' '-DCMAKE_C_FLAGS_MINSIZEREL=/O1 /Ob1 /Gy /Gw' -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DPUTTY_GSSAPI=OFF 2>&1 | Tee-Object build/regis-component/terminal-configure.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/regis-terminal --target pterm test_regis_terminal test_sixel_terminal test_cancellation_terminal --parallel 4 2>&1 | Tee-Object build/regis-component/terminal-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/regis-component/terminal-binaries | Out-Null
          Copy-Item build/regis-terminal/test_regis_terminal.exe,build/regis-terminal/nemoterm.exe build/regis-component/terminal-binaries/
          Get-FileHash build/regis-terminal/test_regis_terminal.exe,build/regis-terminal/test_sixel_terminal.exe,build/regis-terminal/test_cancellation_terminal.exe,build/regis-terminal/nemoterm.exe -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content build/regis-component/terminal-binaries/hashes.json
          git rev-parse HEAD > build/regis-component/terminal-binaries/fixture-commit.txt
      - name: Check ownership, reentrant use and budgets
        run: build/regis-component/test-regis.exe --self-test 2>&1 | Tee-Object build/regis-component/ownership.log
      - name: Compare native Sarasa masks with offscreen TextOut and check GDI handle lifetime
        run: |
          Copy-Item build/interaction-dependencies/environment.json build/regis-component/font-environment.json
          build/regis-component/test-regis-font.exe 2>&1 | Tee-Object build/regis-component/native-font.log
          exit $LASTEXITCODE
      - name: Compare original XTerm replies and pixels
        if: ${{ !cancelled() }}
        run: python tests/test_regis_reference.py --exe build/regis-component/test-regis.exe --font-inputs build/regis-font-inputs/glyphs.bin --output build/regis-component/reference
      - name: Verify actual DCS framing, cancellation and shared image accounting
        if: ${{ !cancelled() }}
        run: |
          build/regis-terminal/test_regis_terminal.exe --self-test 2>&1 | Tee-Object build/regis-component/terminal-framing.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/regis-terminal/test_sixel_terminal.exe 2>&1 | Tee-Object build/regis-component/terminal-images.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/regis-terminal/test_cancellation_terminal.exe 2>&1 | Tee-Object build/regis-component/terminal-cancellation.log
          exit $LASTEXITCODE
      - name: Replay unchanged scene streams through terminal.c as whole writes
        if: ${{ !cancelled() }}
        run: python tests/test_regis_reference.py --terminal --exe build/regis-terminal/test_regis_terminal.exe --font-inputs build/regis-font-inputs/glyphs.bin --output build/regis-component/terminal-whole
      - name: Replay unchanged scene streams through terminal.c byte by byte
        if: ${{ !cancelled() }}
        run: python tests/test_regis_reference.py --terminal --bytewise --exe build/regis-terminal/test_regis_terminal.exe --font-inputs build/regis-font-inputs/glyphs.bin --output build/regis-component/terminal-bytewise
      - name: Compare retained image views and lifecycle with original XTerm scenes
        if: ${{ !cancelled() }}
        run: python tests/test_regis_reference.py --terminal --views --grid-font build/regis-font-inputs/fixed-font.bin --exe build/regis-terminal/test_regis_terminal.exe --font-inputs build/regis-font-inputs/glyphs.bin --output build/regis-component/views-whole
      - name: Compare retained image views under bytewise input
        if: ${{ !cancelled() }}
        run: python tests/test_regis_reference.py --terminal --views --bytewise --grid-font build/regis-font-inputs/fixed-font.bin --exe build/regis-terminal/test_regis_terminal.exe --font-inputs build/regis-font-inputs/glyphs.bin --output build/regis-component/views-bytewise
      - name: Compare both directions of shared palette updates after full repaint
        if: ${{ !cancelled() }}
        run: python tests/test_regis_reference.py --terminal --views --shared-palette --exe build/regis-terminal/test_regis_terminal.exe --output build/regis-component/shared-palette-whole
      - name: Compare shared palette updates with bytewise terminal input
        if: ${{ !cancelled() }}
        run: python tests/test_regis_reference.py --terminal --views --shared-palette --bytewise --exe build/regis-terminal/test_regis_terminal.exe --output build/regis-component/shared-palette-bytewise
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regis-component-msvc-${{ github.sha }}
          path: build/regis-component/
          if-no-files-found: error
          retention-days: 30
