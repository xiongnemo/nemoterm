name: Native ReGIS component
on:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m pip install pillow==11.3.0
      - name: Verify the generated parser and compile with sanitizers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/regis-component
          python3 scripts/import-regis-parser.py
          git diff --exit-code -- vendor/putty-0.85/terminal/nemo_regis_parser.inc vendor/putty-0.85/terminal/nemo_regis_colour.inc
          ${{ matrix.compiler }} -std=c11 -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Ivendor/putty-0.85/terminal tests/test_regis.c vendor/putty-0.85/terminal/nemo_regis.c -lm -o build/regis-component/test-regis 2>&1 | tee build/regis-component/build.log
      - name: Check ownership, reentrant use and budgets
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: build/regis-component/test-regis --self-test 2>&1 | tee build/regis-component/ownership.log
      - name: Compare original XTerm replies and pixels
        if: ${{ !cancelled() }}
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 tests/test_regis_reference.py --exe build/regis-component/test-regis --output build/regis-component/reference
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regis-component-${{ matrix.compiler }}-${{ github.sha }}
          path: build/regis-component/
          if-no-files-found: error
          retention-days: 30
  windows:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install pillow==11.3.0
      - name: Build the same native decoder with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/regis-component | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cl /nologo /std:c17 /W4 /WX /Zi /Od /Ivendor/putty-0.85/terminal tests/test_regis.c vendor/putty-0.85/terminal/nemo_regis.c /Febuild/regis-component/test-regis.exe /Fobuild/regis-component/ 2>&1 | Tee-Object build/regis-component/build.log
          exit $LASTEXITCODE
      - name: Check ownership, reentrant use and budgets
        run: build/regis-component/test-regis.exe --self-test 2>&1 | Tee-Object build/regis-component/ownership.log
      - name: Compare original XTerm replies and pixels
        if: ${{ !cancelled() }}
        run: python tests/test_regis_reference.py --exe build/regis-component/test-regis.exe --output build/regis-component/reference
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regis-component-msvc-${{ github.sha }}
          path: build/regis-component/
          if-no-files-found: error
          retention-days: 30
