name: Real Codex draft text order on the exact product
on:
  workflow_call:
    inputs:
      product_run: {required: true, type: string}
      product_commit: {required: true, type: string}
permissions: {contents: read, actions: read}
jobs:
  records:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: {renderer: [gdi, directx], phase: [first, after-turn]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch the exact single executable
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/picture-keys-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/picture-keys-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install and identify Sarasa Light
        run: scripts/prepare-remote-interaction.ps1
      - name: Install the exact real client
        run: |
          python -m pip install Pillow==13.0.0
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          npm ci --prefix tools/codex-fixture --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
      - name: Compare the unedited draft with the received prompt
        env:
          RENDERER: ${{ matrix.renderer }}
          PHASE: ${{ matrix.phase }}
        run: |
          $clients=@(Get-ChildItem tools/codex-fixture/node_modules -Recurse -Filter codex.exe)
          if ($clients.Count -ne 1) {throw 'Expected one pinned native Codex client'}
          python tests/codex_draft_product.py --codex $clients[0].FullName --renderer $env:RENDERER --phase $env:PHASE
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: codex-draft-product-${{ matrix.renderer }}-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/codex-draft-product/summary.json
            build/codex-draft-product/trial-*/*.json
            build/codex-draft-product/trial-*/*.vt
            build/codex-draft-product/trial-*/before-submit.png
            build/codex-draft-product/trial-*/client-output.log
            build/picture-keys-product/SOURCE-HOST.json
          if-no-files-found: error
