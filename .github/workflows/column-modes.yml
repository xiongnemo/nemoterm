name: Native 80 and 132 column changes
on:
  workflow_call:
    inputs:
      source_commit: {required: true, type: string}
      source_run: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix: {renderer: [gdi, directx]}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: prepare
        name: Fetch the source-built frontend and select the pinned Sarasa face
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.source_run }}
          PRODUCT_COMMIT: ${{ inputs.source_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/column-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/column-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          scripts/prepare-remote-interaction.ps1
      - name: Prepare a real desktop large enough for 160 by 48 Sarasa cells
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cl /nologo /W4 /WX /EHsc /std:c++17 tests/dpi_display_probe.cpp /Febuild/interaction-dependencies/dpi-display.exe /Fobuild/interaction-dependencies/dpi-display.obj user32.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/prepare-full-grid-display.ps1
      - name: Compare upstream replies, Windows window dimensions and GDI text pixels
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/column_modes_window.py
      - name: Verify both startup switches override the saved profile
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/column_modes_window.py --cli
      - name: Shift-select wide text before requested, ignored and clearing switches
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/column_mode_selection.py
      - name: Compare native console readback with visible text and cursor after column switches
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/column_mode_native_readback.py
      - name: Preserve or discard the selected glyphs according to actual page-size changes
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/page_size_selection.py
      - name: Read the native row and cursor after restoring private column modes
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/column_mode_native_readback.py --saved
      - name: Apply and revoke the resize permission on just one of two live tabs
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/column_mode_native_tabs.py
      - name: Restore the runner display and retain its measured geometry
        if: always()
        shell: pwsh
        run: ./scripts/prepare-full-grid-display.ps1 -Restore
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: column-modes-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/column-mode-*
            build/column-product/SOURCE-HOST.json
            build/interaction-dependencies/environment.json
            build/interaction-dependencies/full-grid-display.json
          if-no-files-found: error
