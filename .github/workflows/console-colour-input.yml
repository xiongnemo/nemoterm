name: Native console colour query latency
on:
  workflow_call:
    inputs:
      product_run: {required: true, type: string}
      product_commit: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  records:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch the exact single executable
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/colour-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/colour-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install and identify Sarasa Light
        run: scripts/prepare-remote-interaction.ps1
      - name: Measure native key records and the two query deadlines under both renderers
        run: python tests/console_colour_roundtrip.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: console-colour-input-${{ github.sha }}
          path: |
            build/focused-evidence/colour-input
            build/interaction-dependencies/environment.json
            build/colour-product/SOURCE-HOST.json
          if-no-files-found: error
