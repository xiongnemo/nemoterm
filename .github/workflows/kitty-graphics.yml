name: Kitty graphics components

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/kitty-graphics.yml
      - vendor/putty-0.85/terminal/nemo_kitty*
      - vendor/putty-0.85/terminal/nemo_zlib.*
      - vendor/putty-0.85/terminal/puff/**
      - tests/test_zlib.c
      - tests/zlib_reference.h
      - vendor/putty-0.85/test/kitty_compression_reference.h
      - scripts/generate-kitty-compression-reference.py
      - research/kitty-compression-evidence/**
      - tests/test_kitty_transport.c
      - tests/test_kitty_cache.c
      - tests/test_kitty_layout.c
      - tests/kitty_layout_reference.h
      - scripts/generate-kitty-layout-reference.py
      - tests/test_kitty_placements.c
      - tests/kitty_placement_reference.h
      - scripts/generate-kitty-placement-reference.py
      - scripts/generate-kitty-terminal-reference.py
      - scripts/generate-kitty-feature-reference.py
      - scripts/generate-kitty-query-error-reference.py
      - tests/kitty_query_error_reference.json
      - vendor/putty-0.85/test/kitty_query_error_reference.h
      - research/kitty-query-errors-evidence/**
      - vendor/putty-0.85/test/kitty_feature_reference.h
      - tests/kitty_feature_reference.json
      - research/kitty-feature-query-evidence/**
      - vendor/putty-0.85/test/test_kitty_terminal.inc
      - vendor/putty-0.85/test/kitty_terminal_reference.h
      - vendor/putty-0.85/terminal/terminal.c
      - vendor/putty-0.85/terminal/terminal.h
      - vendor/putty-0.85/putty.h
      - vendor/putty-0.85/terminal/nemo_raster.*
  pull_request:
    paths:
      - .github/workflows/kitty-graphics.yml
      - vendor/putty-0.85/terminal/nemo_kitty*
      - vendor/putty-0.85/terminal/nemo_zlib.*
      - vendor/putty-0.85/terminal/puff/**
      - tests/test_zlib.c
      - tests/zlib_reference.h
      - vendor/putty-0.85/test/kitty_compression_reference.h
      - scripts/generate-kitty-compression-reference.py
      - research/kitty-compression-evidence/**
      - tests/test_kitty_transport.c
      - tests/test_kitty_cache.c
      - tests/test_kitty_layout.c
      - tests/kitty_layout_reference.h
      - scripts/generate-kitty-layout-reference.py
      - tests/test_kitty_placements.c
      - tests/kitty_placement_reference.h
      - scripts/generate-kitty-placement-reference.py
      - scripts/generate-kitty-terminal-reference.py
      - scripts/generate-kitty-feature-reference.py
      - scripts/generate-kitty-query-error-reference.py
      - tests/kitty_query_error_reference.json
      - vendor/putty-0.85/test/kitty_query_error_reference.h
      - research/kitty-query-errors-evidence/**
      - vendor/putty-0.85/test/kitty_feature_reference.h
      - tests/kitty_feature_reference.json
      - research/kitty-feature-query-evidence/**
      - vendor/putty-0.85/test/test_kitty_terminal.inc
      - vendor/putty-0.85/test/kitty_terminal_reference.h
      - vendor/putty-0.85/terminal/terminal.c
      - vendor/putty-0.85/terminal/terminal.h
      - vendor/putty-0.85/putty.h
      - vendor/putty-0.85/terminal/nemo_raster.*

permissions:
  contents: read

jobs:
  unix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and execute strict and sanitized transport checks
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -o pipefail
          "$CC" --version | tee compiler.txt
          python3 scripts/generate-kitty-compression-reference.py --check
          "$CC" -std=c99 -Wall -Wextra -Werror -pedantic -O2 -I vendor/putty-0.85/terminal tests/test_zlib.c vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c -o zlib-test
          ./zlib-test 2>&1 | tee zlib-normal.log
          "$CC" -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -I vendor/putty-0.85/terminal tests/test_zlib.c vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c -o zlib-sanitizers
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./zlib-sanitizers 2>&1 | tee zlib-sanitizers.log
          python3 scripts/generate-kitty-layout-reference.py --check
          python3 scripts/generate-kitty-placement-reference.py --check
          "$CC" -std=c99 -Wall -Wextra -Werror -pedantic -O2 \
            -I vendor/putty-0.85/terminal tests/test_kitty_transport.c \
            vendor/putty-0.85/terminal/nemo_kitty.c -o kitty-transport
          ./kitty-transport 2>&1 | tee normal.log
          "$CC" -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_kitty_transport.c \
            vendor/putty-0.85/terminal/nemo_kitty.c -o kitty-transport-asan
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./kitty-transport-asan 2>&1 | tee sanitizers.log
          "$CC" -std=c99 -Wall -Wextra -Werror -pedantic -O2 \
            -I vendor/putty-0.85/terminal tests/test_kitty_cache.c \
            vendor/putty-0.85/terminal/nemo_kitty_cache.c \
            vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c \
            vendor/putty-0.85/terminal/nemo_kitty.c \
            vendor/putty-0.85/terminal/nemo_raster.c -o kitty-cache
          ./kitty-cache 2>&1 | tee cache-normal.log
          "$CC" -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_kitty_cache.c \
            vendor/putty-0.85/terminal/nemo_kitty_cache.c \
            vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c \
            vendor/putty-0.85/terminal/nemo_kitty.c \
            vendor/putty-0.85/terminal/nemo_raster.c -o kitty-cache-asan
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./kitty-cache-asan 2>&1 | tee cache-sanitizers.log
          "$CC" -std=c99 -Wall -Wextra -Werror -pedantic -O2 \
            -I vendor/putty-0.85/terminal tests/test_kitty_layout.c \
            vendor/putty-0.85/terminal/nemo_kitty_layout.c \
            vendor/putty-0.85/terminal/nemo_kitty.c -o kitty-layout
          ./kitty-layout 2>&1 | tee layout-normal.log
          "$CC" -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_kitty_layout.c \
            vendor/putty-0.85/terminal/nemo_kitty_layout.c \
            vendor/putty-0.85/terminal/nemo_kitty.c -o kitty-layout-asan
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./kitty-layout-asan 2>&1 | tee layout-sanitizers.log
          "$CC" -std=c99 -Wall -Wextra -Werror -pedantic -O2 -DNDEBUG \
            -I vendor/putty-0.85/terminal tests/test_kitty_placements.c \
            vendor/putty-0.85/terminal/nemo_kitty_placements.c \
            vendor/putty-0.85/terminal/nemo_kitty_layout.c \
            vendor/putty-0.85/terminal/nemo_kitty_cache.c \
            vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c \
            vendor/putty-0.85/terminal/nemo_kitty.c \
            vendor/putty-0.85/terminal/nemo_raster.c -o kitty-placements-normal
          ./kitty-placements-normal 2>&1 | tee placements-normal.log
          "$CC" -std=c99 -Wall -Wextra -Werror -pedantic -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/putty-0.85/terminal tests/test_kitty_placements.c \
            vendor/putty-0.85/terminal/nemo_kitty_placements.c \
            vendor/putty-0.85/terminal/nemo_kitty_layout.c \
            vendor/putty-0.85/terminal/nemo_kitty_cache.c \
            vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c \
            vendor/putty-0.85/terminal/nemo_kitty.c \
            vendor/putty-0.85/terminal/nemo_raster.c -o kitty-placements-sanitizers
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./kitty-placements-sanitizers 2>&1 | tee placements-sanitizers.log
          python3 scripts/generate-kitty-terminal-reference.py --check
          python3 scripts/generate-kitty-feature-reference.py --check
          python3 scripts/generate-kitty-query-error-reference.py --check
          python3 scripts/generate-kitty-compression-reference.py --check
          cmake -S vendor/putty-0.85 -B build-terminal -G Ninja \
            -DCMAKE_C_COMPILER="$CC" -DPUTTY_GTK_VERSION=NONE -DPUTTY_GSSAPI=OFF \
            '-DCMAKE_C_FLAGS=-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined' 2>&1 | tee terminal-configure.log
          cmake --build build-terminal --target test_sixel_terminal --parallel 4 2>&1 | tee terminal-build.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-terminal/test_sixel_terminal 2>&1 | tee terminal-sanitizers.log
          sha256sum vendor/putty-0.85/terminal/terminal.[ch] vendor/putty-0.85/putty.h vendor/putty-0.85/test/test_kitty_terminal.inc vendor/putty-0.85/test/kitty_terminal_reference.h scripts/generate-kitty-terminal-reference.py > terminal-sources.sha256
          sha256sum vendor/putty-0.85/terminal/nemo_kitty* vendor/putty-0.85/terminal/nemo_raster.* tests/test_kitty_*.c tests/kitty_layout_reference.h scripts/generate-kitty-layout-reference.py tests/kitty_placement_reference.h scripts/generate-kitty-placement-reference.py vendor/putty-0.85/terminal/nemo_zlib.* vendor/putty-0.85/terminal/puff/* tests/test_zlib.c tests/zlib_reference.h vendor/putty-0.85/test/kitty_compression_reference.h scripts/generate-kitty-compression-reference.py > sources.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kitty-transport-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            compiler.txt
            normal.log
            sanitizers.log
            cache-normal.log
            cache-sanitizers.log
            layout-normal.log
            layout-sanitizers.log
            placements-normal.log
            placements-sanitizers.log
            zlib-*.log
            sources.sha256
            terminal-sources.sha256
            terminal-configure.log
            terminal-build.log
            terminal-sanitizers.log
          retention-days: 14
  msvc:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and execute Windows transport checks
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python scripts/generate-kitty-compression-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /std:c11 /utf-8 /W4 /WX /O2 /D_CRT_SECURE_NO_WARNINGS /Ivendor/putty-0.85/terminal tests/test_zlib.c vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c /Fe:zlib-test.exe 2>&1 | Tee-Object zlib-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./zlib-test.exe 2>&1 | Tee-Object zlib-test.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-layout-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /std:c11 /utf-8 /W4 /WX /O2 /D_CRT_SECURE_NO_WARNINGS /Ivendor/putty-0.85/terminal tests/test_kitty_transport.c vendor/putty-0.85/terminal/nemo_kitty.c /Fe:kitty-transport.exe 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./kitty-transport.exe 2>&1 | Tee-Object test.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /std:c11 /utf-8 /W4 /WX /O2 /D_CRT_SECURE_NO_WARNINGS /Ivendor/putty-0.85/terminal tests/test_kitty_cache.c vendor/putty-0.85/terminal/nemo_kitty_cache.c vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c vendor/putty-0.85/terminal/nemo_kitty.c vendor/putty-0.85/terminal/nemo_raster.c /Fe:kitty-cache.exe 2>&1 | Tee-Object cache-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./kitty-cache.exe 2>&1 | Tee-Object cache-test.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /std:c11 /utf-8 /W4 /WX /O2 /D_CRT_SECURE_NO_WARNINGS /Ivendor/putty-0.85/terminal tests/test_kitty_layout.c vendor/putty-0.85/terminal/nemo_kitty_layout.c vendor/putty-0.85/terminal/nemo_kitty.c /Fe:kitty-layout.exe 2>&1 | Tee-Object layout-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./kitty-layout.exe 2>&1 | Tee-Object layout-test.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-placement-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /std:c11 /utf-8 /W4 /WX /O2 /DNDEBUG /D_CRT_SECURE_NO_WARNINGS /Ivendor/putty-0.85/terminal tests/test_kitty_placements.c vendor/putty-0.85/terminal/nemo_kitty_placements.c vendor/putty-0.85/terminal/nemo_kitty_layout.c vendor/putty-0.85/terminal/nemo_kitty_cache.c vendor/putty-0.85/terminal/nemo_zlib.c vendor/putty-0.85/terminal/puff/puff.c vendor/putty-0.85/terminal/nemo_kitty.c vendor/putty-0.85/terminal/nemo_raster.c /Fe:kitty-placements.exe 2>&1 | Tee-Object placements-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./kitty-placements.exe 2>&1 | Tee-Object placements-test.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-compression-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-terminal-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-feature-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-kitty-query-error-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S vendor/putty-0.85 -B build-terminal -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_BUILD_TYPE=MinSizeRel '-DCMAKE_C_FLAGS=/std:c11 /utf-8' '-DCMAKE_C_FLAGS_MINSIZEREL=/O1 /Ob1' -DPUTTY_GSSAPI=OFF 2>&1 | Tee-Object terminal-configure.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-terminal --target test_sixel_terminal --parallel 4 2>&1 | Tee-Object terminal-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build-terminal/test_sixel_terminal.exe 2>&1 | Tee-Object terminal-test.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash vendor/putty-0.85/terminal/terminal.c, vendor/putty-0.85/terminal/terminal.h, vendor/putty-0.85/putty.h, vendor/putty-0.85/test/test_kitty_terminal.inc, vendor/putty-0.85/test/kitty_terminal_reference.h, scripts/generate-kitty-terminal-reference.py -Algorithm SHA256 | Format-List | Out-File terminal-sources.txt
          Get-FileHash vendor/putty-0.85/terminal/nemo_kitty*, vendor/putty-0.85/terminal/nemo_raster.*, tests/test_kitty_*.c, tests/kitty_layout_reference.h, scripts/generate-kitty-layout-reference.py, tests/kitty_placement_reference.h, scripts/generate-kitty-placement-reference.py, vendor/putty-0.85/terminal/nemo_zlib.*, vendor/putty-0.85/terminal/puff/*, tests/test_zlib.c, tests/zlib_reference.h, vendor/putty-0.85/test/kitty_compression_reference.h, scripts/generate-kitty-compression-reference.py -Algorithm SHA256 | Format-List | Out-File sources.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kitty-transport-msvc-${{ github.sha }}
          path: |
            build.log
            test.log
            cache-build.log
            cache-test.log
            layout-build.log
            layout-test.log
            placements-build.log
            placements-test.log
            zlib-*.log
            sources.txt
            terminal-sources.txt
            terminal-configure.log
            terminal-build.log
            terminal-test.log
          retention-days: 14
