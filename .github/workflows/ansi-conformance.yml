name: Terminal conformance replay

on:
  workflow_dispatch:
    inputs:
      bell_state:
        description: Reuse a verified native image to check tab and window-state bell lifetime
        type: boolean
        default: false
      image_run:
        description: Completed bell-native run for the window-state fixture
        type: string
        default: '43721733820'
      image_allow_failed:
        description: Explicit diagnostic-only reuse of a completed failed native run
        type: boolean
        default: false
      bell_native:
        description: Observe native bell attention, focus and stacking on a disposable desktop
        type: boolean
        default: false
      udk_native:
        description: Build the single image and replay UDK with physical keys on a disposable desktop
        type: boolean
        default: false
      locator_native:
        description: Build the source single image and check Locator on a disposable desktop
        type: boolean
        default: false
  workflow_call:
  push:
    paths:
      - vendor/putty-0.85/test/test_feature_policy.c
      - vendor/putty-0.85/terminal/nemo_feature_policy.c
      - vendor/putty-0.85/terminal/nemo_feature_policy.h
      - vendor/putty-0.85/terminal/nemo_feature_policy_terminal.inc
      - tests/feature_policy_reference.h
      - scripts/generate-feature-policy-reference.py
      - research/feature-policy-reference.tar.gz
      - vendor/putty-0.85/test/test_bell_modes.c
      - tests/bell_modes_reference.h
      - scripts/generate-bell-reference.py
      - research/bell-modes-reference.tar.gz
      - vendor/putty-0.85/conf.h
      - vendor/putty-0.85/windows/config.c
      - vendor/putty-0.85/test/test_udk_terminal.c
      - vendor/putty-0.85/terminal/nemo_udk_terminal.inc
      - tests/udk_reference.h
      - scripts/generate-udk-reference.py
      - research/dec-udk-reference.tar.gz
      - vendor/putty-0.85/test/test_locator_terminal.c
      - vendor/putty-0.85/terminal/nemo_locator_terminal.inc
      - vendor/putty-0.85/putty.h
      - vendor/putty-0.85/windows/window.c
      - tests/locator_reference.h
      - scripts/generate-locator-reference.py
      - research/dec-locator-binding-reference.tar.gz
      - .github/workflows/ansi-conformance.yml
      - scripts/generate-ansi-reference.py
      - tests/ansi_conformance_reference.h
      - vendor/putty-0.85/test/test_cancellation_terminal.c
      - tests/control_cancellation_reference.h
      - scripts/generate-cancellation-reference.py
      - research/control-cancellation-reference.tar.gz
      - vendor/putty-0.85/test/test_ansi_terminal.c
      - vendor/putty-0.85/terminal/terminal.c
      - vendor/putty-0.85/terminal/terminal.h
      - vendor/putty-0.85/unix/CMakeLists.txt
      - vendor/putty-0.85/windows/CMakeLists.txt

permissions:
  contents: read

jobs:
  linux:
    if: inputs.locator_native != true && inputs.udk_native != true && inputs.bell_native != true && inputs.bell_state != true
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify independent reference projection
        run: |
          python3 scripts/generate-feature-policy-reference.py --check
          python3 scripts/generate-bell-reference.py --check
          python3 scripts/generate-udk-reference.py --check
          python3 tests/generate_dec_status_oracle.py --check
          python3 scripts/generate-locator-reference.py --check
          python3 scripts/generate-ansi-reference.py --check
          python3 scripts/generate-cancellation-reference.py --check
      - name: Build terminal replay with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          "$CC" --version > compiler.txt
          sha256sum vendor/putty-0.85/test/test_feature_policy.c vendor/putty-0.85/terminal/nemo_feature_policy.c vendor/putty-0.85/terminal/nemo_feature_policy.h vendor/putty-0.85/terminal/nemo_feature_policy_terminal.inc tests/feature_policy_reference.h vendor/putty-0.85/test/test_bell_modes.c tests/bell_modes_reference.h vendor/putty-0.85/conf.h vendor/putty-0.85/windows/config.c vendor/putty-0.85/terminal/nemo_udk_terminal.inc vendor/putty-0.85/test/test_udk_terminal.c tests/udk_reference.h vendor/putty-0.85/conf-enums.h vendor/putty-0.85/config.c vendor/putty-0.85/terminal/nemo_locator_terminal.inc vendor/putty-0.85/putty.h vendor/putty-0.85/windows/window.c vendor/putty-0.85/test/test_locator_terminal.c tests/locator_reference.h vendor/putty-0.85/terminal/terminal.{c,h} vendor/putty-0.85/test/test_ansi_terminal.c tests/ansi_conformance_reference.h vendor/putty-0.85/terminal/nemo_kitty_terminal.inc vendor/putty-0.85/test/test_cancellation_terminal.c tests/control_cancellation_reference.h > sources.sha256
          cmake -S vendor/putty-0.85 -B ansi-build -G Ninja \
            -DPUTTY_GTK_VERSION=NONE -DPUTTY_GSSAPI=OFF \
            '-DCMAKE_C_FLAGS=-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined' 2>&1 | tee configure.log
          cmake --build ansi-build --target test_feature_policy test_bell_modes test_udk_terminal test_locator_terminal test_cancellation_terminal test_selective_erase test_sgr test_tcap test_sixel_terminal test_osc52 test_ansi_terminal test_queries test_state_control test_keyboard test_pointer_terminal --parallel 4 2>&1 | tee build.log
      - name: Replay reference and terminal regressions
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for test in test_feature_policy test_bell_modes test_udk_terminal test_locator_terminal test_cancellation_terminal test_selective_erase test_sgr test_tcap test_sixel_terminal test_osc52 test_ansi_terminal test_queries test_state_control test_keyboard test_pointer_terminal; do
            ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./ansi-build/$test 2>&1 | tee "$test.log" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ansi-conformance-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            *.log
            compiler.txt
            sources.sha256
          retention-days: 30
          if-no-files-found: error
  msvc:
    if: inputs.locator_native != true && inputs.udk_native != true && inputs.bell_native != true && inputs.bell_state != true
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify independent reference projection
        run: |
          python scripts/generate-feature-policy-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-bell-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-udk-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/generate_dec_status_oracle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-locator-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-ansi-reference.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/generate-cancellation-reference.py --check
          exit $LASTEXITCODE
      - name: Build terminal replay with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-FileHash vendor/putty-0.85/test/test_feature_policy.c,vendor/putty-0.85/terminal/nemo_feature_policy.c,vendor/putty-0.85/terminal/nemo_feature_policy.h,vendor/putty-0.85/terminal/nemo_feature_policy_terminal.inc,tests/feature_policy_reference.h,vendor/putty-0.85/test/test_bell_modes.c,tests/bell_modes_reference.h,vendor/putty-0.85/conf.h,vendor/putty-0.85/windows/config.c,vendor/putty-0.85/terminal/nemo_udk_terminal.inc,vendor/putty-0.85/test/test_udk_terminal.c,tests/udk_reference.h,vendor/putty-0.85/conf-enums.h,vendor/putty-0.85/config.c,vendor/putty-0.85/terminal/nemo_locator_terminal.inc,vendor/putty-0.85/putty.h,vendor/putty-0.85/windows/window.c,vendor/putty-0.85/test/test_locator_terminal.c,tests/locator_reference.h,vendor/putty-0.85/terminal/terminal.c,vendor/putty-0.85/terminal/terminal.h,vendor/putty-0.85/test/test_ansi_terminal.c,tests/ansi_conformance_reference.h,vendor/putty-0.85/terminal/nemo_kitty_terminal.inc,vendor/putty-0.85/test/test_cancellation_terminal.c,tests/control_cancellation_reference.h -Algorithm SHA256 | ConvertTo-Json | Set-Content sources.json
          cmake -S vendor/putty-0.85 -B ansi-build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=MinSizeRel '-DCMAKE_C_FLAGS=/std:c11 /utf-8' '-DCMAKE_C_FLAGS_MINSIZEREL=/O1 /Ob1 /Gy /Gw' -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DPUTTY_GSSAPI=OFF 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build ansi-build --target test_feature_policy test_bell_modes test_udk_terminal test_locator_terminal test_cancellation_terminal test_selective_erase test_sgr test_tcap test_sixel_terminal test_osc52 test_ansi_terminal test_queries test_terminal test_modes test_state_control test_keyboard test_pointer_terminal --parallel 4 2>&1 | Tee-Object build.log
          exit $LASTEXITCODE
      - name: Replay reference and terminal regressions
        shell: pwsh
        run: |
          $failed = 0
          foreach ($test in @('test_feature_policy','test_bell_modes','test_udk_terminal','test_locator_terminal','test_cancellation_terminal','test_selective_erase','test_sgr','test_tcap','test_sixel_terminal','test_osc52','test_ansi_terminal','test_queries','test_terminal','test_modes','test_state_control','test_keyboard','test_pointer_terminal')) {
            & "./ansi-build/$test.exe" 2>&1 | Tee-Object "$test.log"
            if ($LASTEXITCODE) { $failed = 1 }
          }
          exit $failed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ansi-conformance-msvc-${{ github.sha }}
          path: |
            *.log
            sources.json
          retention-days: 30
          if-no-files-found: error

  locator-native:
    if: inputs.locator_native == true
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - name: Build the frontend and console host in one image
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/build-single-exe.ps1 2>&1 | Tee-Object locator-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/single-exe-dist/nemoterm.exe dist/nemoterm.exe
          Get-FileHash dist/nemoterm.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content locator-image.json
      - name: Exercise real Locator input and existing mouse protocols
        shell: pwsh
        run: |
          $env:NEMOTERM_TEST_EXE = (Resolve-Path dist/nemoterm.exe).Path
          $failed = 0
          foreach ($test in @('locator', 'dec_status', 'mouse', 'state_control', 'highlight')) {
            python "tests/${test}_window_smoke.py" 2>&1 | Tee-Object "locator-$test.log"
            if ($LASTEXITCODE) { $failed = 1 }
          }
          exit $failed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: locator-native-${{ github.sha }}
          path: |
            locator-*.log
            locator-image.json
            build/single-exe-dist/nemoterm.exe
            research/locator-window-observed.json
            research/dec-status-observed.json
            research/dec-status-window.png
            research/mouse-*.json
            research/state-control-*.json
            research/state-control-*.png
            research/highlight-*.json
            research/highlight-*.png
          if-no-files-found: error
          retention-days: 60

  udk-native:
    if: inputs.udk_native == true
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - name: Build the frontend and console host in one image
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/build-single-exe.ps1 2>&1 | Tee-Object udk-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/single-exe-dist/nemoterm.exe dist/nemoterm.exe
          Get-FileHash dist/nemoterm.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content udk-image.json
      - name: Exercise physical UDK input and existing keyboard protocols
        shell: pwsh
        run: |
          $env:NEMOTERM_TEST_EXE = (Resolve-Path dist/nemoterm.exe).Path
          $failed = 0
          foreach ($test in @('udk', 'dec_status', 'keyboard', 'mok', 'win32_input')) {
            python "tests/${test}_window_smoke.py" 2>&1 | Tee-Object "udk-$test.log"
            if ($LASTEXITCODE) { $failed = 1 }
          }
          exit $failed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: udk-native-${{ github.sha }}
          path: |
            udk-*.log
            udk-image.json
            build/single-exe-dist/nemoterm.exe
            research/udk-window-observed.json
            research/dec-status-observed.json
            research/dec-status-window.png
            research/keyboard-*.json
            research/keyboard-*.png
            research/mok-*.json
            research/mok-*.png
            research/win32-input-*.json
            research/win32-input-*.png
          if-no-files-found: error
          retention-days: 60

  bell-native:
    if: inputs.bell_native == true
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - name: Build the frontend and console host in one image
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/build-single-exe.ps1 2>&1 | Tee-Object bell-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/single-exe-dist/nemoterm.exe dist/nemoterm.exe
          Get-FileHash dist/nemoterm.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content bell-image.json
      - run: python -m pip install frida==17.24.3
      - name: Observe native bell attention and existing bell/visual policy
        shell: pwsh
        run: |
          $env:NEMOTERM_TEST_EXE = (Resolve-Path dist/nemoterm.exe).Path
          $failed = 0
          foreach ($test in @('bell_modes', 'bell', 'bell_visual')) {
            python "tests/${test}_window_smoke.py" 2>&1 | Tee-Object "bell-$test.log"
            if ($LASTEXITCODE) { $failed = 1 }
          }
          python tests/bell_window_state_smoke.py 2>&1 | Tee-Object bell-window-state.log
          if ($LASTEXITCODE) { $failed = 1 }
          exit $failed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bell-native-${{ github.sha }}
          path: |
            bell-*.log
            bell-image.json
            build/single-exe-dist/nemoterm.exe
            research/bell-*.json
            research/bell-*.png
            research/visual-bell-*.json
            research/visual-bell-*.png
          if-no-files-found: error
          retention-days: 60

  bell-window-state:
    if: inputs.bell_state == true
    permissions:
      contents: read
      actions: read
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and download the explicitly identified native image
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_RUN: ${{ inputs.image_run }}
          ALLOW_FAILED_IMAGE: ${{ inputs.image_allow_failed }}
        run: |
          if ($env:IMAGE_RUN -notmatch '^\d+$') { throw 'Expected a workflow run number' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:IMAGE_RUN" | ConvertFrom-Json
          $diagnosticFailed = $env:ALLOW_FAILED_IMAGE -eq 'true' -and $run.conclusion -eq 'failure'
          if ($LASTEXITCODE -or $run.status -ne 'completed' -or ($run.conclusion -ne 'success' -and !$diagnosticFailed)) { throw 'Baseline must be completed; a failed run requires explicit diagnostic-only selection' }
          $name = "bell-native-$($run.head_sha)"
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:IMAGE_RUN/artifacts" | ConvertFrom-Json
          $artifact = @($artifacts.artifacts | Where-Object { $_.name -eq $name -and !$_.expired })
          if ($LASTEXITCODE -or $artifact.Count -ne 1) { throw 'Expected exactly one unexpired native image artifact' }
          gh run download $env:IMAGE_RUN --repo $env:GITHUB_REPOSITORY --name $name --dir build/bell-baseline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath build/bell-baseline/build/single-exe-dist/nemoterm.exe -Destination dist/nemoterm.exe
          $hash = (Get-FileHash dist/nemoterm.exe -Algorithm SHA256).Hash
          $original = Get-Content build/bell-baseline/bell-image.json -Raw | ConvertFrom-Json
          if ($hash -ne $original.Hash) { throw 'Downloaded image hash differs from its native checkpoint' }
          @{ fixture_source=$env:GITHUB_SHA; image_source=$run.head_sha; image_run=$run.id; image_conclusion=$run.conclusion; diagnostic_failed_baseline=$diagnosticFailed; artifact_id=$artifact[0].id; image_sha256=$hash } | ConvertTo-Json | Set-Content bell-state-provenance.json
      - run: python -m pip install frida==17.24.3
      - name: Check focus, stacking, minimized and background-tab lifetime
        shell: pwsh
        run: |
          $env:NEMOTERM_TEST_EXE = (Resolve-Path dist/nemoterm.exe).Path
          python tests/bell_window_state_smoke.py 2>&1 | Tee-Object bell-window-state.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bell-window-state-${{ github.sha }}
          path: |
            bell-state-provenance.json
            bell-window-state.log
            research/bell-window-state-observed.json
          if-no-files-found: error
          retention-days: 60
