name: Application progress on the native Windows tab strip
on:
  workflow_call:
    inputs:
      product_run: {required: true, type: string}
      product_commit: {required: true, type: string}
      memory_only: {type: boolean, default: false}
permissions:
  contents: read
  actions: read
jobs:
  records:
    runs-on: windows-2025
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix: {renderer: [gdi, directx]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch the exact single executable
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/progress-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/progress-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install and identify Sarasa Light
        run: scripts/prepare-remote-interaction.ps1
      - name: Check pixels on the task tab after each child write
        if: ${{ !inputs.memory_only }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/taskbar_progress_window.py
      - name: Check real shell API outcomes including competing sessions and tab closure
        if: ${{ !cancelled() && !inputs.memory_only && env.NEMOTERM_TEST_FONT != '' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/taskbar_shell_window.py
      - name: Sample the full grid with progress active on both tabs
        if: ${{ !cancelled() && env.NEMOTERM_TEST_FONT != '' }}
        env:
          RENDERER: ${{ matrix.renderer }}
          NEMOTERM_REQUIRE_DIRECTX: '1'
        run: |
          $vswhere="${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cl /nologo /W4 /WX /EHsc /std:c++17 tests/dpi_display_probe.cpp /Febuild/interaction-dependencies/dpi-display.exe /Fobuild/interaction-dependencies/dpi-display.obj user32.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/prepare-full-grid-display.ps1
          python -m pip install frida==17.24.3 Pillow==13.0.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $side=if ($env:RENDERER -eq 'directx') {'left'} else {'top'}
          python tests/tabs_window_smoke.py --renderer $env:RENDERER --side $side --cols 160 --rows 48 --require-grid --font $env:NEMOTERM_TEST_FONT --workload-memory --kitty-images --kitty-unicode --application-progress --session-seconds 900
      - name: Restore the original runner display
        if: always()
        run: scripts/prepare-full-grid-display.ps1 -Restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: taskbar-progress-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/progress-*.json
            research/taskbar-progress-*.json
            research/taskbar-progress-*.png
            build/progress-product/SOURCE-HOST.json
            build/interaction-dependencies/environment.json
            build/interaction-dependencies/full-grid-display.json
          if-no-files-found: error
