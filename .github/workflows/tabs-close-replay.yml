name: Diagnose close from an explicit artifact

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: Close fixture to diagnose
        type: choice
        options: [profiles, profiles-api, profiles-mingw, profiles-api-mingw, shutdown, restart-mingw, tabs, tabs-probes, tabs-mingw, tabs-unicode, tabs-unicode-900s, unicode-memory, drop]
        default: profiles
        required: true
      source_commit:
        description: Full source commit of the failed run
        type: string
        required: true
      source_run:
        description: Failed single-image run, or core run with the selected completed failed compiler job
        type: string
        required: true
      executable_sha256:
        description: Exact SHA256 of the unverified executable
        type: string
        required: true
      capture_exceptions:
        description: Attach the external diagnostic debugger during tabs replay
        type: boolean
        default: false
      capture_failure_dumps:
        description: Capture a small external dump after a shutdown or mixed-profile failure
        type: boolean
        default: false
      shutdown_observer:
        description: Ordinary paired checks, or a diagnostic Frida session without scripts
        type: choice
        options: [both, session]
        default: both
      instrumentation_version:
        description: Pinned Frida version for a controlled observer comparison
        type: choice
        options: ['17.24.3', '17.23.3']
        default: '17.24.3'
      rebuild_profiles:
        description: Rebuild the pinned MinGW source for profile diagnosis when the failed image is unavailable
        type: boolean
        default: false
      repetitions:
        description: Independent lifetimes; tabs-probes always runs six counterbalanced lifetimes
        type: choice
        options: ['1', '3', '12']
        default: '3'

permissions:
  contents: read
  actions: read

jobs:
  dense-diagnostic:
    if: ${{ inputs.fixture == 'unicode-memory' }}
    uses: ./.github/workflows/dense-image-diagnostic.yml
    with:
      source_commit: ${{ inputs.source_commit }}
      source_run: ${{ inputs.source_run }}
  source-diagnostic:
    if: ${{ inputs.rebuild_profiles && inputs.fixture == 'profiles' }}
    uses: ./.github/workflows/profiles-close-diagnostic.yml
    with:
      source_commit: ${{ inputs.source_commit }}
      source_run: ${{ inputs.source_run }}
  diagnostic:
    if: ${{ !inputs.rebuild_profiles && inputs.fixture != 'unicode-memory' }}
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_RUN: ${{ inputs.source_run }}
      EXPECTED_SHA256: ${{ inputs.executable_sha256 }}
      CLOSE_FIXTURE: ${{ inputs.fixture }}
      CAPTURE_EXCEPTIONS: ${{ inputs.capture_exceptions }}
      CAPTURE_FAILURE_DUMPS: ${{ inputs.capture_failure_dumps }}
      SHUTDOWN_OBSERVER: ${{ inputs.shutdown_observer }}
      FIXTURE_FRIDA_VERSION: ${{ inputs.instrumentation_version }}
      REPLAY_REPETITIONS: ${{ inputs.repetitions }}
      NEMOTERM_TEST_TRACEBACK_SECONDS: '60'
      NEMOTERM_SHUTDOWN_DEADLINE_SECONDS: '120'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and isolate the exact failed image
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $env:SOURCE_RUN -notmatch '^[1-9][0-9]*$' -or $env:EXPECTED_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Invalid source identity' }
          $isTabs = $env:CLOSE_FIXTURE -in @('tabs','tabs-probes','tabs-mingw')
          if ($env:CLOSE_FIXTURE -eq 'tabs-probes' -and $env:CAPTURE_EXCEPTIONS -eq 'true') { throw 'Probe comparison excludes the external debugger' }
          if ($env:CAPTURE_EXCEPTIONS -eq 'true' -and !$isTabs) { throw 'External exception observer currently covers the tabs fixture only' }
          if ($env:CAPTURE_FAILURE_DUMPS -eq 'true' -and $env:CLOSE_FIXTURE -notin @('shutdown','profiles','profiles-api','profiles-mingw','profiles-api-mingw')) { throw 'Failure dump capture covers shutdown and profiles fixtures' }
          if ($env:FIXTURE_FRIDA_VERSION -notin @('17.24.3','17.23.3')) { throw 'Unexpected instrumentation version' }
          if ($env:REPLAY_REPETITIONS -notin @('1','3','12')) { throw 'Unexpected replay count' }
          $run = gh run view $env:SOURCE_RUN --json headSha,status,conclusion,workflowName,jobs | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Could not read source run' }
          $coreArtifact = $isTabs -or $env:CLOSE_FIXTURE -in @('restart-mingw','profiles-mingw','profiles-api-mingw')
          $expectedWorkflow = if ($coreArtifact) { 'Test and build' } else { 'Single executable from source' }
          if ($run.headSha -ne $env:SOURCE_COMMIT -or $run.workflowName -ne $expectedWorkflow) { throw 'Source or workflow identity mismatch' }
          if ($coreArtifact) {
            $jobName = if ($env:CLOSE_FIXTURE -in @('tabs-mingw','restart-mingw','profiles-mingw','profiles-api-mingw')) { 'Windows x64 tests and portable build' } else { 'MSVC native renderer diagnostics' }
            $failedJob = @($run.jobs | Where-Object { $_.name -eq $jobName -and $_.status -eq 'completed' -and $_.conclusion -eq 'failure' })
            if ($failedJob.Count -ne 1) { throw "Expected one completed failed $jobName job" }
          } elseif ($run.status -ne 'completed' -or $run.conclusion -ne 'failure') { throw 'Expected a completed failed single-image run' }
          git diff --quiet $env:SOURCE_COMMIT HEAD -- vendor native scripts/build.ps1 scripts/build-single-exe.ps1 scripts/prepare-single-exe.py
          if ($LASTEXITCODE) { throw 'Production differs from the selected artifact' }
          $artifactPrefix = switch ($env:CLOSE_FIXTURE) {
            'tabs' { 'unverified-msvc-renderer-' }
            'tabs-probes' { 'unverified-msvc-renderer-' }
            'tabs-mingw' { 'unverified-mingw-runtime-' }
            'restart-mingw' { 'unverified-mingw-runtime-' }
            'profiles-mingw' { 'unverified-mingw-runtime-' }
            'profiles-api-mingw' { 'unverified-mingw-runtime-' }
            default { 'unverified-single-exe-x64-' }
          }
          gh run download $env:SOURCE_RUN --name "$artifactPrefix$env:SOURCE_COMMIT" --dir build/close-replay-product
          if ($LASTEXITCODE) { throw 'Artifact download failed' }
          $exe = Get-Item build/close-replay-product/nemoterm.exe
          $digest = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:EXPECTED_SHA256) { throw 'Executable hash mismatch' }
          New-Item -ItemType Directory -Force build/close-replay-evidence | Out-Null
          "NEMOTERM_TEST_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          [ordered]@{
            source_commit = $env:SOURCE_COMMIT
            source_run = $env:SOURCE_RUN
            fixture_commit = (git rev-parse HEAD).Trim()
            executable_sha256 = $digest
            executable_bytes = $exe.Length
            runtime_hashes = @(Get-ChildItem build/close-replay-product -File | Get-FileHash -Algorithm SHA256 | Select-Object Path, Hash)
            fixture = $env:CLOSE_FIXTURE
            artifact_name = "$artifactPrefix$env:SOURCE_COMMIT"
            capture_exceptions = ($env:CAPTURE_EXCEPTIONS -eq 'true')
            capture_failure_dumps = ($env:CAPTURE_FAILURE_DUMPS -eq 'true')
            shutdown_observer = $env:SHUTDOWN_OBSERVER
            frida_version = $(if ($env:CLOSE_FIXTURE -notin @('profiles-api','drop')) { $env:FIXTURE_FRIDA_VERSION } else { $null })
            profile_observer = $(if ($env:CLOSE_FIXTURE -in @('profiles-api','profiles-api-mingw')) { 'automation' } elseif ($env:CLOSE_FIXTURE -in @('profiles','profiles-mingw')) { 'frida' } else { $null })
            repetitions = $(if ($env:CLOSE_FIXTURE -eq 'tabs-probes') { 6 } elseif ($env:CLOSE_FIXTURE -eq 'restart-mingw') { 2 * [int]$env:REPLAY_REPETITIONS } else { [int]$env:REPLAY_REPETITIONS })
            fixture_hashes = @(Get-FileHash tests/tabs_profiles_window_smoke.py, tests/automation_capture.py, tools/nemoterm_debug.py, tests/gpu_capture.py, tests/frida_test_utils.py, tests/native_test_utils.py, tests/shutdown_window_smoke.py, tests/session_restart_window_smoke.py, tests/session_dialog_observer.py, tests/shutdown_probe.js, tests/tabs_window_smoke.py, tests/tab_probe_boundary.py, tests/tabs_hover_probe.js, tests/agent_key_probe.js, tests/session_faults.js, tests/session_fixture.py, tests/mouse_fixture.py, tests/tab_workload_memory.py, tests/kitty_unicode_tab_workload.py, tests/drop_window_smoke.py, tests/clipboard_test_utils.py, tests/automation_window_smoke.py, tests/fixture_io.py, tests/owned_job.py -Algorithm SHA256 | Select-Object Path, Hash)
            unverified_product = $true
            scope = 'Exact-image diagnosis only; unchanged fixture deadlines; no product acceptance'
          } | ConvertTo-Json | Set-Content build/close-replay-evidence/identity.json
      - name: Install fixture dependency
        if: ${{ inputs.fixture != 'profiles-api' && inputs.fixture != 'profiles-api-mingw' && inputs.fixture != 'drop' }}
        run: python -m pip install "frida==$env:FIXTURE_FRIDA_VERSION"
      - name: Verify shutdown observer detects invalid event orders
        if: ${{ inputs.fixture == 'shutdown' }}
        shell: pwsh
        run: ./scripts/test-shutdown-observer.ps1 -Destination build/close-replay-evidence/probe-controls
      - name: Verify code-change detection and foreign-job rejection
        if: ${{ inputs.fixture == 'tabs-probes' }}
        shell: pwsh
        run: |
          ./scripts/test-code-boundary.ps1 -Destination build/close-replay-evidence/code-controls
          Get-FileHash tests/owned_code_boundary.py, tests/owned_code_boundary_controls.py, tests/native_exception_control.c, scripts/test-code-boundary.ps1 -Algorithm SHA256 | ConvertTo-Json | Set-Content build/close-replay-evidence/code-observer-source.json
      - name: Verify external exception capture and target survival
        if: ${{ inputs.capture_exceptions && (inputs.fixture == 'tabs' || inputs.fixture == 'tabs-mingw') }}
        shell: pwsh
        run: |
          ./scripts/test-exception-observer.ps1 -Destination build/close-replay-evidence/exception-controls
          Get-FileHash tests/native_exception_observer.c, tests/native_exception_observer.py, tests/native_exception_control.c, tests/native_exception_controls.py, scripts/test-exception-observer.ps1 -Algorithm SHA256 | ConvertTo-Json | Set-Content build/close-replay-evidence/exception-observer-source.json
      - name: Verify failure dump ownership, context and target survival
        if: ${{ inputs.capture_failure_dumps && (inputs.fixture == 'shutdown' || inputs.fixture == 'profiles' || inputs.fixture == 'profiles-api') }}
        shell: pwsh
        run: |
          ./scripts/test-failure-dump.ps1 -Destination build/close-replay-evidence/failure-dump-controls
          Get-FileHash tests/native_failure_dump.c, tests/native_failure_dump.py, tests/native_failure_dump_controls.py, tests/native_exception_control.c, scripts/test-failure-dump.ps1 -Algorithm SHA256 | ConvertTo-Json | Set-Content build/close-replay-evidence/failure-dump-source.json
      - name: Observe independently owned exact-image lifetimes
        shell: pwsh
        run: |
          switch ($env:CLOSE_FIXTURE) {
            'profiles' { $fixture = 'tabs_profiles_window_smoke.py'; $record = 'tabs-profiles-observed.json' }
            'profiles-api' { $fixture = 'tabs_profiles_window_smoke.py'; $record = 'tabs-profiles-observed.json' }
            'profiles-mingw' { $fixture = 'tabs_profiles_window_smoke.py'; $record = 'tabs-profiles-observed.json' }
            'profiles-api-mingw' { $fixture = 'tabs_profiles_window_smoke.py'; $record = 'tabs-profiles-observed.json' }
            'restart-mingw' { $fixture = 'session_restart_window_smoke.py'; $record = 'session-restart-observed.json' }
            'shutdown' { $fixture = 'shutdown_window_smoke.py'; $record = 'shutdown-window-observed.json' }
            'tabs' { $fixture = 'tabs_window_smoke.py'; $record = 'tabs-opengl-right-observed.json' }
            'tabs-probes' { $fixture = 'tabs_window_smoke.py'; $record = '' }
            'tabs-mingw' { $fixture = 'tabs_window_smoke.py'; $record = 'tabs-opengl-right-observed.json' }
            'tabs-unicode' { $fixture = 'tabs_window_smoke.py'; $record = 'unicode-kitty-workload-tabs-gdi-top-observed.json' }
            'tabs-unicode-900s' { $fixture = 'tabs_window_smoke.py'; $record = 'unicode-kitty-workload-tabs-gdi-top-observed.json' }
            'drop' { $fixture = 'drop_window_smoke.py'; $record = 'drop-gdi-observed.json' }
            default { throw 'Unknown close fixture' }
          }
          $failed = $false
          $fixtureArgs = if ($env:CLOSE_FIXTURE -in @('tabs-unicode','tabs-unicode-900s')) {
            @('--renderer','gdi','--side','top','--cols','160','--rows','48','--font','Consolas','--workload-memory','--kitty-images','--kitty-unicode','--probe-boundaries')
          } elseif ($env:CLOSE_FIXTURE -eq 'tabs-mingw') {
            @('--renderer','opengl','--side','right','--cols','160','--rows','48','--font','Consolas','--probe-boundaries')
          } elseif ($env:CLOSE_FIXTURE -in @('tabs','tabs-probes')) {
            @('--renderer','opengl','--side','right','--cols','88','--rows','35','--font','Consolas','--probe-boundaries')
          } else { @() }
          if ($env:CLOSE_FIXTURE -eq 'tabs-unicode-900s') {
            $fixtureArgs += @('--session-seconds','900')
          }
          if ($env:CLOSE_FIXTURE -eq 'shutdown') {
            $fixtureArgs += @('--observer', $env:SHUTDOWN_OBSERVER)
          }
          if ($env:CLOSE_FIXTURE -in @('profiles-api','profiles-api-mingw')) {
            $fixtureArgs += @('--observer', 'automation')
          }
          if ($env:CAPTURE_EXCEPTIONS -eq 'true') {
            $fixtureArgs += @('--exception-observer', (Resolve-Path build/close-replay-evidence/exception-controls/observer.exe).Path)
            $record = 'exception-tabs-opengl-right-observed.json'
          }
          if ($env:CAPTURE_FAILURE_DUMPS -eq 'true') {
            $fixtureArgs += @('--failure-dump', (Resolve-Path build/close-replay-evidence/failure-dump-controls/helper.exe).Path)
          }
          $modes = if ($env:CLOSE_FIXTURE -eq 'tabs-probes') {
            @('immediate','unload-first','after-interactions','after-interactions','unload-first','immediate')
          } elseif ($env:CLOSE_FIXTURE -eq 'restart-mingw') {
            foreach ($pair in 1..([int]$env:REPLAY_REPETITIONS)) {
              if ($pair % 2) { 'instrumented'; 'native-dialogs' } else { 'native-dialogs'; 'instrumented' }
            }
          } else { @('original') * [int]$env:REPLAY_REPETITIONS }
          $iteration = 0
          foreach ($mode in $modes) {
            $iteration++
            $runArgs = @($fixtureArgs)
            if ($env:CLOSE_FIXTURE -eq 'tabs-probes') {
              $runArgs += @('--probe-detach-mode', $mode)
              $record = "probe-$mode-tabs-opengl-right-observed.json"
            }
            if ($env:CLOSE_FIXTURE -eq 'restart-mingw') {
              $record = 'session-restart-observed.json'
              if ($mode -eq 'native-dialogs') { $runArgs += '--native-dialogs'; $record = 'session-restart-native-observed.json' }
            }
            python "tests/$fixture" @runArgs 2>&1 | Tee-Object "build/close-replay-evidence/replay-$iteration.log"
            $code = $LASTEXITCODE
            if (Test-Path "research/$record") { Copy-Item "research/$record" "build/close-replay-evidence/replay-$iteration-observed.json" }
            if ($env:CAPTURE_EXCEPTIONS -eq 'true') {
              Get-ChildItem research -Directory -Filter 'exception-tabs-*' | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination build/close-replay-evidence -Recurse -Force }
            }
            if ($env:CAPTURE_FAILURE_DUMPS -eq 'true') {
              $dumpPattern = if ($env:CLOSE_FIXTURE -in @('profiles','profiles-api','profiles-mingw','profiles-api-mingw')) { 'profiles-failure-*' } else { 'shutdown-failure-*' }
              Get-ChildItem research -Directory -Filter $dumpPattern | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination build/close-replay-evidence -Recurse -Force }
            }
            if ($code) { $failed = $true }
          }
          if ($failed) { throw 'At least one diagnostic replay failed; all completed observations retained' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tabs-close-diagnostic-${{ github.sha }}
          path: build/close-replay-evidence/
          retention-days: 30
          if-no-files-found: error
