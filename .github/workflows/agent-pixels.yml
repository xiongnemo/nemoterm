name: Review the exact agent interaction frames
on:
  workflow_call:
    inputs:
      product_run: {type: string, required: true}
      product_commit: {type: string, required: true}
      receipt_run: {type: string, required: true}
      bindings: {type: boolean, default: false}
permissions:
  actions: read
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GROUP: ${{ inputs.bindings && 'agents' || 'agents-grid' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Authenticate the two agent archives and the matching executable
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
          RECEIPT_RUN: ${{ inputs.receipt_run }}
        run: python3 scripts/fetch-agent-review.py "$PRODUCT_RUN" "$PRODUCT_COMMIT" "$RECEIPT_RUN" build/agent-review --group "$GROUP"
      - name: Prepare the image reader
        id: pillow
        run: |
          python3 -m venv "$RUNNER_TEMP/agent-review-venv"
          py="$RUNNER_TEMP/agent-review-venv/bin/python"
          "$py" -m pip install Pillow==13.0.0
      - name: Verify the original pixels, exact clipboard and provider submissions
        run: |
          py="$RUNNER_TEMP/agent-review-venv/bin/python"
          if [[ "$GROUP" == agents ]]; then
            "$py" scripts/review-agent-bindings.py build/agent-review/receipt.zip build/agent-review/surfaces.zip --output build/agent-review/bindings.json
            exit $?
          fi
          "$py" scripts/review-agent-wide-selection.py build/agent-review/receipt.zip build/agent-review/surfaces.zip --output build/agent-review/selection
          "$py" scripts/review-agent-window-memory.py build/agent-review/receipt.zip build/agent-review/agent-window-memory.json
          "$py" scripts/review-agent-composer.py build/agent-review/receipt.zip build/agent-review/surfaces.zip --output build/agent-review/composer
      - name: Read the repeated Unicode glyphs, keeping incomplete attempts visible
        if: ${{ !cancelled() && !inputs.bindings && steps.fetch.outcome == 'success' && steps.pillow.outcome == 'success' }}
        run: '"$RUNNER_TEMP/agent-review-venv/bin/python" scripts/review-character-repeat.py build/agent-review/receipt.zip build/agent-review/surfaces.zip build/agent-review/character-repeat.json'
      - name: Read the two physical RTL selections and verify the pasted provider prompt
        if: ${{ !cancelled() && !inputs.bindings && steps.fetch.outcome == 'success' && steps.pillow.outcome == 'success' }}
        run: '"$RUNNER_TEMP/agent-review-venv/bin/python" scripts/review-agent-bidi.py build/agent-review/receipt.zip build/agent-review/surfaces.zip build/agent-review/bidi.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.bindings && 'agent-bindings' || 'agent-pixels' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/agent-review/character-repeat.json
            build/agent-review/bidi.json
            build/agent-review/inputs.json
            build/agent-review/bindings.json
            build/agent-review/agent-window-memory.*
            build/agent-review/selection/
            build/agent-review/composer/
          if-no-files-found: error
