name: ReGIS native single-image pixels
on:
  workflow_call:
    inputs:
      product_run:
        type: string
        required: true
      product_commit:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      product_run:
        description: Completed source-host job containing the exact single image
        type: string
        required: true
      product_commit:
        description: Full source SHA of that image; production must be unchanged
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  pixels:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [gdi, opengl, directx, presented-gdi]
    env:
      NEMOTERM_TEST_TRACEBACK_SECONDS: '60'
      NEMOTERM_REQUIRE_DIRECTX: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and download the exact source-host executable
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        shell: pwsh
        run: |
          ./scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/regis-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/regis-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install and identify the pinned Sarasa font
        id: font
        run: scripts/prepare-remote-interaction.ps1
      - name: Check live ReGIS geometry and lifecycle on the owned window
        env:
          CAPTURE_MODE: ${{ matrix.mode }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/regis-window-evidence | Out-Null
          $arguments = @('--renderer', $env:CAPTURE_MODE)
          if ($env:CAPTURE_MODE -eq 'presented-gdi') { $arguments = @('--renderer','gdi','--presented-gdi') }
          python tests/regis_window_smoke.py @arguments 2>&1 | Tee-Object build/regis-window-evidence/native.log
          exit $LASTEXITCODE
      - name: Check eviction and retained pixels with a one-line scrollback
        env:
          CAPTURE_MODE: ${{ matrix.mode }}
        shell: pwsh
        run: |
          $arguments = @('--renderer', $env:CAPTURE_MODE)
          if ($env:CAPTURE_MODE -eq 'presented-gdi') { $arguments = @('--renderer','gdi','--presented-gdi') }
          python tests/regis_scrollback_window_smoke.py @arguments 2>&1 | Tee-Object build/regis-window-evidence/history-limit.log
          exit $LASTEXITCODE
      - name: Check XTerm Sixel colour continuation on a saved profile
        if: ${{ !cancelled() }}
        env:
          CAPTURE_MODE: ${{ matrix.mode }}
        shell: pwsh
        run: |
          $arguments = @('--renderer', $env:CAPTURE_MODE)
          if ($env:CAPTURE_MODE -eq 'presented-gdi') { $arguments = @('--renderer','gdi','--presented-gdi') }
          python tests/sixel_stream_window_smoke.py @arguments 2>&1 | Tee-Object build/regis-window-evidence/sixel-colour-stream.log
          exit $LASTEXITCODE
      - name: Compare new, legacy and explicitly saved Sixel profile colours
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.font.outcome == 'success' }}
        env:
          CAPTURE_MODE: ${{ matrix.mode }}
        shell: pwsh
        run: |
          $arguments = @('--renderer', $env:CAPTURE_MODE)
          if ($env:CAPTURE_MODE -eq 'presented-gdi') { $arguments = @('--renderer','gdi','--presented-gdi') }
          $failed = @()
          foreach ($kind in 'fresh','saved-before-option','saved-off','saved-on') {
            python tests/sixel_profile_defaults.py $kind @arguments
            if ($LASTEXITCODE) { $failed += $kind }
          }
          if ($failed.Count) { throw "Sixel profile pixel failures: $($failed -join ', ')" }
      - name: Compare alternate graphics after text and ReGIS queries on the main screen
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.font.outcome == 'success' }}
        env:
          CAPTURE_MODE: ${{ matrix.mode }}
        shell: pwsh
        run: |
          $arguments = @('--renderer', $env:CAPTURE_MODE)
          if ($env:CAPTURE_MODE -eq 'presented-gdi') { $arguments = @('--renderer','gdi','--presented-gdi') }
          $failed = @()
          foreach ($query in 'text','graphics') {
            python tests/regis_alt_remap_window.py $query @arguments
            if ($LASTEXITCODE) { $failed += $query }
          }
          if ($failed.Count) { throw "ReGIS alternate remap failures: $($failed -join ', ')" }
      - name: Discover ReGIS before sending the first drawing
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.font.outcome == 'success' }}
        env:
          CAPTURE_MODE: ${{ matrix.mode }}
        run: |
          $arguments = @('--renderer', $env:CAPTURE_MODE)
          if ($env:CAPTURE_MODE -eq 'presented-gdi') { $arguments = @('--renderer','gdi','--presented-gdi') }
          python tests/regis_discovery_window.py @arguments
      - name: Check text row motion and ReGIS screen coordinates for old and new profiles
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.font.outcome == 'success' }}
        env:
          CAPTURE_MODE: ${{ matrix.mode }}
        shell: pwsh
        run: |
          $arguments = @('--renderer', $env:CAPTURE_MODE)
          if ($env:CAPTURE_MODE -eq 'presented-gdi') { $arguments = @('--renderer','gdi','--presented-gdi') }
          $failed = @()
          foreach ($profileKind in 'fresh','old','anchor','follow') {
            python tests/regis_scroll_origin_window.py $profileKind @arguments
            if ($LASTEXITCODE) { $failed += $profileKind }
          }
          if ($failed.Count) { throw "ReGIS reverse-scroll failures: $($failed -join ', ')" }
      - name: Retain all observations including failures
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/regis-window-evidence | Out-Null
          Copy-Item research/regis-window-* build/regis-window-evidence/ -Recurse -ErrorAction SilentlyContinue
          Copy-Item build/regis-product/*.json,build/interaction-dependencies/environment.json build/regis-window-evidence/ -ErrorAction SilentlyContinue
          git rev-parse HEAD > build/regis-window-evidence/fixture-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regis-window-${{ matrix.mode }}-${{ github.sha }}
          path: build/regis-window-evidence/
          if-no-files-found: error
          retention-days: 30
