name: Pointer shape components

on:
  workflow_call:
    inputs:
      skip_windows:
        type: boolean
        default: false
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pointer-shapes.yml
      - vendor/putty-0.85/terminal/nemo_pointer.*
      - tests/test_pointer_shapes.c
      - tests/pointer_shape_reference.h
      - tests/pointer_terminal_reference.h
      - vendor/putty-0.85/test/test_pointer_terminal.c
      - vendor/putty-0.85/windows/nemo_pointer_*
      - tests/test_pointer_cursor.c
      - tests/test_pointer_glyph.c
      - tests/pointer_window_smoke.py
      - scripts/generate-pointer-reference.py
      - research/pointer-shape-evidence/**

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify independent capture projection
        run: python3 scripts/generate-pointer-reference.py --check
      - name: Strict compiler and sanitizer replay
        shell: bash
        run: |
          set -euo pipefail
          "$CC" --version > compiler.txt
          sha256sum vendor/putty-0.85/terminal/nemo_pointer.* tests/test_pointer_shapes.c tests/pointer_shape_reference.h > sources.sha256
          "$CC" -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -O2 -I vendor/putty-0.85/terminal tests/test_pointer_shapes.c vendor/putty-0.85/terminal/nemo_pointer.c -o pointer-test
          ./pointer-test 2>&1 | tee normal.log
          "$CC" -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -I vendor/putty-0.85/terminal tests/test_pointer_shapes.c vendor/putty-0.85/terminal/nemo_pointer.c -o pointer-sanitizers
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./pointer-sanitizers 2>&1 | tee sanitizers.log
      - name: Check bounded cursor glyph masks with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tests/test_pointer_glyph.c vendor/putty-0.85/windows/nemo_pointer_glyph.* > glyph-sources.sha256
          "$CC" -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -I vendor/putty-0.85/terminal -I vendor/putty-0.85/windows tests/test_pointer_glyph.c vendor/putty-0.85/windows/nemo_pointer_glyph.c -o pointer-glyph
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./pointer-glyph 2>&1 | tee glyph.log
      - name: Replay complete VT inputs through the terminal with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          sha256sum vendor/putty-0.85/terminal/terminal.c vendor/putty-0.85/terminal/terminal.h vendor/putty-0.85/putty.h vendor/putty-0.85/test/test_pointer_terminal.c tests/pointer_terminal_reference.h > terminal-sources.sha256
          cmake -S vendor/putty-0.85 -B pointer-terminal-build -G Ninja \
            -DPUTTY_GTK_VERSION=NONE -DPUTTY_GSSAPI=OFF \
            '-DCMAKE_C_FLAGS=-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined' 2>&1 | tee terminal-configure.log
          cmake --build pointer-terminal-build --target test_pointer_terminal test_queries --parallel 4 2>&1 | tee terminal-build.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./pointer-terminal-build/test_pointer_terminal 2>&1 | tee terminal.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./pointer-terminal-build/test_queries 2>&1 | tee queries.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pointer-component-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            compiler.txt
            sources.sha256
            normal.log
            sanitizers.log
            terminal*.log
            terminal-sources.sha256
            queries.log
            glyph.log
            glyph-sources.sha256
          if-no-files-found: error
          retention-days: 30
  msvc:
    if: ${{ !inputs.skip_windows }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - name: Verify independent capture projection
        run: python scripts/generate-pointer-reference.py --check
      - name: Strict MSVC replay
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-FileHash vendor/putty-0.85/terminal/nemo_pointer.c,vendor/putty-0.85/terminal/nemo_pointer.h,tests/test_pointer_shapes.c,tests/pointer_shape_reference.h -Algorithm SHA256 | ConvertTo-Json | Set-Content sources.json
          & cl.exe /nologo /std:c11 /W4 /WX /O2 /Ivendor/putty-0.85/terminal tests/test_pointer_shapes.c vendor/putty-0.85/terminal/nemo_pointer.c /Fe:pointer-test.exe 2>&1 | Tee-Object compiler.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./pointer-test.exe 2>&1 | Tee-Object normal.log
          exit $LASTEXITCODE
      - name: Replay complete VT inputs with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-FileHash vendor/putty-0.85/terminal/terminal.c,vendor/putty-0.85/terminal/terminal.h,vendor/putty-0.85/putty.h,vendor/putty-0.85/test/test_pointer_terminal.c,tests/pointer_terminal_reference.h -Algorithm SHA256 | ConvertTo-Json | Set-Content terminal-sources.json
          cmake -S vendor/putty-0.85 -B pointer-terminal-build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=MinSizeRel '-DCMAKE_C_FLAGS=/std:c11 /utf-8' '-DCMAKE_C_FLAGS_MINSIZEREL=/O1 /Ob1 /Gy /Gw' -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DPUTTY_GSSAPI=OFF 2>&1 | Tee-Object terminal-configure.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build pointer-terminal-build --target test_pointer_terminal test_queries --parallel 4 2>&1 | Tee-Object terminal-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./pointer-terminal-build/test_pointer_terminal.exe 2>&1 | Tee-Object terminal.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./pointer-terminal-build/test_queries.exe 2>&1 | Tee-Object queries.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash vendor/putty-0.85/windows/nemo_pointer_win.c,vendor/putty-0.85/windows/nemo_pointer_win.h,vendor/putty-0.85/windows/nemo_pointer_glyph.c,vendor/putty-0.85/windows/nemo_pointer_glyph.h,vendor/putty-0.85/windows/window.c,vendor/putty-0.85/windows/win-gui-seat.h,vendor/putty-0.85/windows/nemo_link_ui.c,vendor/putty-0.85/windows/nemo_tabs_host.inc,tests/test_pointer_cursor.c -Algorithm SHA256 | ConvertTo-Json | Set-Content pointer-native-sources.json
          cmake --build pointer-terminal-build --target pterm test_pointer_cursor --parallel 4 2>&1 | Tee-Object pointer-native-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash pointer-terminal-build/nemoterm.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content pointer-frontend.json
          ./pointer-terminal-build/test_pointer_cursor.exe 2>&1 | Tee-Object pointer-native.log
          exit $LASTEXITCODE
      - name: Build the single image with the current source console host
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/build-single-exe.ps1 -Destination pointer-single 2>&1 | Tee-Object pointer-single-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash pointer-single/nemoterm.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content pointer-single-image.json
      - name: Verify native pointer selection in owned real windows
        if: ${{ !cancelled() }}
        env:
          NEMOTERM_TEST_EXE: ${{ github.workspace }}/pointer-single/nemoterm.exe
        run: |
          if (!(Test-Path $env:NEMOTERM_TEST_EXE) -or !(Test-Path pointer-mask-grab-32.bin)) {
            throw 'The resource fixture did not produce the required frontend and native masks'
          }
          python tests/pointer_window_smoke.py --masks . 2>&1 | Tee-Object pointer-window.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pointer-component-msvc-${{ github.sha }}
          path: |
            compiler.log
            sources.json
            normal.log
            terminal*.log
            terminal-sources.json
            queries.log
            pointer-native*.log
            pointer-native-sources.json
            pointer-frontend.json
            pointer-terminal-build/nemoterm.exe
            pointer-atlas-*.bmp
            pointer-mask-*.bin
            pointer-window.log
            pointer-single-build.log
            pointer-single-image.json
            pointer-single/nemoterm.exe
            research/pointer-native-window/**
          if-no-files-found: error
          retention-days: 30
