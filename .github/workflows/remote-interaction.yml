name: Remote interaction acceptance

on:
  workflow_call:
    inputs:
      product_run:
        type: string
        required: true
      product_commit:
        type: string
        required: true
      groups:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  busybox:
    name: Build pinned BusyBox shell fixture
    runs-on: ubuntu-latest
    needs: orchestration
    if: ${{ needs.orchestration.outputs.shell_groups != '[]' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rmyorston/busybox-w32
          ref: 5f09fb446adf81d005f0aad9dc47eca19ac3b74c
      - name: Cross-compile the upstream Windows configuration
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64
          # The ANSI build loses Chinese paths before the shell can parse
          # them. Use upstream's Unicode Windows configuration for UTF-8 tests.
          make mingw64u_defconfig
          make -j2
          mkdir product
          cp busybox.exe LICENSE .config product/
          git archive --format=tar.gz HEAD > product/source.tar.gz
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('product/busybox.exe')
          pathlib.Path('product/busybox.json').write_text(json.dumps(dict(
              Source='https://github.com/rmyorston/busybox-w32',
              Configuration='mingw64u_defconfig',
              Commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              SHA256=hashlib.sha256(p.read_bytes()).hexdigest())),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interaction-busybox-${{ github.run_id }}-${{ github.run_attempt }}
          path: product/
          include-hidden-files: true
          retention-days: 14
  orchestration:
    runs-on: ubuntu-latest
    outputs:
      independent_groups: ${{ steps.groups.outputs.independent_groups }}
      shell_groups: ${{ steps.groups.outputs.shell_groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python tests/test_interaction_acceptance.py
      - run: python tests/test_interaction_summary.py
      - run: python tests/memory_limits_test.py
      - name: Validate the selected groups
        id: groups
        env:
          TEST_GROUPS: ${{ inputs.groups }}
        run: |
          python - <<'PY'
          import json,os,sys
          sys.path.insert(0,'scripts')
          from interaction_acceptance import catalog, selected
          groups=json.loads(os.environ['TEST_GROUPS']) if os.environ['TEST_GROUPS'] else list(dict.fromkeys(c['group'] for c in catalog()))
          if not isinstance(groups,list) or not groups or not all(isinstance(g,str) for g in groups) or len(groups)!=len(set(groups)):
              raise ValueError('Expected a nonempty JSON array of unique group names')
          selected(catalog(),groups)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              shell_groups=[g for g in groups if g in ('shells','clipboard')]
              out.write('shell_groups='+json.dumps(shell_groups)+'\n')
              out.write('independent_groups='+json.dumps([g for g in groups if g not in shell_groups])+'\n')
          PY
  independent:
    needs: orchestration
    if: ${{ needs.orchestration.outputs.independent_groups != '[]' }}
    uses: ./.github/workflows/interaction-groups.yml
    with:
      groups: ${{ needs.orchestration.outputs.independent_groups }}
      max_parallel: 4
      shell_fixtures: false
      product_run: ${{ inputs.product_run }}
      product_commit: ${{ inputs.product_commit }}
  with-shells:
    needs: [orchestration, busybox]
    uses: ./.github/workflows/interaction-groups.yml
    with:
      groups: ${{ needs.orchestration.outputs.shell_groups }}
      max_parallel: 1
      shell_fixtures: true
      product_run: ${{ inputs.product_run }}
      product_commit: ${{ inputs.product_commit }}
  report:
    name: Verify and publish the combined interaction report
    if: ${{ !cancelled() && needs.orchestration.result == 'success' }}
    needs: [orchestration, independent, with-shells]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download group receipts from this attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: interaction-receipt-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/group-receipts
      - name: Check all requested cases against the same executable
        if: ${{ !cancelled() }}
        env:
          INDEPENDENT: ${{ needs.orchestration.outputs.independent_groups }}
          SHELL_BACKED: ${{ needs.orchestration.outputs.shell_groups }}
          INDEPENDENT_STATUS: ${{ needs.independent.result }}
          SHELL_STATUS: ${{ needs.with-shells.result }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
          PRODUCT_RUN: ${{ inputs.product_run }}
        run: python scripts/summarize_interaction.py
      - name: Retain the report even for missing or failed cases
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interaction-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/interaction-report.json
          if-no-files-found: error
          retention-days: 30
