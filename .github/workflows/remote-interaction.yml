name: Remote interaction acceptance

on:
  workflow_call:
    inputs:
      product_run:
        type: string
        required: true
      product_commit:
        type: string
        required: true
      groups:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  busybox:
    name: Build pinned BusyBox shell fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rmyorston/busybox-w32
          ref: 5f09fb446adf81d005f0aad9dc47eca19ac3b74c
      - name: Cross-compile the upstream Windows configuration
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64
          make mingw64_defconfig
          make -j2
          mkdir product
          cp busybox.exe LICENSE .config product/
          git archive --format=tar.gz HEAD > product/source.tar.gz
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('product/busybox.exe')
          pathlib.Path('product/busybox.json').write_text(json.dumps(dict(
              Source='https://github.com/rmyorston/busybox-w32',
              Commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              SHA256=hashlib.sha256(p.read_bytes()).hexdigest())),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interaction-busybox-${{ github.run_id }}-${{ github.run_attempt }}
          path: product/
          include-hidden-files: true
          retention-days: 14
  orchestration:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python tests/test_interaction_acceptance.py
      - name: Validate the selected groups
        id: groups
        env:
          TEST_GROUPS: ${{ inputs.groups }}
        run: |
          python - <<'PY'
          import json,os,sys
          sys.path.insert(0,'scripts')
          from interaction_acceptance import catalog, selected
          groups=json.loads(os.environ['TEST_GROUPS']) if os.environ['TEST_GROUPS'] else list(dict.fromkeys(c['group'] for c in catalog()))
          if not isinstance(groups,list) or not groups or not all(isinstance(g,str) for g in groups) or len(groups)!=len(set(groups)):
              raise ValueError('Expected a nonempty JSON array of unique group names')
          selected(catalog(),groups)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('groups='+json.dumps(groups)+'\n')
          PY
  interaction:
    name: Interaction / ${{ matrix.group }}
    runs-on: windows-2025
    needs: [orchestration, busybox]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        group: ${{ fromJSON(needs.orchestration.outputs.groups) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and download the exact source-built executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: ./scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/interaction-product
      - name: Install pinned font and shell dependencies
        shell: pwsh
        env:
          TEST_GROUP: ${{ matrix.group }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:TEST_GROUP -in @('shells','clipboard')) {
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "interaction-busybox-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --dir build/interaction-busybox
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          ./scripts/prepare-remote-interaction.ps1 -Shells:($env:TEST_GROUP -in @('shells','clipboard'))
      - name: Install WSL Bash for shell and drop coverage
        if: ${{ matrix.group == 'shells' || matrix.group == 'clipboard' }}
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0 built distribution
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          set-as-default: 'true'
          update: 'false'
          use-cache: 'false'
      - name: Install native instrumentation
        run: python -m pip install frida==17.24.3 Pillow==13.0.0
      - name: Install pinned isolated client fixtures
        if: ${{ matrix.group == 'agents' }}
        run: |
          npm ci --prefix tools/codex-fixture --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix tools/opencode-fixture --ignore-scripts --no-audit --no-fund
          exit $LASTEXITCODE
      - name: Freeze product, fixtures and client identities
        shell: pwsh
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          $exe=(Resolve-Path build/interaction-product/nemoterm.exe).Path
          $arguments=@('scripts/interaction_acceptance.py','prepare','--stage','build/interaction','--exe',$exe,'--sha256',(Get-FileHash $exe).Hash.ToLowerInvariant())
          if ($env:TEST_GROUP -eq 'agents') {
            foreach ($client in @('codex','opencode')) {
              $images=@(Get-ChildItem "tools/$client-fixture/node_modules" -Recurse -Filter "$client.exe")
              if ($images.Count -ne 1) { throw "Expected one pinned $client executable" }
              $arguments+=@("--$client",$images[0].FullName)
            }
          }
          python @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:TEST_GROUP -eq 'shells') {
            'NEMOTERM_REQUIRED_SHELLS=pwsh,powershell,cmd,busybox-ash,git-bash,wsl-bash' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Run all cases in this group on the hosted desktop
        shell: pwsh
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: python build/interaction/runner.py run --stage build/interaction --group $env:TEST_GROUP --continue-on-failure
      - name: Publish case results
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build/interaction/results.json) {
            $results=Get-Content build/interaction/results.json -Raw | ConvertFrom-Json
            '| Case | Result | Seconds |' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '| --- | --- | ---: |' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            foreach ($case in $results) { "| $($case.id) | $($case.status) | $([int]$case.seconds) |" | Out-File $env:GITHUB_STEP_SUMMARY -Append }
          }
      - name: Retain identities, logs, screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interaction-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            build/interaction-product/SOURCE-HOST.json
            build/interaction-dependencies/environment.json
            build/interaction/*.json
            build/interaction/attempts/*/output.log
            build/interaction/attempts/*/research/
            build/interaction/attempts/*/build/
