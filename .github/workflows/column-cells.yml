name: Column editing and wide glyphs
on:
  workflow_call:
    inputs:
      source_commit: {required: true, type: string}
      source_run: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: prepare
        name: Fetch the source-built frontend and select the pinned Sarasa face
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.source_run }}
          PRODUCT_COMMIT: ${{ inputs.source_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/column-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/column-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          scripts/prepare-remote-interaction.ps1
      - name: Insert Chinese at a wrapping line edge on gdi
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python tests/cjk_insert_wrap.py gdi
      - name: Insert Chinese at a wrapping line edge on directx
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python tests/cjk_insert_wrap.py directx
      - name: Record the complete margin-neighbour diagnostic rows
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python tests/column_edge_audit.py --output research/column-edge-observed.json
      - name: Compare all 728 reported cells with the original XTerm replies
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python tests/column_press_cells.py --product
      - name: Check the VT and Windows console rows after edits (GDI)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python tests/column_edit_native.py gdi
      - name: Check the VT and Windows console rows after edits (DirectX)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python tests/column_edit_native.py directx
      - name: Prepare PNG capture for the two physical gestures
        id: images
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python -m pip install Pillow==13.0.0
      - name: Copy and paste a moving two-row Unicode rectangle (GDI)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: python tests/column_rectangle_paste.py gdi
      - name: Copy and paste a moving two-row Unicode rectangle (DirectX)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: python tests/column_rectangle_paste.py directx
      - name: Follow released rectangles across pane edits (GDI)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: python tests/selection_block_row_edit.py --pane gdi
      - name: Follow released rectangles across pane edits (DirectX)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: python tests/selection_block_row_edit.py --pane directx
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: column-cells-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/column-pane-*.json
            research/column-pane-*-edited.png
            research/column-rectangle-*/
            research/column-rectangle-*-observed.json
            research/column-press-observed.json
            research/column-cjk-insert-wrap-*.json
            research/column-edge-observed.json
            research/column-edit-native-*.json
            build/column-product/SOURCE-HOST.json
            build/interaction-dependencies/environment.json
          if-no-files-found: error
