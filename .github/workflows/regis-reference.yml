name: Pinned ReGIS reference

on:
  workflow_call:
    inputs:
      bank_start: {type: boolean, default: false}
      first_expose: {type: boolean, default: false}

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install independent XTerm and private display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxt-dev libxaw7-dev libxft-dev libncurses-dev libxtst6 xfonts-base xvfb xauth python3-pil
      - name: Build pinned upstream with ReGIS explicitly enabled
        run: |
          set -o pipefail
          mkdir -p build/regis-reference/source
          git init /tmp/nemoterm-regis-reference
          git -C /tmp/nemoterm-regis-reference remote add origin https://github.com/ThomasDickey/xterm-snapshots.git
          git -C /tmp/nemoterm-regis-reference fetch --depth 1 origin 5c75ead9a75d4b2e666ca06fa94503b5766ed93f
          git -C /tmp/nemoterm-regis-reference checkout --detach FETCH_HEAD
          cd /tmp/nemoterm-regis-reference
          ./configure --enable-regis-graphics 2>&1 | tee "$GITHUB_WORKSPACE/build/regis-reference/configure.log"
          make -j2 2>&1 | tee "$GITHUB_WORKSPACE/build/regis-reference/build.log"
          cc -dM -E -I. $(pkg-config --cflags xft) -include xtermcfg.h -include ptyx.h - </dev/null > "$GITHUB_WORKSPACE/build/regis-reference/defines.txt"
          grep -Eq '^#define OPT_REGIS_GRAPHICS 1$' "$GITHUB_WORKSPACE/build/regis-reference/defines.txt"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/build/regis-reference/upstream-commit.txt"
          cp xterm xtermcfg.h config.log "$GITHUB_WORKSPACE/build/regis-reference/"
          for file in graphics_regis.c graphics_regis.h graphics_sixel.c graphics.c graphics.h charproc.c util.c fontutils.c xterm.h VTPrsTbl.c ptyx.h ctlseqs.ms configure.in COPYING; do
            cp "$file" "$GITHUB_WORKSPACE/build/regis-reference/source/"
          done
          cd "$GITHUB_WORKSPACE/build/regis-reference"
          sha256sum xterm source/* > source-executable-sha256.txt
          ./xterm -version > version.txt
          dpkg-query -W > packages.txt
      - name: Capture original replies and stable pixels over both transports
        env:
          CAPTURE_MODE: ${{ inputs.first_expose && '--first-expose' || inputs.bank_start && '--bank-start' || '--repaint' }}
        run: |
          set -o pipefail
          /usr/bin/python3 tests/xterm_regis_oracle.py --xterm build/regis-reference/xterm --output build/regis-reference/observations.json "$CAPTURE_MODE" 2>&1 | tee build/regis-reference/capture.log
      - name: Capture independent fixed-grid font masks used by the reference
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          gcc -std=c11 -O1 -Wall -Wextra -Werror tests/regis_fixed_font_probe.c -lX11 -o build/regis-reference/fixed-font-probe
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' build/regis-reference/fixed-font-probe build/regis-reference/fixed-font.bin | tee build/regis-reference/fixed-font.log
          sha256sum tests/regis_fixed_font_probe.c build/regis-reference/fixed-font-probe build/regis-reference/fixed-font.bin > build/regis-reference/fixed-font-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regis-reference-${{ github.sha }}
          path: build/regis-reference/
          if-no-files-found: error
          retention-days: 30
