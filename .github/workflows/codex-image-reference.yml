name: Independent Windows console image paste
on:
  workflow_call:
    inputs:
      draft_order: {type: boolean, default: false}
permissions: {contents: read}
jobs:
  reference:
    runs-on: windows-2025
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: {host: [conpty, winpty], phase: [first, after-turn]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12', architecture: x64}
      - name: Install the reference hosts and pinned client
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r tests/claude-pty-requirements.txt
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          python -m pip install Pillow==13.0.0
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          npm ci --prefix tools/codex-fixture --ignore-scripts --no-audit --no-fund
          exit $LASTEXITCODE
      - name: Compare native clipboard records before and after the first reply
        env:
          DRAFT_ORDER: ${{ inputs.draft_order && 'yes' || 'no' }}
          REFERENCE_HOST: ${{ matrix.host }}
          STARTUP_PHASE: ${{ matrix.phase }}
        run: |
          $clients=@(Get-ChildItem tools/codex-fixture/node_modules -Recurse -Filter codex.exe)
          if ($clients.Count -ne 1) {throw 'Expected one pinned Codex client'}
          $opts=@()
          if ($env:DRAFT_ORDER -eq 'yes') {$opts+='--draft-order'}
          python tests/codex_image_reference.py @opts --codex $clients[0].FullName --host $env:REFERENCE_HOST --phase $env:STARTUP_PHASE
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: codex-${{ inputs.draft_order && 'draft' || 'image' }}-reference-${{ matrix.host }}-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/codex-image-reference/*.json
            build/codex-image-reference/*.vt
            build/codex-image-reference/helper-stderr.txt
            build/codex-image-reference/trial-*/*.json
            build/codex-image-reference/trial-*/*.vt
            build/codex-image-reference/trial-*/helper-stderr.txt
          if-no-files-found: error
