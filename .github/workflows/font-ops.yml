name: OSC 50 face queries and glyphs on Windows
on:
  workflow_call:
    inputs:
      product_run: {required: true, type: string}
      product_commit: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  records:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: {renderer: [gdi, directx]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch the exact single executable
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.product_run }}
          PRODUCT_COMMIT: ${{ inputs.product_commit }}
        run: |
          scripts/fetch-ci-product.ps1 -Run $env:PRODUCT_RUN -Commit $env:PRODUCT_COMMIT -Destination build/font-ops-product
          "NEMOTERM_TEST_EXE=$((Resolve-Path build/font-ops-product/nemoterm.exe).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install and identify Sarasa Light
        run: scripts/prepare-remote-interaction.ps1
      - name: Compare font replies and actual glyphs against separate cold windows
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/font_ops_window.py --renderer $env:RENDERER
      - name: Check duplicate tabs, inactive changes and persistent profile
        if: ${{ !cancelled() && env.NEMOTERM_TEST_FONT != '' }}
        env:
          RENDERER: ${{ matrix.renderer }}
        run: python tests/font_ops_tabs.py --renderer $env:RENDERER
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: font-ops-${{ matrix.renderer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/font-ops-*-observed.json
            research/font-ops-*.png
            build/font-ops/*.json
            build/interaction-dependencies/environment.json
            build/font-ops-product/SOURCE-HOST.json
          if-no-files-found: error
