name: Independent protocol reference

on:
  workflow_dispatch:
    inputs:
      family:
        description: Pinned upstream comparison or an isolated ConPTY wire diagnostic
        type: choice
        default: identity
        options:
          - identity
          - guarded-area
          - attribute-colour
          - selection-colour
          - cursor-charset
          - reset-palette
          - x11-colour
          - sidecar-wire
          - kitty-graphics
          - kitty-compression
          - kitty-features
          - kitty-query-errors
          - kitty-relative
          - kitty-unicode
          - kitty-unicode-geometry
          - unicode-text-boundaries
          - all
  push:
    paths:
      - 'tests/xterm_identity_oracle.py'
      - 'tests/xterm_state_oracle.py'
      - '.github/workflows/protocol-reference.yml'

permissions:
  contents: read
  actions: read

jobs:
  xterm-reference:
    if: inputs.family != 'sidecar-wire' && inputs.family != 'kitty-graphics' && inputs.family != 'kitty-compression' && inputs.family != 'kitty-features' && inputs.family != 'kitty-query-errors' && inputs.family != 'kitty-relative' && inputs.family != 'kitty-unicode' && inputs.family != 'kitty-unicode-geometry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install XTerm build and private display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxt-dev libxaw7-dev libxft-dev libncurses-dev xvfb
      - name: Build pinned upstream reference
        run: |
          git init /tmp/nemoterm-xterm-reference
          git -C /tmp/nemoterm-xterm-reference remote add origin https://github.com/ThomasDickey/xterm-snapshots.git
          git -C /tmp/nemoterm-xterm-reference fetch --depth 1 origin 5c75ead9a75d4b2e666ca06fa94503b5766ed93f
          git -C /tmp/nemoterm-xterm-reference checkout --detach FETCH_HEAD
          cd /tmp/nemoterm-xterm-reference
          ./configure
          make -j2
      - name: Record reference identity and create a fresh output directory
        run: |
          mkdir -p build/protocol-reference
          git -C /tmp/nemoterm-xterm-reference rev-parse HEAD > build/protocol-reference/upstream-commit.txt
          git rev-parse HEAD > build/protocol-reference/fixture-commit.txt
          sha256sum /tmp/nemoterm-xterm-reference/xterm > build/protocol-reference/executable-sha256.txt
          /tmp/nemoterm-xterm-reference/xterm -version > build/protocol-reference/version.txt
          dpkg-query -W -f='${Package}\t${Version}\n' xvfb libx11-6 libxft2 > build/protocol-reference/x11-packages.txt
      - name: Compare identity argument and cursor semantics
        if: ${{ (success() || failure()) && (inputs.family == '' || inputs.family == 'identity' || inputs.family == 'all') }}
        run: python3 tests/xterm_identity_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/identity-xterm.json
      - name: Compare guarded-area and pending-wrap semantics
        if: ${{ (success() || failure()) && (inputs.family == 'guarded-area' || inputs.family == 'all') }}
        run: python3 tests/xterm_guarded_area_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/guarded-area-xterm.json
      - name: Compare attribute-colour query and reset semantics
        if: ${{ (success() || failure()) && (inputs.family == 'attribute-colour' || inputs.family == 'all') }}
        run: python3 tests/xterm_attribute_colour_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/attribute-colour-xterm.json
      - name: Compare selection-colour query and reset semantics
        if: ${{ (success() || failure()) && (inputs.family == 'selection-colour' || inputs.family == 'all') }}
        run: python3 tests/xterm_selection_colour_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/selection-colour-xterm.json
      - name: Compare cursor and character-set restore semantics
        if: ${{ (success() || failure()) && (inputs.family == 'cursor-charset' || inputs.family == 'all') }}
        run: python3 tests/xterm_cursor_charset_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/cursor-charset-xterm.json
      - name: Capture indexed and dynamic palette reset boundaries
        if: ${{ (success() || failure()) && (inputs.family == 'reset-palette' || inputs.family == 'all') }}
        run: python3 tests/xterm_reset_palette_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/reset-palette-xterm.json
      - name: Compare named-colour replies against the pinned Xorg table
        if: ${{ (success() || failure()) && (inputs.family == 'x11-colour' || inputs.family == 'all') }}
        run: python3 tests/xterm_x11_colour_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/x11-colour-xterm.json
      - name: Observe Unicode image text boundaries independently of graphics
        if: ${{ (success() || failure()) && (inputs.family == 'unicode-text-boundaries' || inputs.family == 'all') }}
        run: python3 tests/xterm_unicode_boundaries_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/unicode-text-boundaries-xterm.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: protocol-reference-${{ inputs.family || 'identity' }}-${{ github.sha }}
          path: build/protocol-reference/
          if-no-files-found: error

  kitty-graphics-reference:
    if: github.event_name == 'workflow_dispatch' && (inputs.family == 'kitty-graphics' || inputs.family == 'kitty-compression' || inputs.family == 'kitty-features' || inputs.family == 'kitty-query-errors' || inputs.family == 'kitty-relative' || inputs.family == 'kitty-unicode' || inputs.family == 'kitty-unicode-geometry')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      KITTY_SANITIZE: '0'
      KITTY_REFERENCE_FAMILY: ${{ inputs.family }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch the pinned unmodified upstream source
        run: |
          mkdir -p build/kitty-reference
          git init "$RUNNER_TEMP/kitty-reference"
          git -C "$RUNNER_TEMP/kitty-reference" remote add origin https://github.com/kovidgoyal/kitty.git
          git -C "$RUNNER_TEMP/kitty-reference" fetch --depth 1 origin 8e5487e9d4a1dd79c3a769e0ba82326b8ad7c37f
          git -C "$RUNNER_TEMP/kitty-reference" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/kitty-reference" rev-parse HEAD > build/kitty-reference/upstream-commit.txt
          git rev-parse HEAD > build/kitty-reference/fixture-commit.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: ${{ runner.temp }}/kitty-reference/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build upstream with its own CI recipe
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/kitty-reference"
          python .github/workflows/ci.py build 2>&1 | tee "$GITHUB_WORKSPACE/build/kitty-reference/upstream-build.log"
      - name: Install the pinned REA process recorder on this disposable runner
        run: |
          npm install --prefix "$RUNNER_TEMP/kitty-rea" --no-audit --no-fund rea-agents@6.8.0
          cp "$RUNNER_TEMP/kitty-rea/package-lock.json" build/kitty-reference/rea-package-lock.json
      - name: Declare and capture the bounded reference process
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path('build/kitty-reference').resolve()
          source = Path(os.environ['RUNNER_TEMP']) / 'kitty-reference'
          family = os.environ['KITTY_REFERENCE_FAMILY']
          fixtures = {'kitty-graphics': 'kitty_graphics_oracle.py',
                      'kitty-compression': 'kitty_compression_oracle.py',
                      'kitty-features': 'kitty_features_oracle.py',
                      'kitty-query-errors': 'kitty_query_errors_oracle.py',
                      'kitty-relative': 'kitty_relative_oracle.py',
                      'kitty-unicode': 'kitty_unicode_oracle.py',
                      'kitty-unicode-geometry': 'kitty_unicode_geometry_oracle.py'}
          fixture = (Path('tests') / fixtures[family]).resolve()
          output = base / 'observations.json'
          output.write_text('{"status":"not-started"}\n')
          scenario = dict(
              executable=str(source / 'kitty/launcher/kitty'),
              arguments=['+runpy', 'import runpy; runpy.run_path(' + repr(str(fixture)) + ', run_name="__main__")'],
              working_directory=str(source),
              environment=dict(NEMOTERM_KITTY_REFERENCE_OUTPUT=str(output),
                               NEMOTERM_KITTY_REFERENCE_SOURCE=str(source), CI='true',
                               SLANGC='/tmp/slang/bin/slangc'),
              filesystem_observation_paths=[str(output)], events=[],
              terminal=dict(columns=120, rows=40, scrollback=100),
              timeout_ms=60000, idle_timeout_ms=20000, finalization_ms=2000,
              limits=dict(output_bytes=2097152 if family in ('kitty-unicode','kitty-unicode-geometry') else 1048576 if family == 'kitty-query-errors' else 524288 if family == 'kitty-features' else 262144,
                          file_bytes=4194304 if family in ('kitty-relative', 'kitty-unicode','kitty-unicode-geometry') else 1048576 if family == 'kitty-query-errors' else 524288, files=10,
                          filesystem_depth=1, processes=16))
          (base / 'scenario.json').write_text(json.dumps(scenario, indent=2) + '\n')
          PY
          "$RUNNER_TEMP/kitty-rea/node_modules/.bin/rea" capture-process build/kitty-reference/scenario.json --json > build/kitty-reference/rea-evidence.json 2> build/kitty-reference/rea-progress.jsonl
      - name: Verify capture completion and preserve its identity
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          base = Path('build/kitty-reference')
          evidence = json.loads((base / 'rea-evidence.json').read_text())
          if 'evidence_id' not in evidence:
              evidence = evidence.get('result', evidence.get('data', evidence))
          assert evidence.get('evidence_id'), evidence
          capture = evidence['normalized_result']
          assert capture['exit']['reason'] == 'exited' and capture['exit']['code'] == 0, capture['exit']
          assert capture['cleanup']['owned_process_group'] == 'verified', capture['cleanup']
          assert capture['cleanup']['temporary_root'] == 'removed', capture['cleanup']
          assert not capture['cleanup'].get('unverified_processes'), capture['cleanup']
          assert not capture['truncated'], capture['truncated']
          observed = json.loads((base / 'observations.json').read_text())
          assert observed['status'] == 'complete', observed.get('status')
          if os.environ['KITTY_REFERENCE_FAMILY'] == 'kitty-compression':
              assert observed['family'] == 'kitty-compression'
              assert observed['case_count'] == 26 and observed['state_count'] == 36, (observed['case_count'], observed['state_count'])
              assert [c['name'] for c in observed['cases']] == observed['expected_cases']
          elif os.environ['KITTY_REFERENCE_FAMILY'] == 'kitty-features':
              assert observed['family'] == 'kitty-features'
              assert observed['case_count'] == 84 and observed['state_count'] == 176, (observed['case_count'], observed['state_count'])
              assert [c['name'] for c in observed['cases']] == observed['expected_cases']
          elif os.environ['KITTY_REFERENCE_FAMILY'] == 'kitty-query-errors':
              assert observed['family'] == 'kitty-query-errors'
              assert observed['case_count'] == 54 and observed['state_count'] == 216, (observed['case_count'], observed['state_count'])
              assert [c['name'] for c in observed['cases']] == observed['expected_cases']
          elif os.environ['KITTY_REFERENCE_FAMILY'] == 'kitty-relative':
              assert observed['family'] == 'kitty-relative'
              assert observed['case_count'] == 60 and observed['state_count'] == 238, (observed['case_count'], observed['state_count'])
              assert [c['name'] for c in observed['cases']] == observed['expected_cases']
              assert observed['upstream_tests']['names'] == ['test_image_parents', 'test_image_put', 'test_gr_scroll']
              assert observed['upstream_tests']['successful'] and not observed['upstream_tests']['skipped']
          elif os.environ['KITTY_REFERENCE_FAMILY'] == 'kitty-unicode-geometry':
              assert observed['family'] == 'kitty-unicode-geometry'
              assert observed['case_count'] == observed['state_count'] == 153
              assert len(observed['cases']) == 153
              assert observed['upstream_tests']['run'] == 3
              assert observed['upstream_tests']['successful'] and not observed['upstream_tests']['skipped']
          elif os.environ['KITTY_REFERENCE_FAMILY'] == 'kitty-unicode':
              assert observed['family'] == 'kitty-unicode'
              assert observed['case_count'] == 97 and observed['state_count'] == 728, (observed['case_count'], observed['state_count'])
              assert len(observed['diacritic_codepoints']) == 297
              assert [c['name'] for c in observed['cases']] == observed['expected_cases']
              assert observed['upstream_tests']['run'] == 8
              assert observed['upstream_tests']['successful'] and not observed['upstream_tests']['skipped']
          else:
              assert observed['case_count'] == 43 and observed['state_count'] == 101
          digest = hashlib.sha256((base / 'observations.json').read_bytes()).hexdigest()
          assert any(x.get('sha256') == digest for x in capture['files_after']), 'Observation digest missing from REA snapshot'
          summary = dict(evidence_id=evidence['evidence_id'],
                         provider=evidence['provider'], exit=capture['exit'],
                         cleanup=capture['cleanup'], limitations=evidence['limitations'],
                         observations_sha256=digest, case_count=observed['case_count'],
                         state_count=observed['state_count'])
          (base / 'rea-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.family }}-reference-${{ github.sha }}
          path: build/kitty-reference/
          if-no-files-found: error
          retention-days: 14

  sidecar-build:
    if: github.event_name == 'workflow_dispatch' && inputs.family == 'sidecar-wire'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build the same MinGW frontend used by comparison CI
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S vendor/putty-0.85 -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel \
            '-DCMAKE_C_FLAGS_MINSIZEREL=-Os -ffunction-sections -fdata-sections' \
            '-DCMAKE_EXE_LINKER_FLAGS=-Wl,--gc-sections -static-libgcc' -DPUTTY_GSSAPI=OFF
          cmake --build build --target pterm --parallel 4
          mkdir -p dist
          cp build/nemoterm.exe dist/
      - name: Prepare the pinned sidecar host
        shell: pwsh
        run: ./scripts/fetch-conpty.ps1 -Architecture x64 -Destination dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sidecar-diagnostic-runtime-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  sidecar-wire:
    needs: sidecar-build
    runs-on: windows-2025
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        host: [upstream, source]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the identical frontend and runtime for both observations
        shell: pwsh
        run: |
          gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name "sidecar-diagnostic-runtime-$env:GITHUB_SHA" --dir dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install frida==17.24.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Substitute the verified source-built console host for the A/B comparison
        if: matrix.host == 'source'
        shell: pwsh
        run: |
          gh run download 43458313477 --repo "$env:GITHUB_REPOSITORY" --name nemoterm-single-exe-x64-ea042bc34b43c10c91b126240a48fafb11bfd6f5 --dir build/source-host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sourceHost = 'build/source-host/nemoterm.exe'
          $sha = (Get-FileHash -LiteralPath $sourceHost -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '470491a27c2899396482c4224293382fee039b73d20c8366e4d2bc7222e5af0e') { throw 'Source host hash mismatch' }
          Copy-Item -LiteralPath $sourceHost -Destination dist/OpenConsole.exe
          [ordered]@{
            SourceRun = 43458313477
            SourceArtifact = 14057575850
            SourceCommit = 'ea042bc34b43c10c91b126240a48fafb11bfd6f5'
            SHA256 = $sha
            Mode = 'The combined image handles --headless as OpenConsole; its GUI is unused.'
            Scope = 'Diagnostic host replacement only; conpty.dll and the MinGW frontend are unchanged.'
          } | ConvertTo-Json | Set-Content dist/SOURCE-HOST-OVERRIDE.json -Encoding utf8
      - name: Trace strict guarded-area replies without changing assertions
        timeout-minutes: 3
        shell: pwsh
        env:
          NEMOTERM_PROTOCOL_WIRE_TRACE: '1'
          NEMOTERM_TEST_TRACEBACK_SECONDS: '30'
        run: |
          python tests/guarded_area_window_smoke.py 2>&1 | Tee-Object guarded-area-wire.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sidecar-wire-${{ matrix.host }}-${{ github.sha }}
          path: |
            research/guarded-area-wire.jsonl
            research/guarded-area-observed.json
            guarded-area-wire.log
            dist/CONPTY-RUNTIME.json
            dist/SOURCE-HOST-OVERRIDE.json
          if-no-files-found: error
