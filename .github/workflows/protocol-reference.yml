name: Independent protocol reference

on:
  workflow_dispatch:
    inputs:
      family:
        description: Pinned XTerm comparison or an isolated ConPTY wire diagnostic
        type: choice
        default: identity
        options:
          - identity
          - guarded-area
          - attribute-colour
          - selection-colour
          - cursor-charset
          - reset-palette
          - sidecar-wire
          - all
  push:
    paths:
      - 'tests/xterm_identity_oracle.py'
      - 'tests/xterm_state_oracle.py'
      - '.github/workflows/protocol-reference.yml'

permissions:
  contents: read
  actions: read

jobs:
  xterm-reference:
    if: inputs.family != 'sidecar-wire'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install XTerm build and private display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxt-dev libxaw7-dev libxft-dev libncurses-dev xvfb
      - name: Build pinned upstream reference
        run: |
          git init /tmp/nemoterm-xterm-reference
          git -C /tmp/nemoterm-xterm-reference remote add origin https://github.com/ThomasDickey/xterm-snapshots.git
          git -C /tmp/nemoterm-xterm-reference fetch --depth 1 origin 5c75ead9a75d4b2e666ca06fa94503b5766ed93f
          git -C /tmp/nemoterm-xterm-reference checkout --detach FETCH_HEAD
          cd /tmp/nemoterm-xterm-reference
          ./configure
          make -j2
      - name: Record reference identity and create a fresh output directory
        run: |
          mkdir -p build/protocol-reference
          git -C /tmp/nemoterm-xterm-reference rev-parse HEAD > build/protocol-reference/upstream-commit.txt
          git rev-parse HEAD > build/protocol-reference/fixture-commit.txt
          sha256sum /tmp/nemoterm-xterm-reference/xterm > build/protocol-reference/executable-sha256.txt
          /tmp/nemoterm-xterm-reference/xterm -version > build/protocol-reference/version.txt
      - name: Compare identity argument and cursor semantics
        if: ${{ (success() || failure()) && (inputs.family == '' || inputs.family == 'identity' || inputs.family == 'all') }}
        run: python3 tests/xterm_identity_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/identity-xterm.json
      - name: Compare guarded-area and pending-wrap semantics
        if: ${{ (success() || failure()) && (inputs.family == 'guarded-area' || inputs.family == 'all') }}
        run: python3 tests/xterm_guarded_area_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/guarded-area-xterm.json
      - name: Compare attribute-colour query and reset semantics
        if: ${{ (success() || failure()) && (inputs.family == 'attribute-colour' || inputs.family == 'all') }}
        run: python3 tests/xterm_attribute_colour_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/attribute-colour-xterm.json
      - name: Compare selection-colour query and reset semantics
        if: ${{ (success() || failure()) && (inputs.family == 'selection-colour' || inputs.family == 'all') }}
        run: python3 tests/xterm_selection_colour_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/selection-colour-xterm.json
      - name: Compare cursor and character-set restore semantics
        if: ${{ (success() || failure()) && (inputs.family == 'cursor-charset' || inputs.family == 'all') }}
        run: python3 tests/xterm_cursor_charset_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/cursor-charset-xterm.json
      - name: Capture indexed and dynamic palette reset boundaries
        if: ${{ (success() || failure()) && (inputs.family == 'reset-palette' || inputs.family == 'all') }}
        run: python3 tests/xterm_reset_palette_oracle.py --xterm /tmp/nemoterm-xterm-reference/xterm --output build/protocol-reference/reset-palette-xterm.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: protocol-reference-${{ inputs.family || 'identity' }}-${{ github.sha }}
          path: build/protocol-reference/
          if-no-files-found: error

  sidecar-build:
    if: github.event_name == 'workflow_dispatch' && inputs.family == 'sidecar-wire'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build the same MinGW frontend used by comparison CI
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S vendor/putty-0.85 -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel \
            '-DCMAKE_C_FLAGS_MINSIZEREL=-Os -ffunction-sections -fdata-sections' \
            '-DCMAKE_EXE_LINKER_FLAGS=-Wl,--gc-sections -static-libgcc' -DPUTTY_GSSAPI=OFF
          cmake --build build --target pterm --parallel 4
          mkdir -p dist
          cp build/nemoterm.exe dist/
      - name: Prepare the pinned sidecar host
        shell: pwsh
        run: ./scripts/fetch-conpty.ps1 -Architecture x64 -Destination dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sidecar-diagnostic-runtime-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  sidecar-wire:
    needs: sidecar-build
    runs-on: windows-2025
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        host: [upstream, source]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the identical frontend and runtime for both observations
        shell: pwsh
        run: |
          gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name "sidecar-diagnostic-runtime-$env:GITHUB_SHA" --dir dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install frida==17.24.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Substitute the verified source-built console host for the A/B comparison
        if: matrix.host == 'source'
        shell: pwsh
        run: |
          gh run download 43458313477 --repo "$env:GITHUB_REPOSITORY" --name nemoterm-single-exe-x64-ea042bc34b43c10c91b126240a48fafb11bfd6f5 --dir build/source-host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sourceHost = 'build/source-host/nemoterm.exe'
          $sha = (Get-FileHash -LiteralPath $sourceHost -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '470491a27c2899396482c4224293382fee039b73d20c8366e4d2bc7222e5af0e') { throw 'Source host hash mismatch' }
          Copy-Item -LiteralPath $sourceHost -Destination dist/OpenConsole.exe
          [ordered]@{
            SourceRun = 43458313477
            SourceArtifact = 14057575850
            SourceCommit = 'ea042bc34b43c10c91b126240a48fafb11bfd6f5'
            SHA256 = $sha
            Mode = 'The combined image handles --headless as OpenConsole; its GUI is unused.'
            Scope = 'Diagnostic host replacement only; conpty.dll and the MinGW frontend are unchanged.'
          } | ConvertTo-Json | Set-Content dist/SOURCE-HOST-OVERRIDE.json -Encoding utf8
      - name: Trace strict guarded-area replies without changing assertions
        timeout-minutes: 3
        shell: pwsh
        env:
          NEMOTERM_PROTOCOL_WIRE_TRACE: '1'
          NEMOTERM_TEST_TRACEBACK_SECONDS: '30'
        run: |
          python tests/guarded_area_window_smoke.py 2>&1 | Tee-Object guarded-area-wire.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sidecar-wire-${{ matrix.host }}-${{ github.sha }}
          path: |
            research/guarded-area-wire.jsonl
            research/guarded-area-observed.json
            guarded-area-wire.log
            dist/CONPTY-RUNTIME.json
            dist/SOURCE-HOST-OVERRIDE.json
          if-no-files-found: error
